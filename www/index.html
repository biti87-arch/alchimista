nalità.","pot":9},{"nome":"Essenza di kraken","liv":19,"flavor":"Un inchiostro tossico che serra la gola e blocca ogni movimento.","tox":9,"ts":"Tempra","effetto":"La vittima è immobilizzata e non può parlare per 1d4 round; se fallisce il tiro di 5 o più, cade anche priva di sensi per 1 round. Chi supera il Tiro Salvezza è comunque intralciato per 1 round.","pot":9},{"nome":"Estratto di loto nero","liv":19,"flavor":"Quella estratta dal loto nero è una, se non la più potente, tossina vegetale conosciuta in natura. Il loto nero è famoso per aver dato il nome alla più famosa disciplina marziale originaria del lontano est ed è usato dai sicari skaven del clan Eshin per sbarazzarsi rapidamente delle vittime.","tox":9,"ts":"Volontà","effetto":"La vittima è confusa e inferma per 1 ora.","pot":9},{"nome":"Veleno di verme purpureo reale","liv":19,"flavor":"Una versione perfezionata del veleno del verme purpureo, che amplifica ogni ferita.","tox":9,"ts":"Nessuno","effetto":"Per 5 turni la vittima subisce 8 danni extra per ciascun attacco subito.","pot":9},{"nome":"Distillato di malapietra","liv":20,"flavor":"Ottenuto dall’infuso di un pezzetto infinitesimamente piccolo di malapietra, o mutapietra che dir si voglia, questo veleno fu usato dagli skaven per uccidere un potente necromante, nonché il primo e più potente vampiro e lich che la storia abbia mai conosciuto.","tox":9,"ts":"Tempra","effetto":"La vittima subisce 7d8+20 danni, compresi non morti ed esterni corporei. Se supera il tiro, la vittima subisce la metà dei danni.","pot":9},{"nome":"Lacrima di divinità caduta","liv":20,"flavor":"Una goccia del pianto di un dio morente: mostra alla vittima la propria fine.","tox":9,"ts":"Volontà (vedi testo)","effetto":"La vittima è travolta dalla visione della propria morte. Effettua un Tiro Salvezza su Volontà per dubitare della visione: se lo supera, subisce comunque 8d6 danni ed è barcollante per 1 round. Se lo fallisce, deve immediatamente superare un Tiro Salvezza su Tempra o morire (effetto di [MORTE]); se supera questo secondo tiro, l’orrore le devasta comunque il corpo infliggendole 15d6 danni. Di questo veleno se ne può creare al massimo una dose al giorno.","pot":9},{"nome":"Sangue del primo vampiro","liv":20,"flavor":"Il sangue del progenitore di tutti i vampiri fa ribellare quello della vittima.","tox":9,"ts":"Tempra","effetto":"La vittima subisce 6d6 danni. Inoltre, se non supera il tiro, il sangue infetto si ribella: per 1 minuto, ogni volta che la vittima subisce danni in mischia sanguina copiosamente, subendo 1d6 danni aggiuntivi cumulabili a ogni colpo (effetto di [SANGUINAMENTO]), e non può recuperare Punti Ferita finché sta sanguinando. Un Tiro Salvezza su Tempra all’inizio del proprio turno o una cura magica pongono fine al sanguinamento. Superare il Tiro Salvezza iniziale dimezza i danni e annulla il sanguinamento.","pot":9}],"doti":[{"nome":"Agenti inibitori extra","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista mutagenista di 1° livello.","alt":[{"campo":"mutagenista","liv":1}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Ogni giorno l’alchimista può inoculare un qualsiasi numero di mutageni alle creature senza livelli di alchimista."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Alterazione molecolare","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 13° livello.","alt":[{"campo":"tossicologo","liv":13}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Tre volte al giorno, l’alchimista può cambiare il tipo di Tiro Salvezza di un veleno da Tempra a Volontà o da Volontà a Tempra, ma la sua CD si riduce di 2. Il cambiamento deve essere deciso alla creazione del veleno e vale per tutte le dosi create con quel singolo reagente infuso."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Attacco poderoso intossicante","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 2° livello o alchimista di 6° livello; Forza 13 o Destrezza 13.","alt":[{"campo":"tossicologo","liv":2},{"campo":null,"liv":6}],"doti":[],"altro":["Forza 13 o Destrezza 13"],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista può scegliere di subire penalità -2 ai tiri per colpire e alla BMC per ottenere bonus +1 alla CD del primo veleno inoculato in quel turno. Quando il suo bonus di attacco base raggiunge +4, e successivamente ogni 4 punti, la penalità aumenta di -2 e il bonus alla CD di +1. La scelta va fatta prima del tiro per colpire e le penalità durano fino all’inizio del suo prossimo turno."],"speciale":["Non si può usare insieme ai talenti Attacco poderoso o Mira letale."],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Attacco venefico concentrato","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 3° livello.","alt":[{"campo":"tossicologo","liv":3}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Come azione standard l’alchimista può effettuare un unico attacco con un’arma avvelenata con bonus +1 al tiro per colpire. Questo bonus diventa +2 all’8° livello e +3 al 15°. Se si effettua l’attacco come azione di round completo il bonus aumenta di +1."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Attacco venefico sicuro","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 2° livello o alchimista di 6° livello.","alt":[{"campo":"tossicologo","liv":2},{"campo":null,"liv":6}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Quando l’alchimista ottiene un Fallimento critico con un’arma avvelenata, ottiene vantaggio nel tiro sulla relativa tabella."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Avvelenamento rapido","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 1° livello o alchimista di 4° livello.","alt":[{"campo":"tossicologo","liv":1},{"campo":null,"liv":4}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Applicare un veleno a un’arma o a una munizione è un’azione di movimento anziché un’azione standard."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombardamento sicuro","cat":"bombe","mod":null,"pot":null,"req":{"testo":"Alchimista bombarolo di 17° livello.","alt":[{"campo":"bombarolo","liv":17}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Due volte al giorno, quando il personaggio ottiene un 1 naturale in un tiro per colpire con una bomba alchemica, può ripetere tale tiro."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombe a go-go","cat":"bombe","mod":null,"pot":null,"req":{"testo":"Alchimista bombarolo di 3° livello.","alt":[{"campo":"bombarolo","liv":3}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Tramite alchimia di base, per ciascun reagente infuso l’alchimista crea tre esemplari identici di bomba alchemica, anziché due."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombe adesive","cat":"bombe","mod":1,"pot":null,"req":{"testo":"Alchimista bombarolo di 4° livello o alchimista di 8° livello.","alt":[{"campo":"bombarolo","liv":4},{"campo":null,"liv":8}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Una bomba alchemica così modificata infligge al bersaglio primario i danni da spargimento nei seguenti 2 turni (ma non gli effetti speciali della bomba). La vittima o un’altra creatura adiacente può rimuovere la bomba adesiva con un’azione standard."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombe debilitanti","cat":"bombe","mod":1,"pot":null,"req":{"testo":"Alchimista bombarolo di 6° livello o alchimista di 10° livello.","alt":[{"campo":"bombarolo","liv":6},{"campo":null,"liv":10}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Una bomba alchemica così modificata provoca al bersaglio primario una fra le seguenti condizioni a scelta fino all'inizio del turno successivo dell’alchimista: abbagliato, assordato o colto alla sprovvista. Il bersaglio può negare tale debilitazione superando un Tiro Salvezza su Tempra con CD 10 + metà livello di alchimista + bonus di Intelligenza. Una bomba Sonica a cui si sceglie di applicare la condizione assordato, aumenta di 2 la CD del proprio Tiro Salvezza."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombe debilitanti magistrale","cat":"bombe","mod":null,"pot":null,"req":{"testo":"Alchimista bombarolo di 18° livello; Dote da alchimista Bombe debilitanti supremo.","alt":[{"campo":"bombarolo","liv":18}],"doti":["Bombe debilitanti supremo"],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["I bersagli subiscono -4 al Tiro Salvezza per resistere agli effetti delle Bombe debilitanti (o -6 per gli effetti causati da Bombe debilitanti superiore e Bombe debilitanti supremo)."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombe debilitanti superiore","cat":"bombe","mod":null,"pot":null,"req":{"testo":"Alchimista bombarolo di 10° livello o alchimista di 14° livello; Dote da alchimista Bombe debilitanti.","alt":[{"campo":"bombarolo","liv":10},{"campo":null,"liv":14}],"doti":["Bombe debilitanti"],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Si aggiungono le seguenti condizioni alla lista di quelle selezionabili per Bombe debilitanti: -2 Forza, -2 Destrezza, -2 a tutte le caratteristiche mentali o -3 m alla velocità."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombe debilitanti supremo","cat":"bombe","mod":null,"pot":null,"req":{"testo":"Alchimista bombarolo di 14° livello o alchimista di 18° livello; Dote da alchimista Bombe debilitanti superiore.","alt":[{"campo":"bombarolo","liv":14},{"campo":null,"liv":18}],"doti":["Bombe debilitanti superiore"],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Si aggiungono le seguenti condizioni alla lista di quelle selezionabili per Bombe debilitanti: -4 Forza, -4 Destrezza o -4 a tutte le caratteristiche mentali. Se si applica uno degli effetti elencati dalla versione base di Bomba debilitante, il bersaglio subisce contro di esso -2 al Tiro Salvezza per resistervi."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombe diluite","cat":"bombe","mod":null,"pot":null,"req":{"testo":"Alchimista bombarolo di 5° livello.","alt":[{"campo":"bombarolo","liv":5}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista sceglie un tipo di bomba alchemica la cui formula sia già nel suo formulario e, tramite alchimia di base, ne prepara ogni giorno un gran numero in versione diluita (cioè meno potente). L’alchimista può lanciare queste bombe senza consumare reagenti infusi. Hanno come livello di oggetto la metà (per difetto) del livello più alto posseduto per quel tipo di bomba e usano la riga dispari del profilo generico pari o inferiore (minimo 1). Bombe potenti si applica; le doti di modifica no."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombe energo-penetranti","cat":"bombe","mod":2,"pot":null,"req":{"testo":"Alchimista bombarolo di 16° livello o alchimista di 20° livello.","alt":[{"campo":"bombarolo","liv":16},{"campo":null,"liv":20}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Una bomba alchemica così modificata ignora fino a 20 punti di RE del tipo di energia prodotto."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombe fumogene","cat":"bombe","mod":0,"pot":null,"req":{"testo":"Alchimista bombarolo di 2° livello o alchimista di 6° livello.","alt":[{"campo":"bombarolo","liv":2},{"campo":null,"liv":6}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Una bomba alchemica così modificata non infligge danni, ma crea una nube di fumo in un'esplosione di raggio 3 m. L’alchimista può scegliere in quale casella dello spazio del bersaglio (o dello spazio in cui atterra la bomba) viene centrata la nube. Le creature entro e fuori l'area in questione sono occultate le une per le altre. Il fumo dura 1 minuto o finché non viene dissipato da un vento forte."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombe potenti","cat":"bombe","mod":null,"pot":null,"req":{"testo":"Alchimista bombarolo di 1° livello o alchimista di 6° livello.","alt":[{"campo":"bombarolo","liv":1},{"campo":null,"liv":6}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista aggiunge metà bonus di Intelligenza al danno inflitto dalle proprie bombe alchemiche, sia al bersaglio primario che al danno da spargimento."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Bombe subacquee","cat":"bombe","mod":1,"pot":null,"req":{"testo":"Alchimista bombarolo di 2° livello o alchimista di 6° livello.","alt":[{"campo":"bombarolo","liv":2},{"campo":null,"liv":6}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Una bomba alchemica così modificata non ha spargimento ma può essere lanciata sott’acqua, anche da fuori. Se la bomba alchemica viaggia attraverso l'acqua, esplode non appena tocca una qualsiasi superficie solida."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Cocktail mutagenico","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista mutagenista di 13° livello.","alt":[{"campo":"mutagenista","liv":13}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Tramite alchimia di base, l’alchimista può usare 2 reagenti infusi per creare e miscelare due mutageni, i quali devono essere diversi e uno di almeno 4 livelli inferiore all’altro. Alla fine del processo viene a crearsi un solo esemplare di mutageno, detto cocktail mutagenico. Il fruitore del cocktail mutagenico ottiene i vantaggi di entrambi i mutageni, a partire da quello con il livello più alto. Un cocktail mutagenico può essere somministrato a un solo fruitore, anche se entrambi i mutageni sono [concentrati]."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Critico intossicante","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 11° livello o alchimista di 14° livello.","alt":[{"campo":"tossicologo","liv":11},{"campo":null,"liv":14}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Quando l’alchimista ottiene un 20 naturale in un tiro per colpire con un’arma avvelenata, la CD del veleno iniettato aumenta di 1."],"speciale":["Se il personaggio è un alchimista tossicologo, la CD del veleno iniettato aumenta di 1 quando mette a segno un colpo critico con un’arma avvelenata."],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Esplosione ampliata","cat":"bombe","mod":1,"pot":null,"req":{"testo":"Alchimista bombarolo di 6° livello o alchimista di 10° livello.","alt":[{"campo":"bombarolo","liv":6},{"campo":null,"liv":10}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Una bomba alchemica così modificata ha un raggio di spargimento aumentato di 1,5 m."],"speciale":["Questa modifica non può essere applicata ad una bomba alchemica già modificata con Esplosione lineare o Esplosione conica."],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Esplosione conica","cat":"bombe","mod":0,"pot":null,"req":{"testo":"Alchimista bombarolo di 6° livello o alchimista di 10° livello.","alt":[{"campo":"bombarolo","liv":6},{"campo":null,"liv":10}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Una bomba alchemica così modificata applica gli effetti dello spargimento in un cono di 4,5 m (o di 6 m se è una bomba Acida) considerando la prima casella come quella di impatto diretto. Lo spargimento è indicativamente nella direzione in cui si scaglia la bomba alchemica. Se il bersaglio occupa più di una singola casella, quella più vicina all’alchimista è la prima a essere influenzata."],"speciale":["Questa modifica non può essere applicata ad una bomba alchemica già modificata con Esplosione lineare o Esplosione ampliata. Se la bomba è stata modificata con Mega-esplosione, il cono diventa di 9 m."],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Esplosione lineare","cat":"bombe","mod":0,"pot":null,"req":null,"testo":["Una bomba alchemica così modificata applica gli effetti dello spargimento in un una linea retta di 4,5 m, considerando la prima casella come quella di impatto diretto. Lo spargimento è indicativamente nella direzione in cui si scaglia la bomba alchemica. Se il bersaglio occupa più di una singola casella, quella più vicina all’alchimista è la prima a essere influenzata."],"speciale":["Questa modifica non può essere applicata ad una bomba alchemica già modificata con Esplosione conica o Esplosione ampliata. Se la bomba è stata modificata con Mega-esplosione, la linea diventa di 18 m."],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Fede tossica","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 10° livello; Devozione a Morathi o a Khaine (vedi Volume 3 – Divinità).","alt":[{"campo":"tossicologo","liv":10}],"doti":[],"altro":["Devozione a Morathi o a Khaine (vedi Volume 3 – Divinità)"],"arch":null,"no_arch":null,"n_pot":0},"testo":["Tre volte al giorno, l’alchimista si può affidare alla propria fede affinché il veleno permanga sull’arma o sulla munizione. Se ciò accade, dopo aver colpito un nemico con un’arma avvelenata, c’è il 33% che la dose non venga consumata."],"speciale":["Questa dote può essere selezionata più volte."],"eccezione":[],"multipla":true,"esclusiva":null},{"nome":"Formulario alchemico espanso","cat":"generiche","mod":null,"pot":null,"req":null,"testo":["L’alchimista aggiunge al proprio formulario alchemico una formula a scelta di livello pari o inferiore al proprio o due formule a scelta inferiori di almeno 4 livelli rispetto al proprio."],"speciale":["Questa dote può essere selezionata più volte."],"eccezione":[],"multipla":true,"esclusiva":null},{"nome":"Iniezione sicura","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista mutagenista di 5° livello o alchimista di 8° livello.","alt":[{"campo":"mutagenista","liv":5},{"campo":null,"liv":8}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista ottiene bonus +4 alla CA contro gli attacchi di opportunità dovuti all’inoculazione dei mutageni."],"speciale":["Se il personaggio è un alchimista mutagenista, non provoca attacchi di opportunità quando inocula i mutageni."],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Lanciatore provetto","cat":"bombe","mod":null,"pot":null,"req":null,"testo":["L’incremento di gittata delle bombe diventa 9 m (x5)."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Lanciatore provetto superiore","cat":"bombe","mod":null,"pot":null,"req":{"testo":"Lanciatore provetto.","alt":[],"doti":["Lanciatore provetto"],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Le bombe alchemiche ignorano le penalità dovute a coperture e occultamento."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Lancio mutagenico","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista mutagenista di 6° livello o alchimista di 10° livello. Non disponibile per l’archetipo profumiere.","alt":[{"campo":"mutagenista","liv":6},{"campo":null,"liv":10}],"doti":[],"altro":[],"arch":null,"no_arch":"profumiere","n_pot":0},"testo":["Come azione standard che provoca attacchi di opportunità, l’alchimista può inoculare un mutageno entro 3 m effettuando un attacco di contatto a distanza contro una CA pari a 10. Se l’attacco fallisce, il mutageno è sprecato. Se il mutageno è [concentrato], si effettua un solo tiro per colpire per tutti i fruitori. Se l’alchimista ottiene un risultato di 1 nel tiro per colpire, l’inoculazione conterà come Fallimento critico ma considerando i nemici come alleati (ad esempio, se si ottiene un risultato in cui si colpisce l’alleato più vicino, sarà il nemico più vicino ad essere colpito ed eventualmente a beneficiare del mutageno)."],"speciale":["L’alchimista può avvalersi dei benefici della dote da alchimista Iniezione sicura anche quando lancia i mutageni."],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Lancio mutagenico superiore","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista mutagenista di 10° livello o alchimista di 14° livello; Dote da alchimista Lancio mutagenico.","alt":[{"campo":"mutagenista","liv":10},{"campo":null,"liv":14}],"doti":["Lancio mutagenico"],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista ottiene bonus di competenza +2 al tiro per colpire quando scaglia i mutageni tramite la dote da alchimista Lancio mutagenico e la distanza massima a cui può scagliarli diventa 6 m."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Liquido decatalizzante","cat":"generiche","mod":null,"pot":null,"req":{"testo":"Alchimista di 14° livello.","alt":[{"campo":null,"liv":14}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Una volta al giorno, come azione di round completo l’alchimista può creare 1 reagente infuso sacrificando 2 oggetti alchemici qualsiasi preparati tramite alchimia di base."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Mega-esplosione","cat":"bombe","mod":3,"pot":null,"req":{"testo":"Alchimista bombarolo di 18° livello; Dote da alchimista Lanciatore provetto superiore; Dote da alchimista Esplosione ampliata.","alt":[{"campo":"bombarolo","liv":18}],"doti":["Lanciatore provetto superiore","Esplosione ampliata"],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Una bomba alchemica così modificata non necessita di alcun tiro per colpire e influenza tutte le creature in un'esplosione di raggio 9 m. La bomba alchemica infligge danni come se ciascuna creatura fosse il bersaglio primario. Le vittime possono superare un Tiro Salvezza su Riflessi con CD 10 + metà livello di alchimista + bonus di Intelligenza per dimezzare i danni. Tutti i bersagli coinvolti dall’esplosione subiscono i danni da spargimento della bomba."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Miscelazione tossica","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 1° livello o alchimista di 4° livello.","alt":[{"campo":"tossicologo","liv":1},{"campo":null,"liv":4}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista può mischiare 2 dosi di veleni diversi, al fine di creare una sola dose il cui modificatore di tossicità è pari al più alto tra i due veleni mischiati."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Mutageni concentrati superiori","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista mutagenista di 11° livello o alchimista di 14° livello.","alt":[{"campo":"mutagenista","liv":11},{"campo":null,"liv":14}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista può inoculare i mutageni concentrati a un massimo di 3 creature, anziché 2."],"speciale":["Se il personaggio è un alchimista mutagenista, può inoculare i mutageni concentrati a un massimo di 4 creature, anziché 2."],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Mutageni curativi affidabili","cat":"mutageni","mod":null,"pot":null,"req":null,"testo":["Quando l’alchimista determina l’ammontare di danni curati grazie a un mutageno, ripete i risultati di dado pari a 1."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Mutageni curativi miracolosi","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista mutagenista di 8° livello; Dote da alchimista Mutageni curativi affidabili.","alt":[{"campo":"mutagenista","liv":8}],"doti":["Mutageni curativi affidabili"],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Quando l’alchimista determina l’ammontare di danni curati grazie a un mutageno, ripete i risultati di dado pari a 1 e 2."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Mutageni economici","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista mutagenista di 12° livello o alchimista di 16° livello.","alt":[{"campo":"mutagenista","liv":12},{"campo":null,"liv":16}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista sceglie due formule di mutageni di almeno 4 livelli inferiori al proprio e d’ora in poi, tramite alchimia di base, queste produrranno 3 esemplari di mutageno per reagente utilizzato, anziché 2."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Nuovo mutageno concentrato","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista mutagenista di 17° livello.","alt":[{"campo":"mutagenista","liv":17}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista sceglie una singola formula di mutageno presente sul proprio formulario alchemico e questa diventa un mutageno [concentrato]."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Occhio esperto","cat":"generiche","mod":null,"pot":null,"req":null,"testo":["L’alchimista è in grado di identificare automaticamente una pozione o un oggetto alchemico tenuto in mano con una semplice azione standard. Inoltre, anche se normalmente non sarebbe concesso, il DM effettua per l’alchimista una prova di Percezione con una CD pari a quella base del veleno, per notare la presenza di eventuali veleni ad ingestione nelle pietanze. Infine, l’alchimista ottiene bonus +4 Percezione (notare i veleni a contatto)."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Pozione come mutageno","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista di 4° livello.","alt":[{"campo":null,"liv":4}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Per un numero di volte al giorno pari al bonus di Intelligenza, l’alchimista può somministrare una pozione come fosse un mutageno. Trasferire una pozione a portata di mano in una siringa per mutageni è un’azione di round completo."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Pozione della “Bella addormentata”","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista di 4° livello.","alt":[{"campo":null,"liv":4}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Tramite alchimia rapida, l’alchimista può consumare 1 reagente infuso per creare una pozione che ha effetto su un sottotipo di creatura umanoide a scelta (umano, nano, coboldo, mezzelfo, etc.). La vittima deve effettuare un Tiro Salvezza su Tempra con CD 10 + metà livello di alchimista + bonus di Intelligenza. Se il tiro fallisce, dopo 1 minuto la vittima cade addormentata per 1 ora, destandosi solo in caso subisca danni. Se il tiro riesce, la vittima diventa immune per 24 ore a questa pozione."],"speciale":["Questa pozione ha un puro scopo ruolistico e deve essere usato solamente per catturare bersagli sensibili o esemplari specifici."],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Pozione mutagenica","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Dote da alchimista Pozione come mutageno.","alt":[],"doti":["Pozione come mutageno"],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Tramite alchimia rapida, l’alchimista può spendere 1 uso della dote da alchimista Pozione come mutageno per unire una pozione a “portata di mano” al mutageno che intende creare. Quando la pozione mutagenica viene inoculata, si deve tirare 1d4 per vedere l’effetto sortito:",{"tab":[["Risultato","Effetto"],["1","Il mutageno o la pozione non ha effetto (si determini casualmente quale dei due). Quello che ha effetto però, è considerato avere un livello di alchimista o incantatore aumentato di 2."],["2","Il mutageno e la pozione hanno effetto normalmente."],["3","Il mutageno e la pozione hanno effetto normalmente e sono considerati avere entrambi un livello di alchimista o incantatore aumentato di 2."],["4","Il mutageno e la pozione hanno effetto normalmente e la durata di entrambi aumenta del 50%. Gli effetti la cui durata è uguale a Concentrazione, Istantanea o Permanente non sono influenzati."]]}],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Preparazione medica avanzata","cat":"generiche","mod":null,"pot":null,"req":null,"testo":["L’alchimista non può avere una seconda abilità di Professione. Se quando ottiene questa dote l’alchimista ha gradi in un’abilità di Professione che non sia (alchimista), riottiene indietro i punti ad essa assegnati. L’alchimista può usare Professione (alchimista) per effettuare le prove di Professione (cerusico)."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Reagente infuso extra","cat":"generiche","mod":null,"pot":null,"req":{"testo":"Alchimista di 8° livello.","alt":[{"campo":null,"liv":8}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista ottiene 1 reagente infuso giornaliero extra."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Spargimento calcolato","cat":"bombe","mod":1,"pot":null,"req":{"testo":"Alchimista bombarolo di 13° livello.","alt":[{"campo":"bombarolo","liv":13}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Una bomba alchemica così modificata consente all’alchimista di evitare i danni da spargimento ad un numero di bersagli pari o inferiore a bonus di Intelligenza."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Sputo velenoso","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 8° livello o alchimista di 12° livello.","alt":[{"campo":"tossicologo","liv":8},{"campo":null,"liv":12}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista è in grado di sputare una dose di veleno anziché applicarla ad un’arma. L’alchimista effettua un tiro per colpire di contatto a distanza entro 4,5 m e, se colpisce, la vittima subisce gli effetti del veleno ma con una CD ridotta di 2. In caso di colpo critico, la vittima è automaticamente accecata per 1 round. Versarsi in bocca una dose di veleno in questo modo conta come avvelenare un’arma, con le solite modalità e rischi. L’alchimista può conservare un veleno in bocca per un massimo di 10 minuti, dopodiché deve essere sputato o ne subirà gli effetti. Durante questo tempo non è possibile bere alcun liquido o usare la voce. Un eventuale interlocutore noterà che l’alchimista ha qualcosa in bocca superando una prova di Intuizione con CD 20."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Studi mutagenici avanzati","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Alchimista mutagenista di 3° livello.","alt":[{"campo":"mutagenista","liv":3}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Per quanto riguarda i mutageni, l’alchimista considera il proprio livello di alchimista superiore di 1."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Tossicità aumentata","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 2° livello o alchimista di 6° livello.","alt":[{"campo":"tossicologo","liv":2},{"campo":null,"liv":6}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["La CD dei veleni che l’alchimista prepara aumenta di 1."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Tossicità aumentata superiore","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Dote da alchimista Tossicità aumentata.","alt":[],"doti":["Tossicità aumentata"],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["La CD dei veleni che l’alchimista prepara aumenta di 1."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleni a contatto","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista di 14° livello.","alt":[{"campo":null,"liv":14}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista può unire due dosi dello stesso veleno per crearne una versione a contatto, applicabile su qualsiasi superficie e trasmessa con il tocco (ma non tramite le armi). La modifica è permanente. Un osservatore può notare il veleno superando una prova di Percezione, Professione (alchimista o cerusico) o Sopravvivenza con CD pari a quella del veleno (non modificata); chi lo cerca attivamente ottiene +4 alla prova. Un veleno a contatto perde la sua tossicità 6 ore dopo l’applicazione."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleni assordanti","cat":"veleni","mod":null,"pot":2,"req":null,"testo":["Il veleno rende la vittima anche assordata per un numero di round pari al proprio valore di potenza. La vittima può superare un Tiro Salvezza su Tempra con la CD del veleno per negare tale condizione. Se l’effetto base del veleno rende già assordata la vittima, le durate si sommano."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleni debilitanti","cat":"veleni","mod":null,"pot":2,"req":null,"testo":["Il veleno rende la vittima anche inferma per un numero di round pari al proprio valore di potenza. La vittima può superare un Tiro Salvezza su Tempra con la CD del veleno per negare tale condizione. Se l’effetto base del veleno rende già inferma la vittima, le durate si sommano."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleni disinfestanti","cat":"veleni","mod":null,"pot":1,"req":null,"testo":["Il veleno ha effetto solo su melme, parassiti e vegetali, ignorando la loro eventuale immunità agli effetti di [INFLUENZA MENTALE: CHARME, COMPULSIONE, FINZIONE, TRAMA E MORALE] e [VELENO]."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleni estesi","cat":"veleni","mod":null,"pot":1,"req":null,"testo":["Il veleno ha una durata incrementata del 50% (minimo 1 round extra)."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleni idrorepellenti","cat":"veleni","mod":null,"pot":1,"req":null,"testo":["Il veleno non perde efficacia se viene a contatto per breve tempo con l’acqua o con liquidi simili. Un’esposizione prolungata (almeno 6 ore continuative) lo rende comunque inefficace."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleni massimizzati","cat":"veleni","mod":null,"pot":3,"req":{"testo":"Alchimista tossicologo.","alt":[{"campo":"tossicologo","liv":1}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Gli effetti numerici variabili del veleno sono massimizzati."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleni miscelabili","cat":"veleni","mod":null,"pot":4,"req":null,"testo":["L’alchimista crea una dose di veleno miscelabile. Un veleno miscelabile può essere applicato ad un’arma o una munizione già trattata con un veleno che non sia stato alterato tramite altre doti di potenziamento. La vittima viene afflitta da entrambi i veleni, a partire da quello con il valore di potenza maggiore."],"speciale":[],"eccezione":["Non è necessario usare 1 reagente infuso per creare una dose di veleno miscelabile. Invece, quando si usa alchimia di base per ricavare normalmente due dosi di veleno da un reagente infuso, una o entrambe possono essere potenziate da questa dote."],"multipla":false,"esclusiva":null},{"nome":"Veleni potenziati","cat":"veleni","mod":null,"pot":2,"req":null,"testo":["Gli effetti numerici variabili del veleno sono aumentati del 50%, compresi i bonus a tiri di dado."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleni trenodici","cat":"veleni","mod":null,"pot":1,"req":null,"testo":["Il veleno ha effetto anche sui non morti corporei. I veleni che non infliggono danni letali non traggono alcun beneficio da questa dote."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleni ultraletali","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 17° livello.","alt":[{"campo":"tossicologo","liv":17}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Due volte al giorno, quando un nemico supera il Tiro Salvezza contro un veleno inoculato dall’alchimista, quest’ultimo può obbligarlo a ripetere tale tiro."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleno durevole","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista di 6° livello.","alt":[{"campo":null,"liv":6}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["Una volta applicati, i veleni creati dall’alchimista permangono sulle armi e sulle munizioni per 12 ore. Se l’alchimista cede la propria arma o munizione a qualcun altro, la permanenza massima del veleno scende a 6 ore."],"speciale":["Se il personaggio è un alchimista tossicologo la permanenza dei veleni diventa di 24 ore."],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veleno perfetto","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 16° livello; Tre doti da alchimista classificate come potenziamento.","alt":[{"campo":"tossicologo","liv":16}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":3},"testo":["L’alchimista sceglie la formula di un veleno presente nel proprio formulario alchemico. Quando crea il veleno scelto, l’alchimista può applicarvi una dote da alchimista classificata come potenziamento senza influenzarne il livello di potenza, purché il livello risultante di potenza non sia superiore a 9."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Veloce e letale","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 4° livello o alchimista di 8° livello.","alt":[{"campo":"tossicologo","liv":4},{"campo":null,"liv":8}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista può applicare un veleno a un’arma da mischia come azione veloce, se il veleno è a portata di mano. Applicandolo così ha il 10% di probabilità di entrare in contatto con il veleno e subirne gli effetti (la dose non si consuma)."],"speciale":["Se l’alchimista possiede il talento Uso dei veleni, la probabilità scende a 0%."],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Vile","cat":"veleni","mod":null,"pot":null,"req":{"testo":"Alchimista tossicologo di 6° livello o alchimista di 10° livello.","alt":[{"campo":"tossicologo","liv":6},{"campo":null,"liv":10}],"doti":[],"altro":[],"arch":null,"no_arch":null,"n_pot":0},"testo":["L’alchimista ottiene bonus di +1 ai tiri per colpire quando usa armi avvelenate per attaccare i nemici già ingaggiati in mischia."],"speciale":[],"eccezione":[],"multipla":false,"esclusiva":null},{"nome":"Ri-mescita curativa extra","cat":"mutageni","mod":null,"pot":null,"req":{"testo":"Mescicure.","alt":[],"doti":[],"altro":[],"arch":"Mescicure","no_arch":null,"n_pot":0},"testo":["Il mescicure ottiene 2 utilizzi extra al giorno di Ri-mescita curativa."],"speciale":["Si può scegliere questa dote fino a due volte."],"eccezione":[],"multipla":2,"esclusiva":"Mescicure"}],"archetipi":[{"nome":"Alchimista metabolico","flavor":"Gli alchimisti metabolici creano mutageni molto tossici che mutano il fisico; essi sono in grado di mantenerli all’interno del proprio corpo senza attivarli.","abilita":"","competenze":"","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, un alchimista metabolico deve scegliere mutagenista come campo di ricerca."],"dicitura":"Privilegio di classe modificato: Campo di ricerca al 1° livello."},{"nome":"Oggetti alchemici limitati","testo":["Un alchimista metabolico può aggiungere al proprio formulario solo formule di mutageni."],"dicitura":"Privilegio di classe modificato: Oggetti alchemici al 1° livello."},{"nome":"Scoperta specialistica alpha esclusiva: Mutageni latenti","testo":["Al 1° livello, come azione di round completo un alchimista metabolico si può inoculare un mutageno Del dottor Je-Kill o uno qualsiasi che fornisca bonus ad almeno una caratteristica fisica, senza che questo sortisca effetti immediati. Questo mutageno è detto “latente” e può essere attivato come azione veloce entro 8 ore dall’inoculazione. Un mutageno latente diventa inutilizzabile se l’alchimista metabolico se ne inocula un altro."],"dicitura":"Privilegio di classe sostituito: Scoperta specialistica alpha al 1° livello."},{"nome":"Agenti alteranti","testo":["Al 1° livello, quando un alchimista metabolico si inocula un mutageno Del dottor Je-Kill o uno qualsiasi che fornisca bonus ad almeno una caratteristica fisica, ottiene un bonus di +2 a tale caratteristica (in caso di bonus a più caratteristica ne sceglie una). Di contro, a causa delle sostanze tossiche contenute nei propri mutageni, un alchimista metabolico non può mai inocularli ad altre creature."],"dicitura":""},{"nome":"Mutageno esclusivo","testo":["Ad ogni livello indicato, un alchimista metabolico aggiunge le relative formule di mutageni al proprio formulario, al posto di una di quelle normalmente selezionabili in base al livello: (4°) Del dottor Je-Kill 1.0, (6°) Del dottor Je-Kill 2.0, (8°) Del dottor Je-Kill 3.0, (10°) Del dottor Je-Kill 4.0."],"dicitura":""}],"campo":"mutagenista","scoperte_sostituite":["alpha"],"doti_sostituite":[]},{"nome":"Sabotatore","flavor":"Un sabotatore combina la furtività con il suo talento da alchimista per costruire speciali soluzioni atte al mimetismo e alla distruzione.","abilita":"ottiene Disattivare congegni, Furtività e Scalare al posto di Intuizione, Rapidità di mano e Valutare.","competenze":"","voci":[{"nome":"Mutageno esclusivo","testo":["Ad ogni livello indicato, un sabotatore aggiunge le relative formule di mutageni al proprio formulario, al posto di una di quelle normalmente selezionabili in base al livello: (1°) Camaleontico 1.0, (8°) Camaleontico 2.0. Solo un sabotatore può inocularsi un mutageno Camaleontico."],"dicitura":""},{"nome":"Sostanze dissolventi","testo":["Al 2° livello, come azione di round completo un sabotatore può applicare una speciale sostanza corrosiva a una serratura o a una trappola, garantendo per 1 minuto nei confronti di questa, un bonus alle prove di Disattivare congegni pari a +1 ogni due livelli. Un sabotatore può disarmare le trappole magiche trattate con questa capacità."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 2° livello."},{"nome":"Doti da ladro","testo":["Ogni volta che ottiene una dote da alchimista, un sabotatore può scegliere al suo posto una delle seguenti doti da ladro (vedi privilegi di classe del ladro): Arrampicamuri, Camuffamento rapido, Disattivare rapido, Equilibrista, Maestro delle corde, Rialzarsi, Saltatore esperto, Scalatore agile e Strisciare rapido."],"dicitura":""}],"campo":null,"doti_sostituite":[2]},{"nome":"Toxicator","flavor":"I toxicator saturano costantemente il proprio sangue con speciali droghe e tossine, che, se da una parte offuscano la mente, dall’altra rendono in grado di potenziare le facoltà mentali e fisiche. Si dice che quando se ne fan uso, si veda tutto andare a rilento, dalle gocce di pioggia, alle frecce in arrivo, ai movimenti degli avversari.","abilita":"","competenze":"","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, un toxicator deve scegliere tossicologo come campo di ricerca."],"dicitura":"Privilegio di classe modificato: Campo di ricerca al 1° livello."},{"nome":"Mente offuscata","testo":["Un toxicator subisce -2 ai Tiri Salvezza contro gli effetti di [INFLUENZA MENTALE: CHARME, COMPULSIONE, FINZIONE, TRAMA E MORALE]."],"dicitura":""},{"nome":"Droghe psicotrope","testo":["Al 1° livello, un toxicator ottiene una riserva di adrenalina. Il numero di punti nella riserva di adrenalina è pari a metà livello di toxicator + bonus di Intelligenza (minimo 1). La riserva di adrenalina viene ripristinata all’alba di ogni giorno dopo 8 ore di riposo. Una volta per turno, come azione gratuita un toxicator può spendere 1 punto della riserva di adrenalina per ottenere per 1 round bonus cognitivo +2 ai tiri per colpire e +2 alla CA. In alternativa, può spendere 1 punto della riserva di adrenalina per ottenere +1d6 a una prova di Iniziativa, di caratteristica o di abilità basate su Destrezza o Intelligenza."],"dicitura":"Privilegio di classe sostituito: Scoperta specialistica alpha al 1° livello."},{"nome":"Attacco furtivo","testo":["Al 2° livello, un toxicator ottiene attacco furtivo (vedi privilegi di classe del ladro) con un danno pari a 1d6 + 1d6 ogni quattro livelli oltre il 2° (5d6 al 18°)."],"dicitura":"Privilegi di classe sostituiti: Dote da alchimista al 2°, 6°, 10°, 14° e 18° livello."}],"campo":"tossicologo","scoperte_sostituite":["alpha"],"doti_sostituite":[2,6,10,14,18]},{"nome":"Sherpa","flavor":"Gli sherpa sono alchimisti nati o vissuti a lungo in alta quota. Traggono ispirazione dalle montagne, dal gelo che ne attanaglia le pendici e dai fulmini che ne colpiscono le vette.","abilita":"ottiene Scalare al posto di Rapidità di mano.","competenze":"","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, uno sherpa deve scegliere mutagenista come campo di ricerca. Inoltre, non può mai aggiungere al proprio formulario le formule dei veleni e di alcuna bomba alchemica ad eccezione di quelle criogenica, folgorante e sonica."],"dicitura":"Privilegi di classe modificati: Campo di ricerca al 1° livello e Oggetti alchemici al 1° livello."},{"nome":"Abituato al freddo","testo":["Al 1° livello, uno sherpa non subisce alcun danno dal fatto di trovarsi a temperature fino a -45° C; la protezione si estende al suo equipaggiamento."],"dicitura":""},{"nome":"Tempesta in bottiglia","testo":["Al 2° livello, prima di lanciare una bomba alchemica criogenica, folgorante o sonica, uno sherpa può agitarla con forza e trasformarla in uno degli altri due tipi a sua scelta, mantenendone il livello di oggetto. Si può usare questa capacità un numero di volte al giorno pari a 3 + metà livello di sherpa."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 2° livello."},{"nome":"Resistenza alchemica","testo":["Al 4° livello, uno sherpa ottiene RE pari al proprio livello di sherpa contro un tipo di energia a scelta tra elettricità, freddo o suono. Può cambiare il tipo all’alba di ogni giorno."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 4° livello."},{"nome":"Mutageno esclusivo","testo":["Ad ogni livello indicato, uno sherpa aggiunge le relative formule di mutageni al proprio formulario, al posto di una di quelle normalmente selezionabili in base al livello: (6°) Della montagna 1.0, (8°) Della montagna 2.0, (10°) Della montagna 3.0, (12°) Della montagna 4.0. Uno sherpa può creare dosi di mutageno Della montagna solo tramite alchimia di base. Solo uno sherpa può inocularsi un mutageno Della montagna."],"dicitura":""}],"campo":"mutagenista","doti_sostituite":[2,4]},{"nome":"Ectochimista","flavor":"Gli ectochimisti studiano gli effetti dell'alchimia sull'anima e sullo spirito, focalizzandosi sul combattere fantasmi e altre creature incorporee.","abilita":"ottiene Conoscenze (religioni) al posto di Conoscenze (arcane).","competenze":"","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, un ectochimista deve scegliere bombarolo come campo di ricerca."],"dicitura":"Privilegio di classe modificato: Campo di ricerca al 1° livello."},{"nome":"Bomba esclusiva","testo":["Al 1° livello, un ectochimista aggiunge la formula della bomba Ectoplasmica al proprio formulario, al posto di una delle sei consuete formule a scelta. Si può in seguito acquisire formule potenziate della bomba Ectoplasmica come per le altre bombe."],"dicitura":""},{"nome":"Scoperta specialistica alpha esclusiva: Coprente ectoplasmatico","testo":["Al 1° livello, un ectochimista tratta alchemicamente le proprie armi (bombe comprese) in modo che infliggano danno pieno alle creature incorporee e alle infestazioni. Tre volte al giorno, come azione standard un ectochimista può concedere per 1 ora i benefici di questa capacità alle armi di fino a quattro creature toccate (l’ectochimista può spostarsi e toccare gli alleati e le loro armi durante il proprio movimento)."],"dicitura":"Privilegio di classe sostituito: Scoperta specialistica alpha al 1° livello."},{"nome":"Flagello dei fantasmi","testo":["Al 2° livello, un ectochimista ottiene vantaggio nei tiri per colpire effettuati contro le creature incorporee. Inoltre, ottiene vantaggio nei Tiri Salvezza contro la capacità dei non morti incorporei."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 2° livello."},{"nome":"Analisi ectochimica","testo":["Al 4° livello, un ectochimista può usare processi alchemici specifici per ricavare conoscenze esoteriche da un'area infestata che normalmente richiederebbe divinazioni per accertamenti. Questo processo dura 10 minuti di studio ininterrotto. Si considera questo effetto come l’incantesimo Parlare con le infestazioni con CD 8 + metà livello di ectochimista + bonus di Intelligenza. Dato che effettua un'analisi e non parla direttamente con l'infestazione, un ectochimista deve usare Professione (alchimista) anziché Intuizione per la prova contrapposta a Raggirare, per capire se lo spirito stia tentando di fuorviarlo."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 4° livello."},{"nome":"Trappola per fantasmi","testo":["Al 6° livello, come azione di round completo un ectochimista può trattare un contenitore e scagliarlo tramite un attacco di contatto a distanza contro una creatura incorporea entro 9 m. Se l’attacco colpisce e il bersaglio ha un numero di Dadi Vita non superiori a quelli dell’ectochimista +2, questi deve effettuare un Tiro Salvezza su Volontà con CD 10 + livello di ectochimista + bonus di Intelligenza. Se il tiro fallisce, l’entità verrà sigillata nel contenitore fino a quando questo non verrà aperto o rotto. La trappola per fantasmi ha Durezza 5 e 1 Punto Ferita. Si può sigillare con successo tramite questa capacità una creatura al giorno più una ogni quattro livelli oltre il 6°."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 6° livello."}],"campo":"bombarolo","scoperte_sostituite":["alpha"],"doti_sostituite":[2,4,6]},{"nome":"Profumiere","flavor":"Mentre la maggior parte degli alchimisti si concentra su veleni letali, forti esplosioni e strani mutageni, alcuni preferiscono la finezza e l'eleganza. Un profumiere raffina i reagenti infusi nelle loro forme più pure e rarefatte per diffonderli tramite nebulizzatori spray, preferendo condividere aromi, piuttosto che iniettarsi rozzi mutageni.","abilita":"","competenze":"","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, un profumiere deve scegliere bombarolo come campo di ricerca."],"dicitura":"Privilegio di classe modificato: Campo di ricerca al 1° livello."},{"nome":"Scoperta specialistica alpha esclusiva: Bombe gassose","testo":["Al 1° livello, una volta per turno, quando un profumiere lancia una bomba alchemica non diluita, può agitarla per renderla gassosa. Dopo esser stata lanciata ed aver risolto normalmente danni, una bomba gassosa crea una leggera nube di 4,5 m quadrati (centrata sul punto dell’esplosione) che permane per 2 round. Le creature che successivamente terminano il proprio turno all’interno della nube, subiscono i danni primari e gli effetti della bomba alchemica. Una creatura può subire danni derivanti da bomba gassose una sola volta per turno, anche in caso di nubi sovrapposte. Una bomba gassosa non può essere modificata tramite le doti da alchimista Bombe subacquee, Esplosione ampliata, Esplosione lineare, Esplosione conica o Mega-esplosione."],"dicitura":"Privilegio di classe sostituito: Scoperta specialistica alpha al 1° livello."},{"nome":"Profumo irresistibile","testo":["Al 2° livello, una volta al giorno, un profumiere può utilizzare 1 reagente infuso e lavorare 10 minuti per creare una speciale miscela monouso di feromoni esotici e conservarla in un nebulizzatore spray per un massimo di 24 ore. Come azione standard il profumiere può spruzzare una creatura consenziente con tale profumo per conferirle per 3 ore bonus alchemico +4 Diplomazia e +4 Raggirare."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 2° livello."},{"nome":"Pozioni spray","testo":["Al 4° livello, un profumiere ottiene la dote da alchimista Pozione come mutageno (non deve soddisfarne i requisiti) e quando usa tale dote può trasferire una pozione in un nebulizzatore spray come azione di movimento, anziché come azione di round completo."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 4° livello."}],"campo":"bombarolo","scoperte_sostituite":["alpha"],"doti_sostituite":[2,4]},{"nome":"Rovochimista","flavor":"Alcuni alchimisti uniscono curiosità scientifica a un forte legame con la natura, riuscendo a fabbricare bombe che avviluppano i nemici in una morsa letale.","abilita":"","competenze":"","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, un rovochimista deve scegliere bombarolo come campo di ricerca."],"dicitura":"Privilegio di classe modificato: Campo di ricerca al 1° livello."},{"nome":"Bomba esclusiva","testo":["Al 1° livello, un rovochimista aggiunge la formula della bomba Rovospina al proprio formulario, al posto di una delle sei consuete formule a scelta. Si può in seguito acquisire formule potenziate della bomba Rovospina come per le altre bombe."],"dicitura":""},{"nome":"Unguento vegeto-repellente","testo":["Al 2° livello, un rovochimista ignora le penalità al movimento dovute ai terreni difficili boschivi, eccetto quelli manipolati magicamente."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 2° livello."},{"nome":"Rovi versatili","testo":["Al 4° livello, il rovochimista impara a modellare i propri rovi in strutture utili invece che come semplice trappola. Quando crea una bomba rovospina, può designarla (al momento del lancio) come uno dei seguenti usi alternativi: come Scala di rovi, i rovi si aggrappano a una superficie verticale creando appigli (la superficie conta come terreno con CD di Scalare 5, per un'altezza fino a 3 m per ogni 4 livelli); come Ponte di rovi, i rovi colmano un vuoto orizzontale fino a 3 m di larghezza, più 1,5 m ogni 4 livelli, formando una passerella che regge creature fino a taglia Grande; come Rampa d'appiglio, su terreno scosceso o instabile i rovi creano una sezione stabile di terreno normale, annullando la condizione di terreno difficile in quell'area. Questi rovi utili non intrappolano né danneggiano. L'effetto dura 1 round per livello del rovochimista, oppure finché il rovochimista non li rimuove anticipatamente come azione di movimento."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 4° livello."},{"nome":"Trappole spinose [modifica +2]","testo":["Al 6° livello, un rovochimista può modificare le proprie bombe rovospina in trappole. Una bomba rovospina così modificata va posizionata (e non lanciata) in una casella, dove rimane sotto forma di una grossa bacca o di una pianta selvatica per un massimo di 1 ora. Si possono piazzare al massimo 3 trappole spinose contemporaneamente: se il rovochimista ne piazza una quarta, una a scelta di quelle già piazzate scompare. Una trappola piazzata non può più essere raccolta, ma il rovochimista può disinnescarla toccandola con un’azione standard. La trappola esplode con gli effetti di una bomba rovospina non appena una creatura ignara entra nella sua casella. Una creatura adiacente alla trappola può notarla superando una prova di Percezione con CD 10 + livello di alchimista + bonus di Intelligenza; se la nota, la trappola viene rivelata anche ai suoi alleati."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 6° livello."},{"nome":"Rovi laceranti","testo":["All'8° livello, gli aculei dei rovi del rovochimista affondano nella carne di chiunque vi si trovi a contatto. Ogni creatura che inizia il proprio turno all'interno dei rovi del rovochimista — che sia intrappolata, immobilizzata, semplicemente intralciata o che li stia attraversando — subisce 1d6 danni perforanti. Questo danno aumenta a 2d6 al 10° livello, 3d6 al 14° livello e 4d6 al 18° livello."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista all'8° livello."},{"nome":"Rovi tenaci","testo":["Al 12° livello, i rovi del rovochimista diventano più difficili da superare: la CD della prova di Forza (o del Tiro Salvezza su Riflessi) per liberarsene o ridurne le penalità aumenta di 2, e i rovi acquisiscono Durezza 5 (prima ne erano privi), rendendo più lento distruggerli a colpi d'arma."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 12° livello."}],"campo":"bombarolo","doti_sostituite":[2,4,6,8,12]},{"nome":"Piromane","flavor":"I piromani sono eccezionalmente abili a utilizzare il fuoco per bruciare i nemici e far saltare in aria le cose.","abilita":"","competenze":"Un piromane considera le torce come armi semplici.","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, un piromane deve scegliere bombarolo come campo di ricerca."],"dicitura":"Privilegio di classe modificato: Campo di ricerca al 1° livello."},{"nome":"Oggetti alchemici limitati","testo":["Un piromane non può mai aggiungere al proprio formulario le formule di alcuna bomba alchemica ad eccezione di quella incendiaria."],"dicitura":"Privilegio di classe modificato: Oggetti alchemici al 1° livello."},{"nome":"Ignifugo","testo":["Al 1° livello, un piromane ottiene bonus +3 ai Tiri Salvezza contro gli attacchi a base di fuoco, anche quelli effettuati per evitare di prendere fuoco o per spegnere il fuoco di qualcuno che sta bruciando."],"dicitura":""},{"nome":"Scoperta specialistica alpha esclusiva: Miscela infernale","testo":["Al 1° livello, un piromane ottiene la dote da alchimista Bombe potenti ma ne applica il danno bonus solamente alle bombe incendiarie e in generale agli attacchi con le armi che infliggono anche danni da fuoco (armi magiche, granate ustionanti, torce, etc.). Inoltre, può ripetere i risultati di 1 ottenuti nei tiri per i danni con le armi, ma solo quelli che infliggono da fuoco (ad. esempio, se brandisce una spada corta +1 e Infuocata, ripeterà solamente i risultati di 1 ottenuti con il d6 derivante dalla capacità speciale Infuocata; se invece scaglia una bomba Incendiaria che infligge 5d10, ripeterà tutti i risultati di 1 ottenuti)."],"dicitura":"Privilegio di classe sostituito: Scoperta specialistica alpha al 1° livello."},{"nome":"Esperto incendiario","testo":["Al 4° livello, un piromane considera il proprio livello superiore di 1 per quanto riguarda le bombe incendiarie (sia per il livello massimo delle formule sia per le capacità che dipendono dal livello)."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 4° livello."},{"nome":"Cuore di fiamma","testo":["All’8° livello, le creature colpite dalle bombe incendiarie di un piromane vedono la propria RE (fuoco) dimezzata. Se una creatura ha immunità al fuoco, conta invece avere RE (fuoco) 30 contro le bombe Incendiarie del piromane."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista dell’8° livello."},{"nome":"Perfezionamento specialistico","testo":["All’11° livello, un piromane ottiene gratuitamente la dote da alchimista Esplosione ampliata [modifica +1], che può applicare alle proprie bombe incendiarie senza che conti ai fini del modificatore massimo di modifica."],"dicitura":"Privilegio di classe sostituito: Scoperta specialistica lambda all’11° livello."}],"campo":"bombarolo","scoperte_sostituite":["alpha","lambda"],"doti_sostituite":[4,8]},{"nome":"Prometeico","flavor":"Alcuni alchimisti riescono a creare la vita dal nulla. Queste creature forgiate tramite l’alchimia sono conosciute come homunculi e sono totalmente devote al loro creatore.","abilita":"","competenze":"","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, un prometeico deve scegliere mutagenista come campo di ricerca."],"dicitura":"Privilegio di classe modificato: Campo di ricerca al 1° livello."},{"nome":"Scoperta specialistica alpha esclusiva: Homunculus","testo":["Al 1° livello, tramite l’alchimia, un prometeico può dar vita un homunculus, una creatura vivente dalla forma vagamente umanoide. Se l’homunculus viene distrutto, il prometeico può crearne uno nuovo dopo 3 giorni.","Statistiche: Taglia minuscola; Velocità 12 m; CA 18 (16 a contatto, 10 alla sprovvista).","Caratteristiche: Forza 8, Destrezza 22, Costituzione 10, Int 12, Sag 12, Car 7.","Dadi Vita e Punti Ferita: Dadi Vita pari al livello di prometeico e Punti Ferita e Punti Fatica pari alla metà di quelli posseduti dal prometeico.","Attacchi: Attacco generico +3 (1 danno).","Tiri Salvezza: gli stessi del prometeico.","Abilità: Furtività +14, Percezione +5, Scalare +6. Inoltre, considera Acrobazia, Furtività, Nuotare, Percezione e Scalare come abilità di classe.","Talenti: Arma focalizzata (Attacco generico), Schivare.",{"tab":[["Livello di prometeico","Bonus alla CA Naturale","Capacità speciali"],["1°","+0","Legame alchemico, Allerta, Vantaggio alchemico"],["2°","+1","Sfuggevole, Eludere migliorato, Condividere mutageni"],["3°","+2","Inoculare mutageni"],["5°","+3","RD 2/-"],["7°","+4","Secondo vantaggio alchemico"],["9°","+5","RD 5/-"],["11°","+6","Condividere mutageni empatico"]]},"Legame alchemico: homunculus e prometeico comunicano telepaticamente fintanto che si trovano entro 15 m l’uno dall’altro.","Allerta: fintanto che il prometeico è adiacente all’homunculus ottiene il talento Allerta.","Sfuggevole: l’homunculus ottiene i talenti Mobilità (non deve soddisfarne i requisiti) e Riflessi fulminei.","Eludere migliorato: quando non è indifeso, l’homunculus non subisce danni se supera il Tiro Salvezza su Riflessi contro un attacco che normalmente infligge la metà dei danni in caso di riuscita e subisce solo la metà dei danni in caso di fallimento.","Condividere mutageni: il prometeico può iniettare all’homunculus i mutageni come se li inoculasse a sé stesso.","Vantaggio alchemico: all’alba di ogni giorno, il prometeico sceglie un talento tra Abilità focalizzata, Iniziativa migliorata, Riflessi fulminei, Robustezza, Schivare, Tempra possente e Volontà di ferro. Il prometeico ottiene quindi il talento scelto fintanto che si trova entro 15 m dall’homunculus. Al 7° livello, il prometeico può scegliere un secondo talento.","Inoculare mutageni: come azione standard il prometeico può prendere dalla borsa un mutageno già creato tramite alchimia di base e darlo all’homunculus, se adiacente; se ciò accade, l’homunculus può muoversi e iniettarlo come fosse egli stesso il prometeico. Alla fine del turno, il mutageno trasportato dall’homunculus diventa inservibile.","RD: l’homunculus ottiene RD 2/-. Questa RD diventa 5 al 9° livello.","Condividere mutageni empatico: quando il prometeico si inocula un mutageno, se l’homunculus gli è adiacente, anche quest’ultimo ne beneficia automaticamente."],"dicitura":"Privilegio di classe sostituito: Scoperta specialistica alpha al 1° livello."},{"nome":"Sperimentazione continua","testo":["Al 4° livello, un prometeico può garantire al suo homunculus delle evoluzioni (vedi privilegi di classe del convocatore) del valore di 1 punto per ogni 4 livelli da prometeico posseduti, sebbene non possa selezionare alcuna evoluzione che richieda una particolare forma base. Un prometeico, può cambiare le evoluzioni del suo homunculus all’alba di ogni giorno impiegando 30 minuti."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 4° livello."}],"campo":"mutagenista","scoperte_sostituite":["alpha"],"doti_sostituite":[4]},{"nome":"Mescicure","flavor":"Un mescicure è un alchimista concentrato sulle sostanze naturali e sull’arte di curare.","abilita":"","competenze":"","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, un mescicure deve scegliere mutagenista come campo di ricerca. Inoltre, deve scegliere un tipo di oggetto alchemico tra bombe alchemiche e veleni e non può mai aggiungere al proprio formulario le relative formule."],"dicitura":"Privilegi di classe modificati: Campo di ricerca al 1° livello e Oggetti alchemici al 1° livello."},{"nome":"Erborista","testo":["Al 1° livello, un mescicure ottiene la dote da alchimista Mutageni curativi affidabili come dote bonus (non deve soddisfarne i requisiti)."],"dicitura":""},{"nome":"Ri-mescita curativa","testo":["Al 2° livello, un mescicure può scartare due mutageni qualsiasi creati quel giorno tramite alchimia di base per creare tramite alchimia rapida un mutageno presente nel proprio formulario alchemico, scelto dalla seguente lista: A tenuta stagna, Antiepidemico, Antitossina, Coagulante, Curativo, Curativo a tempo, Del dottor Kramer, Di Victor Saltzpyre, Energizzante, Fortificante, Lenitivo, Libera mente, Liberatore, Protezione corporea, Purificante, Riciclante, Rigenerante, Rinvigorente, Ristoratore, Salutare, Salvavita, Spezza-fattura. I limiti giornalieri e settimanali dei mutageni restano validi. Si può usare questa capacità un numero di volte al giorno pari a 1 + bonus di Intelligenza."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 2° livello."},{"nome":"Dote da alchimista esclusiva","testo":["Un mescicure aggiunge la seguente dote da alchimista alla lista di quelle normalmente selezionabili:"],"dicitura":""}],"campo":"mutagenista","doti_sostituite":[2]},{"nome":"Alchimista nautico","flavor":"Un alchimista nautico trascorre il suo tempo sulle rive di mari, fiumi e laghi, creando mutageni utili consentono di respirare sott’acqua e nuotare efficacemente.","abilita":"ottiene Nuotare e Pilotare imbarcazioni al posto di Rapidità di mano.","competenze":"","voci":[{"nome":"Mutageno esclusivo","testo":["Al 1° livello, un alchimista nautico aggiunge la formula del mutageno Acquatico al proprio formulario, al posto di una delle sei consuete formule a scelta. Solo un alchimista nautico può inocularsi un mutageno Acquatico."],"dicitura":""},{"nome":"Lupo di mare","testo":["Al 1° livello, un alchimista nautico ignora le penalità al movimento dovute ai terreni difficili scivolosi o caratterizzati da acque alte fino al ginocchio. Inoltre, non rischia di cadere e non perde il bonus di Destrezza quando si arrampica su rocce, funi o sartiame o si muove attraverso aree scivolose."],"dicitura":""},{"nome":"Occhi della tempesta (Sop)","testo":["Al 2° livello, un alchimista nautico può vedere attraverso nebbia, vapore, grandine, nevischio, pioggia e vento (anche magici) e incantesimi di tipo Nube senza penalità."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 2° livello."}],"campo":null,"doti_sostituite":[2]},{"nome":"Aerochimista","flavor":"Gli aerochimisti studiano i gas e l’effetto che questi hanno sull'anatomia. Questi folli alchimisti effettuano salti prodigiosi e attacchi dall’alto.","abilita":"","competenze":"","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, un aerochimista deve scegliere mutagenista come campo di ricerca."],"dicitura":"Privilegio di classe modificato: Campo di ricerca al 1° livello."},{"nome":"Mutageni esclusivi","testo":["Ad ogni livello indicato, un aerochimista aggiunge le relative formule di mutageni al proprio formulario, al posto di una di quelle normalmente selezionabili in base al livello: (1°) Aerostatico 1.0, (6°) Aerostatico 2.0. Solo un aerochimista può inocularsi un mutageno Aerostatico."],"dicitura":""},{"nome":"Attacco aereo","testo":["Al 1° livello, durante un combattimento, come azione di round completo un aerochimista può inocularsi un mutageno aerostatico, spiccare un balzo prodigioso, muoversi in linea retta e atterrare in una qualunque casella entro 12 m ma ad almeno 6 m di distanza. Questo movimento provoca attacchi di opportunità solamente da parte delle creature che minacciano l’aerochimista all’inizio e al termine del balzo, e da quelle di taglia enorme o superiore a cui l’aerochimista passa accanto durante il balzo. In qualsiasi punto durante il balzo, l’aerochimista può effettuare un singolo attacco usando armi a distanza (comprese le bombe alchemiche) contro i bersagli sottostanti che si trovino entro 3 m dalla traiettoria effettuata durante il balzo. L’aerochimista è considerato in posizione sopraelevata nei confronti dei nemici di taglia grande o inferiore così attaccati (ottiene quindi +2 al tiro per colpire). Inoltre, ottiene +1 al tiro per colpire per ogni attacco base posseduto oltre il primo. Se l’aerochimista è già sotto gli effetti di un mutageno aerostatico, può effettuare l’attacco aereo senza doversi inoculare tale mutageno."],"dicitura":"Privilegio di classe sostituito: Scoperta specialistica alpha al 1° livello."},{"nome":"Caduta lenta","testo":["Al 4° livello, come azione immediata un aerochimista può inocularsi un mutageno Aerostatico a portata di mano per negare i danni di una caduta avvenuta da un’altezza massima di 30 m."],"dicitura":"Privilegio di classe sostituito: Dote da alchimista al 4° livello."}],"campo":"mutagenista","scoperte_sostituite":["alpha"],"doti_sostituite":[4]},{"nome":"Batteriologo","flavor":"Un batteriologo considera le malattie come l'arma definitiva e lavora senza sosta su cavie più meno consenzienti per padroneggiare nuovi agenti patogeni e subdoli sistemi per propagarli. Un batteriologo non prova più rimorso nello scatenare il suo letale armamento, di quello che prova un arciere nello scoccare una freccia.","abilita":"","competenze":"","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, un batteriologo deve scegliere tossicologo come campo di ricerca. Inoltre, non può mai aggiungere al proprio formulario le formule delle bombe alchemiche."],"dicitura":"Privilegi di classe modificati: Campo di ricerca al 1° livello e Oggetti alchemici al 1° livello."},{"nome":"Coltura batteriologica estensiva","testo":["Le creature viventi immuni agli effetti di [VELENO] ottengono il consueto bonus di +3 al Tiro Salvezza contro i veleni di un batteriologo solo se sono immuni anche agli effetti di [MALATTIA]."],"dicitura":""},{"nome":"Mutageno esclusivo","testo":["Al 1° livello, un batteriologo aggiunge la formula del mutageno Batteriologico 1.0 al proprio formulario, al posto di una delle sei consuete formule a scelta. Un batteriologo può creare dosi di mutageno Batteriologico solo tramite alchimia di base. Solo un batteriologo può inocularsi un mutageno Batteriologico."],"dicitura":""},{"nome":"Attacco furtivo","testo":["Al 2° livello, un batteriologo ottiene attacco furtivo (vedi privilegi di classe del ladro) con un danno pari a 1d6 + 1d6 ogni quattro livelli oltre il 2°."],"dicitura":"Privilegi di classe sostituiti: Dote da alchimista al 2°, 6°, 10°, 14° e 18° livello."}],"campo":"tossicologo","doti_sostituite":[2,6,10,14,18]},{"nome":"Acidiere","flavor":"Gli acidieri si specializzano in composti corrosivi capaci di sciogliere armature, difese e strutture.","abilita":"","competenze":"","voci":[{"nome":"Percorso specialistico","testo":["Al 1° livello, un acidiere deve scegliere bombarolo come campo di ricerca."],"dicitura":"Privilegio di classe modificato: Campo di ricerca al 1° livello."},{"nome":"Oggetti alchemici limitati","testo":["Un acidiere non può mai aggiungere al proprio formulario le formule di alcuna bomba alchemica ad eccezione di quella acida."],"dicitura":"Privilegio di classe modificato: Oggetti alchemici al 1° livello."},{"nome":"Pelle acidoresistente","testo":["Al 1° livello, un acidiere ottiene bonus +3 ai Tiri Salvezza contro gli attacchi a base di acido ed è immune ai danni delle proprie bombe acide."],"dicitura":""},{"nome":"Scoperta specialistica alpha esclusiva: Corrosione","testo":["Al 1° livello, l M.init(D);
const KEY = 'alchimista.v1';
const COND = ['affaticat[oaie]','esaust[oaie]','abbagliat[oaie]','accecat[oaie]','assordat[oaie]','barcollant[ei]','confus[oaie]','frastornat[oaie]',

  'in lotta','sanguinant[ei]','incorpore[oaie]','in preda al panico','accovacciat[oaie]','affascinat[oaie]','inabil[ei]'];
const RCOND = new RegExp('\\b(' + COND.join('|') + ')\\b', 'gi');
const KIND = { B: 'bomba', M: 'mutageno', V: 'veleno', C: 'cocktail' };

/* ---------- stato ---------- */
function nuovoPg(nome) {
  return { id: 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e4), nome: nome || 'Nuovo alchimista', liv: 1, int: 3, campo: 'bombarolo', arch: '',
    doti: [], formule: [], opz: {}, giorno: null, inv: [], eff: [], t: 0, cnt: {}, ultimo: null };
}
function esempio() {
  const s = nuovoPg('Esempio: bombarolo di 5°');
  Object.assign(s, { liv: 5, int: 4, campo: 'bombarolo', doti: ['Bombe fumogene', 'Bombe subacquee'],
    formule: ['B|Acida|1', 'B|Acida|3', 'B|Acida|5', 'B|Incendiaria|1', 'B|Incendiaria|3', 'B|Incendiaria|5', 'B|Sonica|1', 'B|Sonica|3', 'B|Folgorante|1',
      'M|Curativo|1.0', 'M|Curativo|2.0', 'M|Antitossina|1.0', 'M|Della speditezza|', 'V|Veleno di vipera reale', 'V|Zanna di topo tigre'],
    opz: { diluite: ['Incendiaria'] } });
  return s;
}
let G;
try { const r = localStorage.getItem(KEY); if (r) G = JSON.parse(r); } catch (e) { G = null; }
if (!G || !G.pg || !G.pg[G.attivo]) { const s = esempio(); G = { attivo: s.id, pg: { [s.id]: s }, tab: 'scheda' }; }
let S = G.pg[G.attivo];
const UI = { filtroDoti: 'tutte', cercaDoti: '', soloDisp: true, cercaMut: '', man: 'tutto', cercaMan: '', prep: null, rapida: null, conferma: null, inocula: {}, bersaglio: {}, gas: {} };
function save() { G.pg[G.attivo] = S; try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

/* ---------- testo ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmt(s) {
  return esc(s).replace(RCOND, m => '<span class="cond">' + m + '</span>')
    .replace(/\b(vantaggio)\b/gi, '<span class="adv">$1</span>').replace(/\b(svantaggio)\b/gi, '<span class="dis">$1</span>');
}
function paras(lista) {
  return (lista || []).map(x => {
    if (typeof x === 'string') {
      const m = x.match(/^([A-ZÀ-Ü][\wà-ü’' ()]{1,40}):\s(.*)$/s);
      return m && m[1].length < 40 ? `<p><b>${esc(m[1])}:</b> ${fmt(m[2])}</p>` : `<p>${fmt(x)}</p>`;
    }
    return `<div class="scroll"><table class="t">${x.tab.map((r, i) => '<tr>' + r.map(c => i ? `<td>${fmt(c)}</td>` : `<th>${esc(c)}</th>`).join('') + '</tr>').join('')}</table></div>`;
  }).join('');
}
const segno = n => (n >= 0 ? '+' : '') + n;
const ord = n => n + '°';

/* ---------- intestazione ---------- */
function header() {
  const sel = document.getElementById('pgSel');
  sel.innerHTML = Object.values(G.pg).map(p => `<option value="${p.id}"${p.id === S.id ? ' selected' : ''}>${esc(p.nome)}</option>`).join('');
  const c = M.campo(S);
  const rg = S.giorno ? `Reagenti ${S.giorno.reag}` : 'Nessuna alba';
  document.getElementById('hsub').textContent = `${S.arch || (c ? c[0].toUpperCase() + c.slice(1) : 'Alchimista')} · ${ord(S.liv)} livello · Int ${segno(S.int)} · ${rg} · ${tempoTxt(S.t)}`;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === G.tab)));
}
function tempoTxt(t) { return 'tempo ' + (t > 0 ? M.fmtDurata(t, 'ore') : '0 round'); }

/* ================= SCHEDA ================= */
function vScheda() {
  const c = M.campo(S), ad = M.archDati(S), a = M.arch(S);
  const forz = !!(ad && ad.campo);
  const W = M.validaFormulario(S);
  const dW = verificaDoti();
  let h = `<div class="card stack"><h2>Personaggio</h2>
  <div class="grid">
    <label class="field"><span class="label">Nome</span><input id="f-nome" data-f="nome" value="${esc(S.nome)}"></label>
    <label class="field"><span class="label">Livello</span><select id="f-liv" data-f="liv">${Array.from({ length: 20 }, (_, i) => `<option${i + 1 === S.liv ? ' selected' : ''}>${i + 1}</option>`).join('')}</select></label>
    <label class="field"><span class="label">Bonus di Int</span><input id="f-int" data-f="int" type="number" inputmode="numeric" min="-5" max="15" value="${S.int}"></label>
  </div>
  <div class="field"><span class="label">Archetipo</span><select id="f-arch" data-f="arch"><option value="">Nessuno</option>${D.archetipi.map(x => `<option${x.nome === S.arch ? ' selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></div>
  <div class="field"><span class="label">Campo di ricerca${forz ? ' (imposto dall’archetipo)' : ''}</span>
    <div class="seg">${M.CAMPI.map(x => `<button type="button" data-a="campo" data-v="${x}" aria-pressed="${x === c}"${forz ? ' disabled' : ''}>${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}</div></div>
  ${a.sceltaEsclusione ? `<div class="field"><span class="label">Mescicure: tipo di oggetto escluso dal formulario</span><div class="seg">
     ${[['B', 'Bombe'], ['V', 'Veleni']].map(([k, n]) => `<button type="button" data-a="opz" data-k="escludi" data-v="${k}" aria-pressed="${(S.opz.escludi || '') === k}">${n}</button>`).join('')}</div></div>` : ''}
  </div>`;
  h += riepilogo();
  h += cardDoti(dW);
  h += cardFormulario(W);
  h += cardOpzioni();
  h += cardPrivilegi();
  return h;
}
function riepilogo() {
  const inib = M.inibitoriMax(S);
  const cdCap = 10 + Math.floor(S.liv / 2) + S.int;
  const ta = (M.haDote(S, 'Tossicità aumentata') ? 1 : 0) + (M.haDote(S, 'Tossicità aumentata superiore') ? 1 : 0);
  const furt = M.attaccoFurtivo(S);
  const tiles = [
    [M.reagentiGiorno(S), 'reagenti al giorno' + (S.liv >= 20 ? ' (+2d4+2)' : '')],
    [inib === Infinity ? '∞' : inib, 'agenti inibitori'],
    ['10+tox' + segno(S.int + ta), 'CD dei veleni'],
    [cdCap, 'CD capacità (10 + ½ liv + Int)'],
    [M.livMutageni(S), 'livello per i mutageni'],
    [M.maxFruitori(S), 'fruitori dei concentrati'],
  ];
  if (M.haDote(S, 'Bombe potenti')) tiles.push([segno(M.mezzoInt(S.int)), 'Bombe potenti' + (S.arch === 'Piromane' ? ' (incendiarie)' : '')]);
  if (furt) tiles.push([furt + 'd6', 'attacco furtivo']);
  if (S.liv >= 15) tiles.push([cdCap, 'CD Sangue nauseabondo']);
  if (S.liv >= 9) tiles.push([2 * S.liv, 'PF di Bio-reazione']);
  return `<div class="card"><h2>Riepilogo</h2><div class="kv">${tiles.map(([b, s]) => `<div><b>${esc(b)}</b><small>${esc(s)}</small></div>`).join('')}</div></div>`;
}
function verificaDoti() {
