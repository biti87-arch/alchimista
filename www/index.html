<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Laboratorio Alchemico</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="icon" href="icona.png">
<style>
/* Layout: colonna unica da banco di laboratorio, schede a etichetta; il colore distingue bombe, mutageni e veleni. */
:root{
  --bg:#EDF0EB; --surface:#F9FAF7; --surface2:#E0E5DD; --line:#C6CDC3;
  --ink:#19201B; --muted:#5A645C; --accent:#1F5E57; --accent-ink:#FFFFFF; --brass:#80601F;
  --bomb:#A2461B; --mut:#1F6E62; --vel:#6A3E8C;
  --cond:#B3121B; --good:#2E6B4A; --warn:#9A5B12; --adv:#1E7A1E; --mark:#E2E9DC;
  --f-display:"Spectral SC", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513; --surface:#191F1C; --surface2:#242C28; --line:#35403A;
    --ink:#E5EAE5; --muted:#99A49C; --accent:#6CC2B3; --accent-ink:#0B1916; --brass:#D2AE66;
    --bomb:#E8915F; --mut:#6CC2B3; --vel:#C59EE6;
    --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A; --adv:#5FBF5F; --mark:#21302A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191F1C; --surface2:#242C28; --line:#35403A;
  --ink:#E5EAE5; --muted:#99A49C; --accent:#6CC2B3; --accent-ink:#0B1916; --brass:#D2AE66;
  --bomb:#E8915F; --mut:#6CC2B3; --vel:#C59EE6;
  --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A; --adv:#5FBF5F; --mark:#21302A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0 16px 80px}
.wrap{max-width:760px;margin:0 auto;min-width:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.4rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.pg{display:flex;gap:6px;align-items:center;min-width:0}
.pg select{max-width:46vw;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:600 .85rem var(--f-body)}
.hsub{color:var(--muted);font-size:.8rem;margin-top:4px;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px;margin-top:10px}
nav.tabs button{flex:1;padding:9px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:600 .82rem var(--f-body);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{display:grid;gap:16px;padding-top:16px}
h2{font-family:var(--f-display);font-weight:500;font-size:1.12rem;margin:0 0 8px;letter-spacing:.03em;color:var(--brass);text-wrap:balance}
h3{font-size:.95rem;margin:0}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hrow h2{margin:0}
.stack{display:grid;gap:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.field{display:grid;gap:3px;min-width:0}
.field input,.field select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 .95rem var(--f-mono)}
.field select{font-family:var(--f-body);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;font:600 .85rem var(--f-body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.danger{color:var(--cond);border-color:var(--cond)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:7px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;font:600 .82rem var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{opacity:.45}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 .8rem var(--f-body);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.lock{border-style:dashed;cursor:default}
.chip.lock[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--surface)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip.num{font-family:var(--f-mono);min-width:38px;text-align:center}
.tag{font:500 .68rem var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.tag.B{background:var(--bomb);color:var(--surface)}
.tag.M{background:var(--mut);color:var(--surface)}
.tag.V{background:var(--vel);color:var(--surface)}
.tag.G{background:var(--brass);color:var(--surface)}
.tag.no{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.tag.ok{background:transparent;border:1px solid var(--good);color:var(--good)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.kv b{display:block;font:500 1.1rem var(--f-mono);font-variant-numeric:tabular-nums}
.kv small{display:block;color:var(--muted);font-size:.72rem}
.txt{font-size:.9rem;min-width:0}
.txt p{margin:4px 0}
.note{font-size:.82rem;color:var(--muted)}
.banner{background:var(--mark);border-radius:8px;padding:8px 12px;font-size:.85rem}
.banner.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.banner ul{margin:4px 0 0;padding-left:18px}
.cond{color:var(--cond);font-weight:600}
.adv{background:var(--adv);color:#fff;padding:0 3px;border-radius:3px}
.dis{background:var(--cond);color:#fff;padding:0 3px;border-radius:3px}
.etq{font:600 .78rem var(--f-mono);color:var(--brass)}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;min-width:0}
details+details{margin-top:6px}
details summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"▸";color:var(--muted);font-weight:400}
details[open] summary::after{content:"▾"}
details .txt{margin-top:6px}
.it{display:grid;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.it .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.it .nm{font-weight:600}
.it .qta{font:600 1.05rem var(--f-mono);font-variant-numeric:tabular-nums}
.ln{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-block:3px;font-size:.88rem}
.ln span:last-child{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.ctr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ctr b{font:600 1.02rem var(--f-mono);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.ctr .pips{display:flex;gap:6px;align-items:center}
.big{font:600 2rem var(--f-mono);font-variant-numeric:tabular-nums;line-height:1}
.esito{border:1px solid var(--accent);border-radius:8px;padding:10px 12px;background:var(--mark)}
.esito .tot{font:600 1.6rem var(--f-mono)}
.dadi{font:500 .8rem var(--f-mono);color:var(--muted)}
.opt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.opt.bad{border-color:var(--warn)}
.list{display:grid;gap:6px}
.overlay{position:fixed;inset:0;background:rgba(8,12,10,.55);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.overlay .card{width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.search{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
table.t{width:100%;border-collapse:collapse;font-size:.82rem}
table.t th,table.t td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
table.t td.n{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr.oltre td{color:var(--muted);opacity:.6}
.scroll{overflow-x:auto}
.tempo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:30;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.esito{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">
    <h1>Laboratorio Alchemico</h1>
    <div class="pg">
      <select id="pgSel" aria-label="Personaggio"></select>
      <button class="btn sm" data-a="pgNuovo" type="button">Nuovo</button>
    </div>
  </div>
  <div class="hsub" id="hsub"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="scheda" type="button">Scheda</button>
    <button role="tab" data-tab="alba" type="button">Alba</button>
    <button role="tab" data-tab="borsa" type="button">Borsa</button>
    <button role="tab" data-tab="manuale" type="button">Manuale</button>
  </nav>
</header>
<main id="main"></main>
<div id="ov"></div>
<div id="toast" class="toast" hidden></div>
</div>
<script>/* Motore di calcolo dell'app Alchimista (Collana). Funzioni pure su D (dati del manuale) e S (personaggio).
   Usato dalla pagina (incluso da build.py) e dai test (node sorgenti/test_motore.js). */
(function (root) {
'use strict';

const CAMPI = ['bombarolo', 'mutagenista', 'tossicologo'];
const TIPO_CAMPO = { bombarolo: 'B', mutagenista: 'M', tossicologo: 'V' };
const U = { round: 1, min: 10, ore: 600, giorni: 14400 };

/* Configurazione degli archetipi: ciò che il testo del manuale stabilisce e che l'app deve calcolare.
   I testi completi restano quelli del manuale (D.archetipi). */
const ARCH = {
  'Alchimista metabolico': { solo: ['M'], noAltri: true,
    escl: [['M', 'Del dottor Je-Kill', '1.0', 4], ['M', 'Del dottor Je-Kill', '2.0', 6], ['M', 'Del dottor Je-Kill', '3.0', 8], ['M', 'Del dottor Je-Kill', '4.0', 10]] },
  'Sabotatore': { escl: [['M', 'Camaleontico', '1.0', 1], ['M', 'Camaleontico', '2.0', 8]], ladro: true },
  'Toxicator': { furtivo: true,
    contatori: [{ k: 'adrenalina', nome: 'Droghe psicotrope (adrenalina)', da: 1, max: S => Math.max(1, Math.floor(S.liv / 2) + S.int) }] },
  'Sherpa': { bombe: ['Criogenica', 'Folgorante', 'Sonica'], noTipi: ['V'],
    escl: [['M', 'Della montagna', '1.0', 6], ['M', 'Della montagna', '2.0', 8], ['M', 'Della montagna', '3.0', 10], ['M', 'Della montagna', '4.0', 12]],
    soloBase: ['Della montagna'],
    contatori: [{ k: 'tempesta', nome: 'Tempesta in bottiglia', da: 2, max: S => 3 + Math.floor(S.liv / 2) }] },
  'Ectochimista': { escl: [['B', 'Ectoplasmica', 1, 1]],
    contatori: [{ k: 'coprente', nome: 'Coprente ectoplasmatico', da: 1, max: () => 3 },
                { k: 'trappolafantasmi', nome: 'Trappola per fantasmi', da: 6, max: S => 1 + Math.floor((S.liv - 6) / 4) }] },
  'Profumiere': { gassose: true, dotiBonus: [['Pozione come mutageno', 4]],
    contatori: [{ k: 'profumo', nome: 'Profumo irresistibile (1 reagente)', da: 2, max: () => 1 }] },
  'Rovochimista': { escl: [['B', 'Rovospina', 1, 1]], trappoleSpinose: 6 },
  'Piromane': { bombe: ['Incendiaria'], esperto: ['Incendiaria'], potentiSolo: ['Incendiaria'], perf: ['Incendiaria', 'Esplosione ampliata'] },
  'Prometeico': {},
  'Mescicure': { sceltaEsclusione: true, dotiBonus: [['Mutageni curativi affidabili', 1]],
    contatori: [{ k: 'rimescita', nome: 'Ri-mescita curativa', da: 2, max: S => 1 + S.int + 2 * contaDote(S, 'Ri-mescita curativa extra') }] },
  'Alchimista nautico': { escl: [['M', 'Acquatico', '', 1]] },
  'Aerochimista': { escl: [['M', 'Aerostatico', '1.0', 1], ['M', 'Aerostatico', '2.0', 6]] },
  'Batteriologo': { noTipi: ['B'], furtivo: true, escl: [['M', 'Batteriologico', '1.0', 1]], soloBase: ['Batteriologico'] },
  'Acidiere': { bombe: ['Acida'], esperto: ['Acida'], perf: ['Acida', 'Bombe energo-penetranti'] },
  'Criochimista': { bombe: ['Criogenica'], esperto: ['Criogenica'], perf: ['Criogenica', 'Bombe adesive'] },
  'Granatiere': { bombe: ['Lacerante', 'Perforante'], esperto: ['Lacerante', 'Perforante'] },
  'Fulminatore': { bombe: ['Folgorante'], esperto: ['Folgorante'], perf: ['Folgorante', 'Esplosione lineare'],
    contatori: [{ k: 'arco', nome: 'Arco elettrico', da: 1, max: S => Math.max(0, S.int) }] },
  'Detonatore sonico': { bombe: ['Sonica'], esperto: ['Sonica'], perf: ['Sonica', 'Esplosione conica'] },
};
const ROVO_MOD = ['Bombe subacquee', 'Esplosione ampliata', 'Spargimento calcolato', 'Trappole spinose'];
const GASSOSE_NO = ['Bombe subacquee', 'Esplosione ampliata', 'Esplosione lineare', 'Esplosione conica', 'Mega-esplosione'];
const MOD_INCOMP = [['Esplosione ampliata', 'Esplosione lineare'], ['Esplosione ampliata', 'Esplosione conica'], ['Esplosione lineare', 'Esplosione conica']];

let D = null;
function init(dati) { D = dati; }
function arch(S) { return ARCH[S.arch] || {}; }
function cfgArch() { return ARCH; }

/* ---------- utilità ---------- */
const mezzoInt = i => Math.ceil(i / 2);        /* metà bonus di Intelligenza: per eccesso (decisione 13/10) */
function campo(S) { const a = D.archetipi.find(x => x.nome === S.arch); return (a && a.campo) || S.campo; }
function archDati(S) { return D.archetipi.find(x => x.nome === S.arch) || null; }
function dote(nome) { return D.doti.find(d => d.nome === nome) || null; }
function contaDote(S, nome) { return (S.doti || []).filter(n => n === nome).length + (dotiAuto(S).some(d => d.nome === nome) ? 1 : 0); }
function haDote(S, nome) { return contaDote(S, nome) > 0; }

/* doti ottenute automaticamente (scoperte specialistiche del campo e doti bonus dell'archetipo) */
function dotiAuto(S) {
  const out = [];
  const c = campo(S);
  const ad = archDati(S);
  const sost = (ad && ad.scoperte_sostituite) || [];
  if (c) for (const [k, sc] of Object.entries(D.scoperte)) {
    if (S.liv < sc.liv || sost.includes(k)) continue;
    for (const n of sc[c].doti) if (!out.some(x => x.nome === n)) out.push({ nome: n, fonte: 'Scoperta specialistica ' + k + ' (' + sc.liv + '°)' });
  }
  for (const [n, l] of (arch(S).dotiBonus || [])) if (S.liv >= l && !out.some(x => x.nome === n)) out.push({ nome: n, fonte: S.arch + ' (' + l + '°)' });
  if (S.arch === 'Piromane' && !out.some(x => x.nome === 'Bombe potenti')) out.push({ nome: 'Bombe potenti', fonte: 'Miscela infernale (solo incendiarie)' });
  return out;
}

/* ---------- livelli, reagenti, contatori ---------- */
function reagentiGiorno(S) {
  let r = S.liv + (S.liv >= 6 ? S.int : mezzoInt(S.int));
  r += contaDote(S, 'Reagente infuso extra');
  return Math.max(1, r);
}
function inibitoriMax(S) {
  if (arch(S).noAltri) return 0;
  if (haDote(S, 'Agenti inibitori extra')) return Infinity;
  return Math.max(0, 3 + S.int);
}
function slotDoti(S) {
  const ad = archDati(S);
  const sost = (ad && ad.doti_sostituite) || [];
  const out = [];
  for (let l = 2; l <= S.liv; l += 2) if (!sost.includes(l)) out.push(l);
  return out;
}
function contatori(S) {
  const out = [];
  const add = (k, nome, max, nota) => { if (max > 0 || max === Infinity) out.push({ k, nome, max, nota: nota || '' }); };
  add('inibitori', 'Agenti inibitori', inibitoriMax(S), inibitoriMax(S) === Infinity ? 'illimitati (Agenti inibitori extra)' : '3 + Int');
  if (S.liv >= 9) add('bioreazione', 'Bio-reazione', 1, 'cura ' + 2 * S.liv + ' PF prima dei danni');
  if (haDote(S, 'Liquido decatalizzante')) add('decatalizzante', 'Liquido decatalizzante', 1, '2 oggetti di base → 1 reagente');
  if (haDote(S, 'Bombardamento sicuro')) add('bombsicuro', 'Bombardamento sicuro', 2, 'ripeti un 1 naturale');
  if (haDote(S, 'Veleni ultraletali')) add('ultraletali', 'Veleni ultraletali', 2, 'il nemico ripete il TS');
  if (haDote(S, 'Alterazione molecolare')) add('alterazione', 'Alterazione molecolare', 3, 'Tempra ↔ Volontà, CD −2');
  if (haDote(S, 'Fede tossica')) add('fede', 'Fede tossica', 3 * contaDote(S, 'Fede tossica'), '33% di non consumare la dose');
  if (haDote(S, 'Pozione come mutageno')) add('pozione', 'Pozione come mutageno', Math.max(0, S.int), '');
  for (const c of (arch(S).contatori || [])) if (S.liv >= c.da) add(c.k, c.nome, c.max(S), '');
  return out;
}
function attaccoFurtivo(S) { return arch(S).furtivo && S.liv >= 2 ? 1 + Math.floor((S.liv - 2) / 4) : 0; }

/* ---------- requisiti delle doti ---------- */
function requisiti(S, d) {
  const ok = [], no = [], ver = [];
  if (d.esclusiva && d.esclusiva !== S.arch) no.push('solo ' + d.esclusiva);
  const r = d.req;
  if (r) {
    if (r.alt.length) {
      const c = campo(S);
      const sod = r.alt.some(a => (!a.campo || a.campo === c) && S.liv >= a.liv);
      if (!sod) no.push(r.alt.map(a => (a.campo ? 'alchimista ' + a.campo : 'alchimista') + ' di ' + a.liv + '°').join(' o '));
    }
    for (const n of r.doti) if (!haDote(S, n)) no.push('dote ' + n);
    if (r.no_arch && S.arch && S.arch.toLowerCase() === r.no_arch.toLowerCase()) no.push('non per ' + S.arch);
    if (r.arch && S.arch !== r.arch) no.push('solo ' + r.arch);
    if (r.n_pot) { const n = D.doti.filter(x => x.pot != null && haDote(S, x.nome)).length; if (n < r.n_pot) no.push(r.n_pot + ' doti di potenziamento'); }
    for (const a of r.altro) ver.push(a);
  }
  return { ok: !no.length, no, ver };
}
function doteSelezionabile(S, d) {
  const n = contaDote(S, d.nome);
  const max = d.multipla === true ? 99 : (d.multipla || 1);
  return n < max;
}

/* ---------- formulario ---------- */
function chiaveB(tipo, liv) { return 'B|' + tipo + '|' + liv; }
function chiaveM(nome, v) { return 'M|' + nome + '|' + v; }
function chiaveV(nome) { return 'V|' + nome; }
function bomba(nome) { return D.bombe.find(b => b.nome === nome); }
function mutageno(nome) { return D.mutageni.find(m => m.nome === nome); }

const D = {"fonte":"Alchimista_v2.4.2_FINALE.docx","tabella":[{"liv":1,"bab":"+0","tem":"+2","rif":"+2","vol":"+0","priv":["Campo di ricerca","Borsa dell’alchimista","Formulario alchemico","Oggetti alchemici","Scoperta specialistica alpha"]},{"liv":2,"bab":"+1","tem":"+3","rif":"+3","vol":"+0","priv":["Dote da alchimista"]},{"liv":3,"bab":"+2","tem":"+3","rif":"+3","vol":"+1","priv":["Scoperta specialistica beta"]},{"liv":4,"bab":"+3","tem":"+4","rif":"+4","vol":"+1","priv":["Dote da alchimista"]},{"liv":5,"bab":"+3","tem":"+4","rif":"+4","vol":"+1","priv":["Scoperta specialistica gamma"]},{"liv":6,"bab":"+4","tem":"+5","rif":"+5","vol":"+2","priv":["Dote da alchimista"]},{"liv":7,"bab":"+5","tem":"+5","rif":"+5","vol":"+2","priv":["Miscelazione sicura"]},{"liv":8,"bab":"+6/+1","tem":"+6","rif":"+6","vol":"+2","priv":["Dote da alchimista"]},{"liv":9,"bab":"+6/+1","tem":"+6","rif":"+6","vol":"+3","priv":["Bio-reazione"]},{"liv":10,"bab":"+7/+2","tem":"+7","rif":"+7","vol":"+3","priv":["Dote da alchimista"]},{"liv":11,"bab":"+8/+3","tem":"+7","rif":"+7","vol":"+3","priv":["Scoperta specialistica lambda"]},{"liv":12,"bab":"+9/+4","tem":"+8","rif":"+8","vol":"+4","priv":["Dote da alchimista"]},{"liv":13,"bab":"+9/+4","tem":"+8","rif":"+8","vol":"+4","priv":["Scoperta specialistica epsilon"]},{"liv":14,"bab":"+10/+5","tem":"+9","rif":"+9","vol":"+4","priv":["Dote da alchimista"]},{"liv":15,"bab":"+11/+6/+1","tem":"+9","rif":"+9","vol":"+5","priv":["Sangue nauseabondo"]},{"liv":16,"bab":"+12/+7/+2","tem":"+10","rif":"+10","vol":"+5","priv":["Dote da alchimista"]},{"liv":17,"bab":"+12/+7/+2","tem":"+10","rif":"+10","vol":"+5","priv":["Scoperta specialistica omega"]},{"liv":18,"bab":"+13/+8/+3","tem":"+11","rif":"+11","vol":"+6","priv":["Dote da alchimista"]},{"liv":19,"bab":"+14/+9/+4","tem":"+11","rif":"+11","vol":"+6","priv":["Alchimista magistrale"]},{"liv":20,"bab":"+15/+10/+5","tem":"+12","rif":"+12","vol":"+6","priv":["Dote da alchimista","Preparazione abbondante"]}],"privilegi":[{"nome":"Campo di ricerca","testo":["Al 1° livello, a causa della vastità della natura stessa, un alchimista deve inevitabilmente scegliere uno specifico campo scientifico sul quale concentrarsi tra bombarolo, mutagenista e tossicologo. I bombaroli amano il modo in cui gli elementi si legano, in particolar modo quelli che portano a reazioni esplosive. I mutagenisti sono degli esperti nel creare soluzioni mirate a potenziare o a risanare. I tossicologi, si dedicano allo studio e alla creazione di sostanze debilitanti."]},{"nome":"Borsa dell’alchimista","testo":["Al 1° livello, un alchimista ottiene una borsa dell’alchimista, un contenitore impermeabile e dotato di pratici scomparti imbottiti. Questa borsa è ideale per custodire sia i reagenti infusi che i delicati contenitori degli oggetti alchemici, sostanze che non possono essere tenute altrove data la loro pericolosità e delicatezza. Se un alchimista dovesse perdere la propria borsa, dovrà procurarsene una nuova. Bombe alchemiche, mutageni e veleni sono tutti conservati in fiale o siringhe delle dimensioni di 8-10 cm circa.","Estrarre un oggetto dalla borsa dell’alchimista è un’azione gratuita."]},{"nome":"Formulario alchemico","testo":["Al 1° livello, un alchimista ottiene un formulario contenente le ricette degli oggetti alchemici che ha elaborato durante l’apprendistato. All’inizio questo volume contiene otto formule di 1° livello a scelta tra bombe alchemiche, mutageni e veleni, due delle quali devono essere però obbligatoriamente inerenti al campo di ricerca scelto dall’alchimista, e cioè bombe alchemiche per bombarolo, mutageni per mutagenista e veleni per tossicologo.","Quando ottiene un nuovo livello, un alchimista aggiunge due formule a scelta di qualsiasi tipo, che siano però di livello pari o inferiore al proprio livello. Ogni formula viene sempre elaborata in maniera originale e personalizzata, pertanto non è possibile utilizzare quelle ideate da altri."]},{"nome":"Oggetti alchemici","testo":["Gli oggetti alchemici sfruttano le proprietà di sostanze chimiche volatili, dei minerali e delle piante: essi sono unici degli alchimisti e differiscono dagli intrugli che possono essere trovati presso un normale negozio di alchimia. Per creare gli oggetti alchemici, un alchimista necessita obbligatoriamente di particolari sostanze basilari chiamate reagenti infusi. I reagenti infusi e gli oggetti alchemici non sono considerati magici.","* Reagenti infusi: I reagenti infusi sono sostanze polivalenti che, se unite a dei catalizzatori, si trasformano in oggetti alchemici dagli effetti più disparati. Si possono creare gli oggetti alchemici tramite l’alchimia di base o l’alchimia rapida, come descritto sotto. Un alchimista non può utilizzare i reagenti infusi creati da altri.","Creazione: All’alba di ogni giorno dopo 8 ore di riposo, un alchimista ottiene un numero di reagenti infusi pari al livello di alchimista + metà bonus di Intelligenza. Dal 6° livello invece, un alchimista ottiene un numero di reagenti infusi pari al livello di alchimista + bonus di Intelligenza.","Durata: I reagenti infusi vengono scartati all’alba del giorno seguente.","* Alchimia di base: All’alba di ogni giorno dopo 8 ore di riposo, un alchimista può usare un qualsiasi numero di reagenti infusi per creare degli oggetti alchemici.","Creazione: Per creare un oggetto alchemico tramite l’alchimia di base è necessario un reagente infuso, un Kit da artigiano (alchimista) e la formula di un oggetto alchemico di livello pari o inferiore al proprio livello. Per ogni reagente infuso così usato, vengono a crearsi due esemplari identici dell’oggetto alchemico scelto (bomba alchemica, mutageno o veleno).","Durata: Gli oggetti alchemici creati tramite alchimia di base vengono scartati all’alba del giorno seguente.","* Alchimia rapida: I reagenti infusi non utilizzati all’alba tramite alchimia di base vengono conservati nella borsa dell’alchimista. Un alchimista può usare un reagente infuso tenuto da parte per creare degli oggetti alchemici nel momento del bisogno. Il processo è identico a quello descritto per l’alchimia di base ma alla fine del processo verrà a crearsi un solo esemplare dell’oggetto alchemico scelto, anziché due.","Creazione: Creare un oggetto con alchimia rapida è un’azione di movimento che provoca attacchi di opportunità.","Durata: Gli oggetti alchemici creati tramite alchimia rapida vengono scartati dopo 1 minuto."]},{"nome":"Scoperta specialistica alpha","testo":["Al 1° livello, in base al proprio campo di ricerca, un alchimista ottiene una dote da alchimista:","* Bombarolo: ottiene la dote da alchimista Bombe potenti.","* Mutagenista: ottiene la dote da alchimista Agenti inibitori extra.","* Tossicologo: ottiene le doti da alchimista Avvelenamento rapido e Miscelazione tossica. Inoltre, ottiene il talento Uso dei veleni (non deve soddisfarne i requisiti)."]},{"nome":"Doti da alchimista","testo":["Al 2° livello e ogni due ulteriori livelli, un alchimista ottiene una dote da alchimista a scelta. Salvo diversamente indicato, ciascuna dote può essere selezionata solamente una volta."]},{"nome":"Scoperta specialistica beta","testo":["Al 3° livello, in base al proprio campo di ricerca, un alchimista ottiene una dote da alchimista:","* Bombarolo: ottiene la dote da alchimista Bombe a go-go.","* Mutagenista: ottiene la dote da alchimista Studi mutagenici avanzati.","* Tossicologo: ottiene la dote da alchimista Attacco venefico concentrato."]},{"nome":"Scoperta specialistica gamma","testo":["Al 5° livello, in base al proprio campo di ricerca, un alchimista ottiene una dote da alchimista:","* Bombarolo: ottiene la dote da alchimista Bombe diluite.","* Mutagenista: ottiene la dote da alchimista Iniezione sicura.","* Tossicologo: ottiene la dote da alchimista Veleno durevole."]},{"nome":"Miscelazione sicura","testo":["Al 7° livello, creare un oggetto con alchimia rapida è un’azione di movimento che non provoca attacchi di opportunità."]},{"nome":"Bio-reazione","testo":["Al 9° livello, un alchimista si è ormai inoculato così tante sostanze alchemiche che il suo corpo reagisce da solo alle ferite più gravi. Una volta al giorno, quando subisce danni che lo farebbero scendere a 0 o meno Punti Ferita, l’alchimista si cura di 2 Punti Ferita per livello di alchimista prima che i danni vengano applicati."]},{"nome":"Scoperta specialistica lambda","testo":["All'11° livello, in base al proprio campo di ricerca, un alchimista ottiene una dote da alchimista:","* Bombarolo: ottiene la dote da alchimista Bombe diluite, applicandola a un diverso tipo di bomba alchemica.","* Mutagenista: ottiene la dote da alchimista Mutageni concentrati superiori.","* Tossicologo: ottiene la dote da alchimista Critico intossicante."]},{"nome":"Scoperta specialistica epsilon","testo":["Al 13° livello, in base al proprio campo di ricerca, un alchimista ottiene una dote da alchimista:","* Bombarolo: ottiene la dote da alchimista Spargimento calcolato.","* Mutagenista: ottiene la dote da alchimista Cocktail mutagenico.","* Tossicologo: ottiene la dote da alchimista Alterazione molecolare."]},{"nome":"Sangue nauseabondo","testo":["Al 15° livello, a forza di iniettarsi mutageni, veleni e reagenti tossici, il sangue di un alchimista è ormai saturo di sostanze pericolose. Tutte le creature che mordono l'alchimista devono superare un Tiro Salvezza su Tempra con CD 10 + metà livello di alchimista + bonus di Intelligenza o essere nauseate per 1d3 round. Le creature che inghiottono l’alchimista devono effettuare il tiro ogni round ma non appena ne superano uno, possono decidere di vomitarlo. Le creature dotate di Fiuto sono consapevoli della minaccia celata dal sangue dell’alchimista."]},{"nome":"Scoperta specialistica omega","testo":["Al 17° livello, in base al proprio campo di ricerca, un alchimista ottiene una dote da alchimista:","* Bombarolo: ottiene la dote da alchimista Bombardamento sicuro.","* Mutagenista: ottiene la dote da alchimista Nuovo mutageno concentrato.","* Tossicologo: ottiene la dote da alchimista Veleni ultraletali."]},{"nome":"Alchimista magistrale","testo":["Al 19° livello, creare un oggetto con alchimia rapida è un’azione gratuita effettuabile una volta per turno."]},{"nome":"Preparazione abbondante","testo":["Al 20° livello, ogni giorno un alchimista ottiene 2d4+2 reagenti infusi extra."]}],"scoperte":{"alpha":{"liv":1,"bombarolo":{"doti":["Bombe potenti"],"testo":"ottiene la dote da alchimista Bombe potenti."},"mutagenista":{"doti":["Agenti inibitori extra"],"testo":"ottiene la dote da alchimista Agenti inibitori extra."},"tossicologo":{"doti":["Avvelenamento rapido","Miscelazione tossica"],"testo":"ottiene le doti da alchimista Avvelenamento rapido e Miscelazione tossica. Inoltre, ottiene il talento Uso dei veleni (non deve soddisfarne i requisiti)."}},"beta":{"liv":3,"bombarolo":{"doti":["Bombe a go-go"],"testo":"ottiene la dote da alchimista Bombe a go-go."},"mutagenista":{"doti":["Studi mutagenici avanzati"],"testo":"ottiene la dote da alchimista Studi mutagenici avanzati."},"tossicologo":{"doti":["Attacco venefico concentrato"],"testo":"ottiene la dote da alchimista Attacco venefico concentrato."}},"gamma":{"liv":5,"bombarolo":{"doti":["Bombe diluite"],"testo":"ottiene la dote da alchimista Bombe diluite."},"mutagenista":{"doti":["Iniezione sicura"],"testo":"ottiene la dote da alchimista Iniezione sicura."},"tossicologo":{"doti":["Veleno durevole"],"testo":"ottiene la dote da alchimista Veleno durevole."}},"lambda":{"liv":11,"bombarolo":{"doti":["Bombe diluite"],"testo":"ottiene la dote da alchimista Bombe diluite, applicandola a un diverso tipo di bomba alchemica."},"mutagenista":{"doti":["Mutageni concentrati superiori"],"testo":"ottiene la dote da alchimista Mutageni concentrati superiori."},"tossicologo":{"doti":["Critico intossicante"],"testo":"ottiene la dote da alchimista Critico intossicante."}},"epsilon":{"liv":13,"bombarolo":{"doti":["Spargimento calcolato"],"testo":"ottiene la dote da alchimista Spargimento calcolato."},"mutagenista":{"doti":["Cocktail mutagenico"],"testo":"ottiene la dote da alchimista Cocktail mutagenico."},"tossicologo":{"doti":["Alterazione molecolare"],"testo":"ottiene la dote da alchimista Alterazione molecolare."}},"omega":{"liv":17,"bombarolo":{"doti":["Bombardamento sicuro"],"testo":"ottiene la dote da alchimista Bombardamento sicuro."},"mutagenista":{"doti":["Nuovo mutageno concentrato"],"testo":"ottiene la dote da alchimista Nuovo mutageno concentrato."},"tossicologo":{"doti":["Veleni ultraletali"],"testo":"ottiene la dote da alchimista Veleni ultraletali."}}},"regole":{"bombe":[{"nome":"","testo":["Le bombe alchemiche sono resistenti sfere di cristallo, nelle quali sono miscelati componenti chimici volatili che esplodono producendo svariati tipi di effetti."]},{"nome":"Formule progressive","testo":["Affinché un alchimista possa creare una bomba alchemica con un determinato livello di oggetto, deve necessariamente possedere la versione con il livello di oggetto immediatamente inferiore."]},{"nome":"Uso","testo":["Le bombe alchemiche sono armi a spargimento con incremento di gittata di 6 m (x5) e un raggio di spargimento di 1 casella. Ogni turno un alchimista può lanciare una bomba alchemica per ciascun attacco di cui dispone. Salvo espressamente indicato, il danno delle bombe alchemiche non può essere incrementato in alcun modo tramite talenti, privilegi di classe o capacità varie. Le bombe alchemiche non causano mai colpi critici. Una bomba alchemica che esplode causa un forte rumore udibile entro 100 m. Le bombe alchemiche non esplodono sott’acqua o a contatto con i liquidi.","Le bombe alchemiche sono sempre considerate magiche ai fini del superamento della Riduzione del Danno (RD)."]}],"mutageni":[{"nome":"","testo":["I mutageni sono potenti miscele dagli effetti più disparati, inoculate tramite siringhe riutilizzabili."]},{"nome":"Formule progressive","testo":["Affinché un alchimista possa acquisire una formula avanzata di un mutageno, deve necessariamente possedere la sua versione precedente (1.0, 2.0, 3.0, etc.)."]},{"nome":"Uso","testo":["L’effetto di un mutageno termina solo allo scadere della sua durata. Iniettarsi un mutageno mentre uno identico è già in atto, indipendentemente dalla versione (1.0, 2.0, etc.), pone termine a quello attivo e dà inizio a quello nuovo. Iniettare un mutageno è un’azione standard che provoca attacchi di opportunità. Salvo diversamente indicato, “livello” indica il livello di alchimista di chi ha creato il mutageno."]},{"nome":"Mutageni sugli alleati","testo":["Gli alchimisti sono abituati agli effetti nocivi dei mutageni ma i loro alleati non sono così fortunati. Inoculare un mutageno a una creatura senza livelli di alchimista non ha quindi effetto alcuno e anzi, spesso provoca febbre e debolezza. Per somministrare i mutageni agli alleati quindi, gli alchimisti preparano alcune dosi di agente inibitore che, se inoculate assieme a un mutageno, ne consentono l’utilizzo senza controindicazioni. Il numero massimo di dosi di agente inibitore che un alchimista può preparare ogni giorno è pari a 3 + bonus di Intelligenza (in pratica gli agenti inibitori rappresentano il numero di mutageni inoculabili agli altri)."]},{"nome":"Concentrato","testo":["Se un mutageno è classificato come concentrato, come azione di round completo l’alchimista può muoversi e inocularlo a diverse creature (massimo 2, salvo doti che aumentano il numero) durante il proprio round e in qualsiasi punto durante il proprio movimento. La durata del mutageno viene suddivisa equamente tra i fruitori."]},{"nome":"Giornaliero/settimanale/mensile","testo":["Se un mutageno è classificato come giornaliero, settimanale o mensile, significa che una creatura può fruirne di una sola dose in quel lasso di tempo. Ulteriori iniezioni saranno inefficaci."]}],"veleni":[{"nome":"","testo":["Sebbene siano in molti quelli in grado di saper riconoscere e recuperare le ghiandole velenifere degli animali o le parti velenose di alcuni vegetali, sono gli alchimisti coloro che si occupano di lavorare tali materie prime per trasformarle in letali veleni. Le dosi di queste sostanze sono conservate in fiale o in qualche altro tipo di contenitore sicuro e protetto."]},{"nome":"Formule progressive","testo":["Affinché un alchimista possa acquisire la formula di un veleno, deve necessariamente possederne una qualsiasi di almeno 2 livelli inferiore (i veleni di 1° e 2° livello non hanno questo requisito)."]},{"nome":"Veleni da ferimento","testo":["Tutti i veleni descritti in seguito sono da ferimento, salvo quanto previsto dalla dote Veleni a contatto, e possono essere applicati solamente ad armi taglienti o perforanti."]},{"nome":"Creare veleni da ingestione","testo":["Versando 1 dose di veleno per ogni 5 litri di capienza (una pentola di stufato) si può far sì che il cibo o il liquido trattati provochino gli effetti del veleno a chiunque li ingerisca. Se non si possiede una sufficiente quantità di veleno per colmare la totalità della pietanza che si vuole avvelenare, il veleno non ha effetto. In caso di ingestione, la vittima effettua il Tiro Salvezza immediatamente dopo aver assunto il veleno ma ne subisce gli effetti solamente dopo 5 minuti. Se la vittima supera il Tiro Salvezza, non solo non subisce gli effetti del veleno, ma si accorge che il cibo è stato alterato. Una creatura che porti alla bocca un cibo avvelenato potrà notare il veleno superando una prova di Professione (alchimista) con CD 15 + livello di oggetto del veleno. Se la prova riesce si identifica anche il tipo di veleno. In alternativa, si può effettuare una prova di Professione (cerusico) o Sopravvivenza (quale sia la più alta) ma in quel caso si noterà solo la presenza del veleno ma senza identificarne le proprietà. Se qualcuno cerca attivamente un veleno ottiene +4 alla prova."]},{"nome":"Applicare i veleni","testo":["Applicare un veleno è un'azione standard che causa attacchi di opportunità. Una dose di veleno può essere applicata su una singola arma o munizione. Quando un alchimista applica ad un’arma un veleno da ferimento ha il 10% di probabilità di entrare in contatto con esso e subirne gli effetti (entrare in contatto con il veleno in questo modo non consuma la dose). Un veleno perde immediatamente il proprio effetto se la superficie che lo ospita viene a contatto con l’acqua."]},{"nome":"Permanenza dei veleni","testo":["Un veleno da ferimento mantiene la sua tossicità per 6 ore o finché non viene inoculato con il primo colpo a segno dell’arma. Il veleno su una munizione è considerato automaticamente sprecato assieme ad essa una volta lanciata. Se l’alchimista cede la propria arma o munizione a qualcun altro, il veleno scompare. Un veleno da ingestione, dopo 4 ore altera visivamente ed olfattivamente il cibo o la bevanda in cui si trova, destando sospetto e vanificando il tentativo di avvelenamento."]},{"nome":"Attaccare con armi avvelenate","testo":["Utilizzare armi avvelenate richiede una grande cautela e per questo motivo è possibile utilizzarne massimo una durante il medesimo round, sia che si combatta in mischia con due armi che si abbia una faretra con molte munizioni già avvelenate. Quando un alchimista attacca con un'arma avvelenata e ottiene un 1 nel tiro per colpire, subisce gli effetti del veleno, consumandone la dose."]},{"nome":"Tiro Salvezza","testo":["La CD del Tiro Salvezza per resistere a un veleno è 10 + modificatore di tossicità + bonus di Intelligenza di chi lo ha creato."]},{"nome":"Nemici immuni ai veleni","testo":["Le creature viventi immuni agli effetti di [VELENO] sono comunque soggette ai veleni creati da un alchimista, ma ottengono un bonus di +3 ai Tiri Salvezza per resistervi."]},{"nome":"Effetti e danni dei veleni","testo":["Alcuni veleni hanno effetti simili agli incantesimi o causano condizioni specifiche (paura, confusione, etc.). I veleni non sono mai considerati causare effetti di [PAURA], [CHARME], [COMPULSIONE], [MALEDIZIONE], etc. I danni inflitti dai veleni sono a tutti gli effetti “danni da veleno”."]},{"nome":"Potenza","testo":["La potenza del veleno è un valore necessario ad applicare le doti da alchimista classificate come sperimentali (vedi in seguito)."]},{"nome":"Esposizioni multiple","testo":["Se si viene esposti a dosi multiple dello stesso veleno, la durata degli effetti si resetta, senza cumularsi."]}],"doti":["Modifica: Le doti classificate come [modifica], vengono usate per cambiare le caratteristiche basilari delle bombe alchemiche non diluite. Si possono applicare più doti di modifica a una singola bomba alchemica, ma mai la stessa. Il modificatore totale consentito per le modifiche è massimo +5 e la bomba risultante conta come avente un livello di oggetto ridotto del totale di modifica raggiunto (non può essere 0 o inferiore). Le bombe alchemiche possono essere modificate solamente tramite alchimia di base e mai tramite alchimia rapida.","Potenziamento: Le doti classificate come [potenziamento], vengono usate per cambiare le caratteristiche basilari dei veleni. Si possono applicare più doti di potenziamento a un singolo veleno, ma mai la stessa. I valori di potenziamento devono essere sommati a quello del veleno stesso e il valore risultante non può superare la potenza del veleno col valore più alto presente nel proprio formulario alchemico. Un veleno migliorato da una o più doti di potenziamento deve essere creato utilizzando 1 reagente infuso, ricavandone una singola dose anziché le solite due. Ad esempio, un alchimista di 10° livello può creare veleni con una potenza massima di 5 e ne ha uno di tale potenza nel formulario alchemico. Decide di applicare le doti Veleni trenodici (+1) e Veleni debilitanti (+2) per un totale di potenziamento di +3. Il veleno al quale si potrà applicare questa combinazione di potenziamenti potrà avere quindi un livello massimo di potenza di 2 (per un totale risultante di 5). I veleni possono essere potenziati solamente tramite alchimia di base e mai tramite alchimia rapida."]},"profilo":[{"liv":1,"n":2,"d":6,"spa":1},{"liv":3,"n":3,"d":8,"spa":2},{"liv":5,"n":4,"d":8,"spa":3},{"liv":7,"n":5,"d":10,"spa":4},{"liv":9,"n":5,"d":12,"spa":5},{"liv":11,"n":6,"d":12,"spa":6},{"liv":13,"n":7,"d":12,"spa":7},{"liv":15,"n":8,"d":12,"spa":8},{"liv":17,"n":9,"d":12,"spa":9},{"liv":19,"n":10,"d":12,"spa":10}],"bombe":[{"nome":"Acida","ingr":"solfuro + cloro","testo":["La bomba infligge danni da acido. Lo spargimento infligge 1 danno extra e ha un raggio aumentato di 1 casella."]},{"nome":"Criogenica","ingr":"freon + VT-214","testo":["La bomba infligge danni da freddo. Se il bersaglio primario viene ferito subisce penalità di -3 m al movimento fino alla fine del suo prossimo turno. Al 10° livello di alchimista, se il bersaglio primario viene ferito, nel suo prossimo turno potrà compiere passi di 1,5 m solo come azione di movimento."]},{"nome":"Essiccante","ingr":"nitrato + J-200","testo":["La bomba infligge danni contundenti. Contro le creature acquatiche o con il sottotipo acqua, le creature vegetali e le melme la bomba può ripetere i risultati di 1 e 2 ottenuti. Inoltre, le caselle colpite che sono occupate da vegetazione comune, ragnatele o colla, diventano terreno sgombro in 1d3 round (questo effetto secondario non si applica alle bombe diluite). Per eliminare vegetazione, ragnatele o colla di origine magica è necessaria una prova di dissoluzione, come per l’incantesimo Dissolvi magie."]},{"nome":"Folgorante","ingr":"fluoro + agente blu","testo":["La bomba infligge danni da elettricità. Il bersaglio primario ferito subisce penalità non cumulabile -1 ai tiri per colpire fino alla fine del suo prossimo turno."]},{"nome":"Incendiaria","ingr":"idrogeno + idrocarburo naftenico","testo":["La bomba infligge danni da fuoco. Se il bersaglio primario viene ferito, all’inizio del suo prossimo turno subisce il danno da spargimento della bomba."]},{"nome":"Resinosa","ingr":"polietilene + paraffina 12","testo":["La bomba infligge danni contundenti e non letali e la sua esplosione non provoca alcun rumore. Contro i costrutti la bomba infligge danni letali e può ripetere i risultati di 1 e 2 ottenuti. Inoltre, se il bersaglio primario è un costrutto e viene ferito, diventa anche offuscato 20% fino alla fine del suo prossimo turno."]},{"nome":"Sonica","ingr":"agente bianco + zinco","testo":["La bomba infligge danni sonori ma i dadi di danno lanciati sono ridotti di una categoria (d8→d6, d12→d10). Se il bersaglio primario viene ferito deve superare un Tiro Salvezza su Tempra con CD 10 + metà livello di oggetto della bomba sonica + bonus di Intelligenza o essere assordato per 1 minuto (un incantatore assordato ha il 20% di probabilità di fallire gli incantesimi con componente verbale). La CD aumenta di 1 all’8° e al 16° livello."]},{"nome":"Warp","ingr":"salgemma + acqua santa","testo":["La bomba infligge danni contundenti. Contro gli esterni i dadi di danno lanciati sono aumentati di una categoria (d8→d10). Se il dado è già un d12, ripete invece i risultati di 1."]},{"nome":"Lacerante","ingr":"scaglie metalliche + carica cava","testo":["La bomba proietta una raffica di schegge affilate e infligge danni taglienti. Contro bersagli privi di armatura o con armatura leggera, se il bersaglio primario viene ferito subisce il danno da spargimento della bomba anche all’inizio del suo prossimo turno. Questo è un effetto di [SANGUINAMENTO]."]},{"nome":"Perforante","ingr":"chiodi + propellente cinetico","testo":["La bomba spara una rosa di chiodi ad altissima velocità e infligge danni perforanti. Il bersaglio primario ferito vede ignorata una quota della propria RD/— pari al danno da spargimento della bomba (la RD/magia e simili sono già superate dal fatto che le bombe sono considerate magiche)."]},{"nome":"Ectoplasmica","ingr":"ectoplasma semi-inerte + anticatalizzante T-9","testo":["La bomba alchemica infligge danni da energia negativa e ripete i risultati di 1 ottenuti nei tiri per i danni. Contro i non morti invece, la bomba infligge danni da energia positiva e ripete i risultati di 1 e 2 ottenuti nei tiri per i danni. Inoltre, contro le creature incorporee, infligge sempre danni pieni e ignora la percentuale di essere mancati derivante da tale condizione. Infine, le creature invisibili ferite da una bomba ectoplasmica diventano visibili e non possono tornare invisibili per 1 minuto, se la loro invisibilità è un effetto continuo o una capacità speciale."],"esclusiva":"Ectochimista","formula":"Al 1° livello, un ectochimista aggiunge la formula della bomba Ectoplasmica al proprio formulario, al posto di una delle sei consuete formule a scelta. Si può in seguito acquisire formule potenziate della bomba Ectoplasmica come per le altre bombe."},{"nome":"Rovospina","ingr":"semi di piante da rovo + fertilizzante alchemico 1A79","testo":["Una bomba rovospina infligge al bersaglio primario danni perforanti pari alla metà di quelli indicati nel profilo generico (arrotondati per difetto), ai quali si aggiunge per intero il bonus della dote Bombe potenti. Non infligge danni da spargimento, ma crea un’intricata serie di rovi in un’area di 3 m quadrati che permane per un numero di round pari al bonus di Intelligenza del rovochimista (minimo 1). Le creature colpite dalla bomba e quelle che si muovono successivamente attraverso i rovi sono incapaci di muoversi e, a causa dei graffi e dei rami avviluppanti, subiscono -2 ai tiri per colpire e -2 alla CA fino all’inizio del loro prossimo turno. Le vittime possono superare un Tiro Salvezza su Riflessi con CD 10 + metà livello di oggetto della bomba + bonus di Intelligenza per ridurre a -1 le penalità ed essere in grado di muoversi. L’area occupata dai rovi è comunque considerata terreno difficile. Una creatura impossibilitata a muoversi a causa dei rovi può liberarsi superando una prova di Forza con la stessa CD del Tiro Salvezza oppure infliggendo ai rovi 15 danni con un’arma tagliente. Se una creatura all’interno dei rovi tenta di lanciare un incantesimo, deve prima superare una prova di Concentrazione con CD 15 + il livello dell’incantesimo. Una bomba rovospina può essere modificata solo con le doti da alchimista Bombe subacquee, Esplosione ampliata (l’area dei rovi diventa di 4,5 m quadrati), Spargimento calcolato (un numero di creature pari al bonus di Intelligenza ignora gli effetti dei rovi) e Trappole spinose, e non può essere creata in versione diluita. I rovi che dovrebbero crearsi sopra quelli di un’altra bomba rovospina si tramutano in polvere."],"esclusiva":"Rovochimista","formula":"Al 1° livello, un rovochimista aggiunge la formula della bomba Rovospina al proprio formulario, al posto di una delle sei consuete formule a scelta. Si può in seguito acquisire formule potenziate della bomba Rovospina come per le altre bombe."}],"mutageni":[{"nome":"A tenuta stagna","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Una piccola sacca d'aria invisibile circonda la testa del fruitore. La sacca fornisce bonus +4 contro gli effetti nocivi di odori, gas ed effetti di [VELENO] ad inalazione. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Aerifero","livelli":[12],"tag":[],"comune":"","versioni":[{"v":"","liv":12,"testo":"La pelle del fruitore diventa in grado di assorbire l’ossigeno direttamente dall’acqua consentendogli di respirare in tale liquido. L’effetto dura 10 minuti.","tag":[],"durata":{"q":10,"u":"min","per":0}}],"esclusivo":null},{"nome":"Analitico","livelli":[10],"tag":[],"comune":"","versioni":[{"v":"","liv":10,"testo":"Come azione di movimento il fruitore può studiare una creatura entro 18 m: fino al termine del mutageno ottiene vantaggio ai tiri per colpire contro di essa, ignora fino a 5 punti della sua RD e conosce le sue resistenze e immunità. Può studiare un nuovo bersaglio ripetendo l’azione. L’effetto dura 1 round per livello.","tag":[],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Anti-incorporeo","livelli":[8],"tag":[],"comune":"","versioni":[{"v":"","liv":8,"testo":"La pelle del fruitore emana un campo di materialità di 3 m che respinge le creature incorporee. Questo mutageno è specificatamente pensato come difesa e termina se il fruitore si avvicina in modo aggressivo a una creatura incorporea per combatterla, spingerla o allontanarla. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Anti-magia","livelli":[12],"tag":[],"comune":"","versioni":[{"v":"","liv":12,"testo":"Il fruitore ottiene una RI pari a 11 + livello di alchimista. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Anti-melma","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il fruitore non può essere inglobato dalle melme. Inoltre, se una melma ferisce il fruitore, perde la propria capacità di dividersi per 1 ora. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Anti-non morti","livelli":[8],"tag":[],"comune":"","versioni":[{"v":"","liv":8,"testo":"Il fruitore emana un campo di energia positiva che danneggia i non morti. Ogni volta che un non morto danneggia il fruitore con un attacco in mischia subisce un ammontare di danni da energia positiva pari a metà del danno inflitto, dopo aver calcolato eventuali RD, RE e altre difese del fruitore. L’effetto dura 1 minuto per livello o dopo che il mutageno ha inferto 5 danni per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Anti-parassitario","livelli":[8],"tag":[],"comune":"","versioni":[{"v":"","liv":8,"testo":"La pelle del fruitore emana un aroma di 3 m che respinge i parassiti con un numero di Dadi Vita inferiore a un terzo del livello di alchimista. Se un parassita ha almeno un terzo dei Dadi Vita rispetto al livello di alchimista può vincere la repulsione superando un Tiro Salvezza su Volontà con CD 14 + bonus di Intelligenza. Anche così, avvicinarsi a meno di 3 m dal fruitore infligge al parassita 2d6 danni, il che è sufficiente a far desistere la maggior parte dei parassiti. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Antiepidemico","livelli":[4,6],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":4,"testo":"Il fruitore ottiene bonus +5 ai Tiri Salvezza contro effetti di [MALATTIA]. L’effetto dura 1 ora per livello.","tag":[],"durata":{"q":1,"u":"ore","per":1}},{"v":"2.0","liv":6,"testo":"Come la versione 1.0 ma diventa [concentrato].","tag":["concentrato"],"durata":{"q":1,"u":"ore","per":1}}],"esclusivo":null},{"nome":"Antitossina","livelli":[4,6],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":4,"testo":"Il fruitore ottiene bonus +5 ai Tiri Salvezza contro effetti di [VELENO]. L’effetto dura 1 ora per livello.","tag":[],"durata":{"q":1,"u":"ore","per":1}},{"v":"2.0","liv":6,"testo":"Come la versione 1.0 ma diventa [concentrato].","tag":["concentrato"],"durata":{"q":1,"u":"ore","per":1}}],"esclusivo":null},{"nome":"Assorbimento energetico","livelli":[6,8],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":6,"testo":"Il fruitore ottiene assieme al suo equipaggiamento immunità a un tipo di energia a scelta tra acido, elettricità, freddo, fuoco o suono. Questo mutageno assorbe 12 danni da energia per livello (massimo 120), dopodiché ha termine. Il tipo di energia va deciso alla creazione. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}},{"v":"2.0","liv":8,"testo":"Come la versione 1.0 ma diventa [concentrato], sebbene i danni assorbiti vengano dimezzati (6 per livello, anziché 12).","tag":["concentrato"],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Balistico","livelli":[4,6],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":4,"testo":"Il fruitore ottiene RD 10/magia contro le armi da tiro e da fuoco per un totale di 10 danni per livello (massimo 100). L’effetto dura 1 ora per livello.","tag":[],"durata":{"q":1,"u":"ore","per":1}},{"v":"2.0","liv":6,"testo":"Come la versione 1.0 ma diventa [concentrato].","tag":["concentrato"],"durata":{"q":1,"u":"ore","per":1}}],"esclusivo":null},{"nome":"Balzante","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore ottiene bonus di potenziamento +10 Acrobazia (saltare). Questo bonus diventa +20 al 5° livello e +30 al 9°. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Barbarico","livelli":[6],"tag":["concentrato"],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il fruitore ottiene bonus morale +2 ai tiri per colpire in mischia, +2 ai tiri per i danni in mischia e con armi da lancio, +2 Punti Ferita temporanei per Dado Vita, +2 ai Tiri Salvezza su Volontà e -2 alla CA. Al termine dell’effetto si è affaticati per 1 minuto. L’effetto dura 1 round per livello.","tag":["concentrato"],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Braccia possenti","livelli":[8],"tag":[],"comune":"","versioni":[{"v":"","liv":8,"testo":"Le braccia del fruitore si gonfiano di muscoli innaturali: ottiene +4 alle prove di Forza per spingere, spezzare oggetti e sfondare e +4 alla BMC per le manovre di lottare e spezzare. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Camuffante","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore può fare in modo che la propria persona (compresi i vestiti, le armi, l’armatura e l’equipaggiamento) appaiano diversi. Può apparire più alto o più basso di 30 cm, più magro o più grasso. Non può cambiare tipo di creatura (anche se può apparire come un diverso sottotipo). Il mutageno non conferisce i modi di fare o le caratteristiche della forma scelta, non altera le proprie capacità percettive tattili (tocco) o uditive (suono) o l’equipaggiamento. Se ci si inocula questo mutageno per camuffarsi, si ottiene bonus +10 alla prova di Camuffare. Le creature che interagiscono con il fruitore hanno diritto a un Tiro Salvezza su Volontà per riconoscere l’inganno. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Catatonico","livelli":[6],"tag":["settimanale"],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il fruitore entra in uno stato simile alla morte e le creature che vi interagiscono possono accorgersi che in realtà è vivo superando una prova di Professione (cerusico) con CD 20 o di Saggezza con CD 25. Fino al termine dell’effetto, il fruitore è considerato morto al fine di stabilire gli effetti che prendono come bersaglio o influenzano creature viventi, ma non è considerato un non morto. Il fruitore è indifeso e può comunque essere normalmente ucciso. L’effetto dura 6 ore.","tag":["settimanale"],"durata":{"q":6,"u":"ore","per":0}}],"esclusivo":null},{"nome":"Cercatore del buio","livelli":[6],"tag":[],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il fruitore ottiene Scurovisione 18 m. L’effetto dura 1 ora per livello.","tag":[],"durata":{"q":1,"u":"ore","per":1}}],"esclusivo":null},{"nome":"Chiaroudienza","livelli":[6],"tag":[],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il fruitore si concentra su un’area di 9 m quadrati a un massimo di 30 m di distanza e per tutta la durata del mutageno è in grado di udire i suoni e le conversazioni che vi avvengono. L’area può essere anche un luogo chiuso, come un edificio ma si dovrà superare ogni round una prova di Percezione con CD 15 per poter udire. Se ci sono più suoni o conversazioni, si può effettuare una prova di Percezione con CD 20 per focalizzarsi su uno specifico; la CD aumenta di 5 se si spia un luogo chiuso. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Chimerico","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il mutageno irrobustisce le braccia conferendo una velocità di Scalare di 3 m o irrobustisce le gambe conferendo una velocità di Nuotare di 3 m. Il mutageno non ha effetto se il fruitore indossa armature medie o pesanti. L'effetto dura 1 minuto per livello di alchimista.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Coagulante","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il mutageno fa sì che qualsiasi effetto di [SANGUINAMENTO] al quale il fruitore sia esposto sia soppresso per tutta la durata. Le emorragie non sono influenzate da questo mutageno. L'effetto dura 1 ora.","tag":[],"durata":{"q":1,"u":"ore","per":0}}],"esclusivo":null},{"nome":"Colossale","livelli":[1,10,16],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":1,"testo":"Il fruitore vede la propria taglia aumentare di una categoria (equipaggiamento compreso), ottenendo +2 Forza (taglia), -2 Destrezza, -1 CA, -1 tiri per colpire, -2 Furtività, +2 BMC, +2 DMC (taglia). Se la taglia finale è grande si ottiene anche portata 3 m. Non si possono cumulare più effetti che aumentano la taglia. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"2.0","liv":10,"testo":"Il fruitore vede la propria taglia aumentare di una categoria (equipaggiamento compreso), ottenendo +4 Forza (taglia), +4 Costituzione (taglia), -2 Destrezza, +2 alla CA Naturale, -1 CA, -1 tiri per colpire, -2 Furtività, +2 BMC, +2 DMC (taglia) e RD 5/allineamento. La RD è superata dall’allineamento opposto a quello dell’alchimista sull’asse Bene/Male (un alchimista buono ottiene RD 5/male, uno malvagio RD 5/bene); se l’alchimista è neutrale su tale asse, sceglie alla creazione. Se la taglia finale è grande si ottiene anche portata 3 m. Non si possono cumulare più effetti che aumentano la taglia. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"3.0","liv":16,"testo":"Il fruitore diventa una spaventosa versione più grande di sé stesso. La taglia aumenta di una categoria (equipaggiamento compreso), ottenendo +6 Forza (taglia), +4 Costituzione (taglia), -2 Destrezza, +6 alla CA Naturale, -1 CA, -1 tiri per colpire, -2 Furtività, +2 BMC, +2 DMC (taglia), RD 10/allineamento (determinata come per la versione 2.0) e RI pari a 10 + metà livello di alchimista. Se la taglia finale è grande si ottiene anche portata 3 m. Inoltre il fruitore emette un’aura che si diffonde fino a 9 m: le creature nemiche nell’area sono scosse e ogni volta che una creatura scossa da quest’aura colpisce il fruitore con un attacco in mischia diventa spaventata per 1d4 round (anche se al termine della durata non è più influenzata dall’aura). L’aura è un effetto di [PAURA] e di [INFLUENZA MENTALE]. Non si possono cumulare più effetti che aumentano la taglia. Questa versione è [giornaliero]. L’effetto dura 1 minuto per livello.","tag":["giornaliero"],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Confortevole","livelli":[1],"tag":["concentrato"],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore non subisce alcun danno dal fatto di trovarsi a una temperatura compresa tra -45° e 60° C. Il mutageno protegge anche l'equipaggiamento ma non fornisce alcuna protezione dai danni da fuoco o da freddo, né protegge da altri pericoli ambientali come fumo, mancanza d'aria e così via. L'effetto dura 24 ore.","tag":["concentrato"],"durata":{"q":24,"u":"ore","per":0}}],"esclusivo":null},{"nome":"Consapevole","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore diventa in grado di osservare meglio i dintorni e ricordare informazioni senza sforzo. Ottiene quindi bonus di competenza +2 Percezione e +2 Conoscenze in cui è addestrato. Se questo mutageno è attivo quando si deve effettuare una prova di Iniziativa, lo si può interrompere istantaneamente per ottenere bonus 1d3+1 a tale prova. L'effetto dura 1 ora.","tag":[],"durata":{"q":1,"u":"ore","per":0}}],"esclusivo":null},{"nome":"Coraggioso","livelli":[1],"tag":["concentrato"],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore ottiene bonus morale +5 ai Tiri Salvezza contro effetti di [PAURA]. Se il fruitore è già sotto l'influenza di un effetto di [PAURA], può tentare immediatamente un nuovo Tiro Salvezza con +5 per porvi termine. L'effetto dura 10 minuti.","tag":["concentrato"],"durata":{"q":10,"u":"min","per":0}}],"esclusivo":null},{"nome":"Corpo di legno","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore vede la propria pelle indurirsi ottenendo bonus di potenziamento +2 alla CA Naturale già esistente. L'effetto dura 10 minuti.","tag":[],"durata":{"q":10,"u":"min","per":0}}],"esclusivo":null},{"nome":"Curativo","livelli":[1,4,6,8,12],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":1,"testo":"Il fruitore si cura tramite l’energia positiva di 1d8 +1 danni per livello (massimo +5).","tag":[],"durata":null,"istantaneo":true},{"v":"2.0","liv":4,"testo":"Il fruitore si cura tramite l’energia positiva di 2d8 +1 danni per livello (massimo +10).","tag":[],"durata":null,"istantaneo":true},{"v":"3.0","liv":6,"testo":"Il fruitore si cura tramite l’energia positiva di 3d8 +1 danni per livello (massimo +15).","tag":[],"durata":null,"istantaneo":true},{"v":"4.0","liv":8,"testo":"Il fruitore si cura tramite l’energia positiva di 4d8 +1 danni per livello (massimo +20).","tag":[],"durata":null,"istantaneo":true},{"v":"5.0","liv":12,"testo":"Il fruitore si cura tramite l’energia positiva di 10 danni per livello (massimo 150). Questo mutageno è [giornaliero].","tag":["giornaliero"],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Curativo a tempo","livelli":[1,4,6],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":1,"testo":"Non appena il fruitore subisce 4 o più danni in un singolo round, il mutageno lo cura tramite l’energia positiva di 1d4 danni. Non si può consumare un mutageno Curativo a tempo se si è già sotto gli effetti di un altro. L’effetto dura 1 ora o finché il fruitore non viene curato.","tag":[],"durata":{"q":1,"u":"ore","per":0}},{"v":"2.0","liv":4,"testo":"Come la versione 1.0 ma il mutageno cura tramite l’energia positiva 1d8 +4 danni. L’effetto dura 4 ore o finché il fruitore non viene curato.","tag":[],"durata":{"q":4,"u":"ore","per":0}},{"v":"3.0","liv":6,"testo":"Come la versione 1.0 ma il mutageno cura tramite l’energia positiva 2d8 +6 danni. L’effetto dura 6 ore o finché il fruitore non viene curato.","tag":[],"durata":{"q":6,"u":"ore","per":0}}],"esclusivo":null},{"nome":"Degli eroi","livelli":[12],"tag":["concentrato","settimanale"],"comune":"","versioni":[{"v":"","liv":12,"testo":"Dopo l’inoculazione del mutageno, i fruitori necessitano di 1 ora di riposo assoluto, al termine del quale vengono curati da ogni effetto di [INFERMITÀ], [NAUSEA], [VELENO] e [MALATTIA]. Inoltre, ottengono bonus morale +1 ai tiri per colpire, +1 ai Tiri Salvezza su Volontà, bonus morale +4 ai Tiri Salvezza contro effetti di [VELENO] e [PAURA] e 1d8 +10 Punti Ferita temporanei per 12 ore. Se l’ora di quiete necessaria affinché il mutageno abbia effetto viene interrotta per qualsiasi motivo, il mutageno non ha effetto.","tag":["concentrato","settimanale"],"durata":{"q":12,"u":"ore","per":0}}],"esclusivo":null},{"nome":"Dei colpi guidati","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore ottiene una visione temporanea e intuitiva delle azioni dei propri avversari ottenendo un bonus cognitivo di +10 ai successivi due tiri per colpire in mischia. Inoltre, nessuno di questi due colpi è soggetto a probabilità di mancare. Gli effetti del mutageno terminano quando i due attacchi vengono effettuati o dopo tre round.","tag":[],"durata":{"q":3,"u":"round","per":0}}],"esclusivo":null},{"nome":"Del basilisco","livelli":[12],"tag":[],"comune":"","versioni":[{"v":"","liv":12,"testo":"Lo sguardo del fruitore si fa pietrificante. Una volta per round, come azione gratuita, il fruitore può fissare una creatura entro 9 m: questa deve superare un Tiro Salvezza su Tempra con CD 10 + metà livello di alchimista + bonus di Intelligenza o restare rallentata per 1 round; se fallisce il tiro di 5 o più è invece paralizzata per 1 round. Le creature immuni alla pietrificazione sono immuni a questo effetto. L’effetto dura 1 round per livello.","tag":[],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Del cacciatore di draghi","livelli":[14],"tag":[],"comune":"","versioni":[{"v":"","liv":14,"testo":"Il fruitore ottiene resistenza all’energia 15 a un tipo a scelta (deciso alla creazione), bonus +4 ai Tiri Salvezza contro le capacità dei draghi e bonus +2 ai tiri per colpire e ai danni contro le creature di taglia Grande o superiore. Inoltre, contro gli attacchi di soffio, il fruitore elude: se supera il Tiro Salvezza su Riflessi non subisce alcun danno, anziché la metà. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Del canto del gallo","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore emette un potente urlo che sveglia tutte le creature addormentate entro 9 m, anche se afflitte da sonno magico.","tag":[],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Del dottor Kramer","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il mutageno guarisce dagli effetti di [CECITÀ] o [SORDITÀ] a prescindere che l’effetto sia naturale o magico. Il mutageno non ripristina occhi od orecchie mancanti, ma li cura se sono stati danneggiati.","tag":[],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Del fascinoso","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore modella leggermente i propri tratti somatici per apparire più attraente e le sue prove di Raggirare e Diplomazia ottengono quindi un bonus di circostanza +4. Questo mutageno non cambia l’aspetto, sesso, razza e così via ed è quindi perfetto in congiunzione con il mutageno Camuffante o effetti simili. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Del furibondo","livelli":[6],"tag":[],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il fruitore entra in uno stato di trance che fornisce un numero di Punti Ferita temporanei pari a 3d6 + il livello (massimo +10) e bonus morale +4 ai Tiri Salvezza contro effetti di [INFLUENZA MENTALE: CHARME, COMPULSIONE, FINZIONE, TRAMA E MORALE]. I Punti Ferita temporanei scompaiono al termine del mutageno. Durante l’effetto, il fruitore subisce -3 alle prove di Concentrazione e non può combattere sulla difensiva o usare le azioni di ritirata e difesa totale. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Del golem","livelli":[14],"tag":[],"comune":"","versioni":[{"v":"","liv":14,"testo":"La pelle del fruitore diventa dura e inerte come quella di un golem: ottiene RD 10/adamantio e immunità a un tipo di energia a scelta tra acido, elettricità, freddo, fuoco o suono, deciso alla creazione. Di contro, l’organismo diventa così alterato da respingere ogni ulteriore sostanza alchemica: mentre è attivo, il fruitore è immune agli effetti di qualsiasi altro mutageno (compresi quelli curativi). L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Del mammuth","livelli":[8],"tag":[],"comune":"","versioni":[{"v":"","liv":8,"testo":"Il fruitore ottiene bonus di potenziamento +6 Forza. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Del predatore apex","livelli":[12],"tag":[],"comune":"","versioni":[{"v":"","liv":12,"testo":"Il fruitore diventa un predatore perfetto: ottiene bonus di potenziamento +6 Forza e +4 Destrezza, un passo di 1,5 m extra per round come azione gratuita e due attacchi naturali di Artiglio da 1d8 (taglia media) più il bonus di Forza. Se possiede già attacchi naturali dello stesso tipo, usa il valore migliore. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Del ragazzo topo","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il fruitore ottiene un bonus cognitivo pari a metà livello (massimo +10) alle prove di Percezione effettuate quando cerca attivamente trappole entro 3 m da sé. L’effetto dura 1 ora.","tag":[],"durata":{"q":1,"u":"ore","per":0}}],"esclusivo":null},{"nome":"Del ricognitore","livelli":[8],"tag":[],"comune":"","versioni":[{"v":"","liv":8,"testo":"I sensi del fruitore si acuiscono: ottiene Scurovisione 18 m, bonus di competenza +4 Percezione e non può essere colto alla sprovvista. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Del sangue di drago","livelli":[16],"tag":[],"comune":"","versioni":[{"v":"","liv":16,"testo":"Nelle vene del fruitore scorre potere draconico: ottiene resistenza all’energia 20 a un tipo a scelta (deciso alla creazione), immunità agli effetti di [PAURA] e la capacità di emettere una volta per round un attacco di soffio (a scelta cono di 9 m o linea di 18 m) che infligge 8d6 danni del tipo di energia scelto, con Tiro Salvezza su Riflessi che dimezza (CD 10 + metà livello di alchimista + bonus di Intelligenza). L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Del titano di ferro","livelli":[16],"tag":[],"comune":"","versioni":[{"v":"","liv":16,"testo":"La pelle del fruitore diventa metallo vivo: ottiene RD 15/adamantio, immunità ai colpi critici e ai danni da precisione e bonus di potenziamento +8 alla CA Naturale. Di contro, il peso lo rallenta: la velocità è dimezzata e subisce -4 Destrezza. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Del troll","livelli":[6],"tag":[],"comune":"","versioni":[{"v":"","liv":6,"testo":"Le braccia del fruitore diventano lunghe e potenti come quelle di un troll, fornendo bonus di potenziamento +4 Forza e aumentando la portata naturale del fruitore di 1,5 m. Inoltre, il fruitore ottiene due attacchi naturali di Artiglio che infliggono 1d6 danni (taglia media) più il bonus di Forza. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Dell’anatomista","livelli":[6],"tag":[],"comune":"","versioni":[{"v":"","liv":6,"testo":"Quando il fruitore mette a segno un colpo critico, tira due volte il dado per i danni dell'attacco (ma non i danni fissi extra o da precisione) e tiene il risultato migliore. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Dell’esploratore","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il fruitore ottiene bonus di potenziamento +3 m alla velocità su terreno, bonus di potenziamento +2 Destrezza e bonus di competenza +4 Furtività. L’effetto dura 10 minuti.","tag":[],"durata":{"q":10,"u":"min","per":0}}],"esclusivo":null},{"nome":"Dell’impulso","livelli":[6],"tag":["giornaliero"],"comune":"","versioni":[{"v":"","liv":6,"testo":"Dopo che l’ordine di Iniziativa è stato determinato, ma prima che il combattimento abbia inizio, se non è impreparato il fruitore può scaricare l’effetto del mutageno per aumentare il proprio punteggio di Iniziativa con un bonus cognitivo di +10. L’effetto dura 3 ore.","tag":["giornaliero"],"durata":{"q":3,"u":"ore","per":0}}],"esclusivo":null},{"nome":"Dell’infusione elementale","livelli":[12],"tag":["giornaliero"],"comune":"","versioni":[{"v":"","liv":12,"testo":"Questo mutageno cura il fruitore di 30 danni e lo rende immune agli effetti di [VELENO], [INVECCHIAMENTO], [CHARME], [COMPULSIONE], [SONNO] e [STORDIMENTO]. Inoltre, se l’alchimista che ha creato il mutageno è di 18° livello o superiore, il fruitore ottiene immunità ai colpi critici e ai danni da precisione e ottiene RD 10/magia e RE 20 a un tipo di energia a scelta tra acido, freddo o fuoco.","tag":["giornaliero"],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Dell’istrice","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Centinaia di aculei sottili e appuntiti escono istantaneamente dalla pelle del fruitore. Questi aculei fuoriescono dalle armature fatte in materiali naturali, ma non da quelle in metallo. Le creature che ingoiano o trattengono in lotta il fruitore subiscono 3d6 danni perforanti ad ogni proprio turno. L’effetto dura 1 round ogni 2 livelli.","tag":[],"durata":{"q":1,"u":"round","per":2}}],"esclusivo":null},{"nome":"Della carica devastante","livelli":[10],"tag":[],"comune":"","versioni":[{"v":"","liv":10,"testo":"Dopo che questo mutageno è stato inoculato, il successivo attacco in carica del fruitore è permeato da una furiosa esplosione di vigore. Come azione di round completo il fruitore può muoversi fino a quattro volte la propria velocità su terreno e può effettuare un attacco contro ogni nemico che attraversa con un bonus di circostanza +4. Se il fruitore è l’alchimista stesso, nel turno in cui si inocula il mutageno può effettuare l’attacco speciale come azione gratuita. Coloro che subiscono danni dal fruitore devono superare un Tiro Salvezza su Riflessi con CD 15 o finire proni. Il fruitore non provoca attacchi di opportunità mentre carica. L’effetto dura 1 round ogni 4 livelli.","tag":[],"durata":{"q":1,"u":"round","per":4}}],"esclusivo":null},{"nome":"Della corsa prodigiosa","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il fruitore ottiene bonus di potenziamento +6 m alla velocità su terreno, bonus di competenza +5 Acrobazia e bonus di schivare +2 alla CA contro gli attacchi di opportunità provocati passando attraverso le aree minacciate. L’effetto dura 1 round per livello.","tag":[],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Della creatura mostruosa","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Si può inoculare questo mutageno esclusivamente agli animali. Il fruitore ottiene bonus di potenziamento +4 Forza, +4 Costituzione e +2 alla CA Naturale già esistente. Tutte le armi naturali del fruitore migliorano come se possedesse il talento Attacco naturale migliorato (questo effetto si somma al talento vero e proprio, ma non ad altre fonti). Questo mutageno non fornisce alcun modo aggiuntivo per controllare il bersaglio e, in effetti, tende a renderlo più aggressivo, aumentando la CD di empatia animale di 5. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Della fata","livelli":[6],"tag":[],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il fruitore ottiene RD 5/ferro freddo e bene. Una volta che il mutageno ha prevenuto un totale di 5 danni per livello (massimo 50), si scarica. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Della speditezza","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore ottiene bonus di potenziamento +9 m alla velocità su terreno, fino a un massimo pari al doppio della velocità base su terreno. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Della vera vista","livelli":[10,14],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":10,"testo":"Il fruitore diventa in grado di vedere gli oggetti e le creature invisibili e può anche vedere entro 36 m attraverso il buio naturale e magico, nota le porte segrete celate dalla magia e le locazioni delle creature sotto l’effetto di incantesimi come Distorsione e Sfocatura. Inoltre, vede la vera forma degli esseri soggetti a metamorfosi o trasmutati. Il mutageno non aiuta a vedere attraverso agenti atmosferici o incantesimi e non aiuta a vedere attraverso camuffamenti normali, a individuare creature che sono semplicemente nascoste o a trovare porte segrete con mezzi normali. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"2.0","liv":14,"testo":"Come la versione 1.0 ma il mutageno diventa [concentrato].","tag":["concentrato"],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Della vista periferica","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Gli occhi del fruitore ottengono una visione più ampia. Di conseguenza, il fruitore non può essere fiancheggiato. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Dello scatto letale","livelli":[4,10],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":4,"testo":"Il fruitore si muove immediatamente di 9 m in linea retta ma senza provocare attacchi di opportunità. Inoltre, può effettuare un singolo attacco contro un nemico a cui è adiacente durante il movimento, ottenendo un bonus di circostanza al tiro per colpire pari al bonus di Intelligenza. Se il fruitore non è l’alchimista stesso, nel suo prossimo turno è barcollante.","tag":[],"durata":null,"istantaneo":true},{"v":"2.0","liv":10,"testo":"Come la versione 1.0 ma può effettuare un attacco contro ciascuna creatura a cui è adiacente durante il movimento (massimo 1 per creatura).","tag":[],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Dello smemorato","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore dimentica permanentemente uno specifico evento accaduto nell’ultima ora. Il fruitore può superare un Tiro Salvezza su Volontà con CD 10 + metà livello di alchimista + bonus di Intelligenza per negare l’effetto. Questo mutageno non contrasta altri incantesimi mentali.","tag":[],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Dermo-indurente","livelli":[4,10],"tag":[],"comune":"","versioni":[{"
