    const ognuno = M.dividi(inf.totRound, n);
    if (!al && n === 1) S.eff = S.eff.filter(e => e.nome !== nm);
    S.eff.push({ id: 'e' + Date.now().toString(36) + Math.floor(Math.random() * 1e5), nome: nm + (n > 1 ? ` (${n} fruitori)` : ''), fine: S.t + ognuno, unit: inf.unit });
    parti.push(`${esc(nm)}: ${esc(M.fmtDurata(ognuno, inf.unit))}${n > 1 ? ' a testa' : ''}`);
  };
  add(M.nomeFormula(it.k), info);
  let cura = '';
  if (info.cura) { const c = M.tiraCura(S, info.cura); cura = `<div class="tot">${c.totale} <span class="note">PF curati</span></div><div class="dadi">${c.dadi.length ? info.cura.n + 'd' + info.cura.d + ': ' + c.dadi.join(' + ') + ' + ' : ''}${info.cura.fisso}${c.rip ? ` · ripetuti i risultati ≤ ${c.rip}` : ''}</div>`; }
  if (it.kind === 'C') { const [, n2, v2] = it.opz.coc.split('|'); add(M.nomeFormula(it.opz.coc), M.mutagenoInfo(S, n2, v2)); }
  S.ultimo = `<div class="label">${esc(nomeItem(it))} inoculato${al ? ` (${al} su alleati${inibMax !== Infinity ? `: −${al} agenti inibitori` : ''})` : ''}</div>${cura}<div class="txt">${parti.join('<br>') || 'Effetto istantaneo.'}${info.freq ? `<br>Ricorda: ${esc(info.freq)} per ogni fruitore.` : ''}</div>`;
  usa(it, 1); save();
}
function applica(id) {
  const it = trova(id); if (!it) return;
  const v = M.veleno(it.k.split('|')[1]);
  S.eff.push({ id: 'e' + Date.now().toString(36), nome: 'Arma avvelenata: ' + nomeItem(it), fine: S.t + M.permanenzaVeleno(S) * 600, unit: 'ore', nota: `CD ${M.cdVeleno(S, v, it.opz.alt)} ${M.tsVeleno(v, it.opz.alt)}, fino al primo colpo` });
  S.ultimo = `<div class="label">${esc(nomeItem(it))} applicato</div><div class="txt">Resta sull’arma ${M.permanenzaVeleno(S)} ore o fino al primo colpo a segno. CD ${M.cdVeleno(S, v, it.opz.alt)} (${esc(M.tsVeleno(v, it.opz.alt))}).</div>`;
  usa(it, 1); save();
}

/* ================= MANUALE ================= */
function vManuale() {
  const f = UI.man, q = UI.cercaMan.toLowerCase();
  const voci = [];
  const add = (cat, nome, html, testo) => voci.push({ cat, nome, html, testo: (nome + ' ' + testo).toLowerCase() });
  for (const p of D.privilegi) add('privilegi', p.nome, paras(p.testo), p.testo.join(' '));
  for (const [k, sez] of Object.entries(D.regole)) for (const r of (Array.isArray(sez) ? sez : [])) if (r.nome) add('regole', `${r.nome} (${k})`, paras(r.testo), r.testo.join(' '));
  for (const b of D.bombe) add('bombe', 'Bomba ' + b.nome.toLowerCase() + (b.esclusiva ? ' (' + b.esclusiva + ')' : ''), `<p class="note">${esc(b.ingr)}</p>${paras(b.testo)}`, b.testo.join(' '));
  for (const m of D.mutageni) add('mutageni', m.nome + (m.esclusivo ? ' (' + m.esclusivo + ')' : ''), `<p class="note">Livello ${m.livelli.join(', ')}${m.tag.length ? ' · ' + esc(m.tag.join(', ')) : ''}</p>${m.comune ? `<p>${fmt(m.comune)}</p>` : ''}${m.versioni.map(v => `<p>${v.v ? `<b>${v.v}:</b> ` : ''}${fmt(v.testo)}</p>`).join('')}`, m.versioni.map(v => v.testo).join(' '));
  for (const v of D.veleni) add('veleni', v.nome, `<p class="note">Liv. ${v.liv} · potenza ${v.pot} · tossicità ${segno(v.tox)} · ${esc(v.ts)}</p><p><i>${fmt(v.flavor)}</i></p><p>${fmt(v.effetto)}</p>`, v.effetto);
  for (const d of D.doti) add('doti', d.nome + (d.esclusiva ? ' (' + d.esclusiva + ')' : ''), `<p>${catTag(d.cat)} ${d.mod != null ? `<span class="tag">modifica +${d.mod}</span>` : ''}${d.pot != null ? `<span class="tag">potenziamento +${d.pot}</span>` : ''}</p>${d.req ? `<p><b>Requisiti:</b> ${fmt(d.req.testo)}</p>` : ''}${paras(d.testo)}${d.speciale.map(s => `<p><b>Speciale:</b> ${fmt(s)}</p>`).join('')}`, d.testo.filter(x => typeof x === 'string').join(' '));
  for (const a of D.archetipi) add('archetipi', a.nome, `<p class="note">${fmt(a.flavor)}</p>${a.voci.map(v => `<h3>${esc(v.nome)}</h3>${paras(v.testo)}${v.dicitura ? `<p class="note"><i>${esc(v.dicitura)}</i></p>` : ''}`).join('')}`, a.voci.map(v => v.testo.filter(x => typeof x === 'string').join(' ')).join(' '));
  let lista = voci.filter(v => (f === 'tutto' || v.cat === f) && (!q || v.testo.includes(q)));
  const tot = lista.length;
  if (!q && f === 'tutto') lista = lista.slice(0, 40);
  const cats = [['tutto', 'Tutto'], ['privilegi', 'Privilegi'], ['regole', 'Regole'], ['bombe', 'Bombe'], ['mutageni', 'Mutageni'], ['veleni', 'Veleni'], ['doti', 'Doti'], ['archetipi', 'Archetipi']];
  return `<div class="card stack"><h2>Manuale dell’alchimista</h2><p class="note">Testi da ${esc(D.fonte)}.</p>
    <input class="search" id="q-man" data-f="cercaMan" placeholder="Cerca nel manuale" value="${esc(UI.cercaMan)}">
    <div class="chips">${cats.map(([k, n]) => `<button class="chip" type="button" data-a="man" data-v="${k}" aria-pressed="${f === k}">${n}</button>`).join('')}</div>
    <div class="note">${tot} voci${lista.length < tot ? ', le prime ' + lista.length + ': scegli una categoria o cerca' : ''}</div>
    <div>${lista.map(v => `<details><summary><span>${esc(v.nome)}</span></summary><div class="txt">${v.html}</div></details>`).join('')}</div></div>`;
}

/* ================= render ed eventi ================= */
let inRender = false, pendente = false;
function render() {
  if (inRender) { pendente = true; return; }
  inRender = true;
  try { renderOra(); } finally { inRender = false; }
  if (pendente) { pendente = false; render(); }
}
function renderOra() {
  header();
  const m = document.getElementById('main');
  const views = { scheda: vScheda, alba: vAlba, borsa: vBorsa, manuale: vManuale };
  m.innerHTML = `<section class="panel">${(views[G.tab] || vScheda)()}</section>`;
  document.getElementById('ov').innerHTML = UI.ov === 'doti' ? `<div class="overlay" data-a="chiudiFuori">${overlayDoti()}</div>` : '';
}
function rifocus(id, fn) { fn(); const el = document.getElementById(id); if (el) { el.focus(); const v = el.value; try { el.setSelectionRange(v.length, v.length); } catch (e) {} } }
document.addEventListener('click', ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { G.tab = tab.dataset.tab; save(); render(); window.scrollTo(0, 0); return; }
  const b = ev.target.closest('[data-a]');
  if (!b || !b.dataset.a) return;
  const a = b.dataset.a, v = b.dataset.v, k = b.dataset.k, id = b.dataset.id;
  if (a === 'chiudiFuori' && ev.target !== b) return;
  switch (a) {
    case 'pgNuovo': { const s = nuovoPg(); G.pg[s.id] = s; G.attivo = s.id; S = s; G.tab = 'scheda'; UI.prep = UI.rapida = null; break; }
    case 'campo': S.campo = v; break;
    case 'opz': S.opz[k] = v; break;
    case 'apriDoti': UI.ov = 'doti'; break;
    case 'chiudi': case 'chiudiFuori': UI.ov = null; break;
    case 'filtroDoti': UI.filtroDoti = v; break;
    case 'soloDisp': UI.soloDisp = !UI.soloDisp; break;
    case 'aggDote': S.doti.push(v); toast('Aggiunta: ' + v); break;
    case 'togliDote': S.doti.splice(+b.dataset.i, 1); break;
    case 'formula': { const i = S.formule.indexOf(k); if (i >= 0) S.formule.splice(i, 1); else S.formule.push(k); break; }
    case 'diluita': { const l = S.opz.diluite = S.opz.diluite || []; const i = l.indexOf(v); if (i >= 0) l.splice(i, 1); else { l.push(v); while (l.length > M.diluiteMax(S)) l.shift(); } break; }
    case 'economico': { const l = S.opz.economici = S.opz.economici || []; const i = l.indexOf(k); if (i >= 0) l.splice(i, 1); else { l.push(k); while (l.length > 2) l.shift(); } break; }
    case 'espanso': { const l = S.opz.espanso = S.opz.espanso || []; l[+b.dataset.i] = +v; break; }
    case 'alba': UI.conferma = 'alba'; break;
    case 'annulla': UI.conferma = null; break;
    case 'albaOk': UI.conferma = null; alba(); break;
    case 'chiudiBase': S.giorno.base = false; break;
    case 'prepTipo': UI.prep.tipo = v; UI.prep.k = ''; UI.prep.mods = []; UI.prep.pot = []; UI.prep.coc = ''; UI.prep.alt = false; break;
    case 'prepMod': { const l = UI.prep.mods; const i = l.indexOf(v); if (i >= 0) l.splice(i, 1); else l.push(v); break; }
    case 'prepPot': { const l = UI.prep.pot; const i = l.indexOf(v); if (i >= 0) l.splice(i, 1); else l.push(v); break; }
    case 'prepAlt': UI.prep.alt = !UI.prep.alt; break;
    case 'prepN': UI.prep.n += +v; break;
    case 'prepara': prepara(); break;
    case 'avanza': avanza(+v); break;
    case 'reag': if (S.giorno) S.giorno.reag = Math.max(0, S.giorno.reag + +v); break;
    case 'cnt': S.cnt[k] = Math.max(0, (S.cnt[k] || 0) + +v); break;
    case 'rapida': {
      if (!S.giorno || S.giorno.reag < 1) { toast('Nessun reagente nella borsa.'); break; }
      const rk = UI.rapida.k; const p = rk.split('|');
      const it = p[0] === 'B' ? { kind: 'B', k: rk, opz: { liv: +p[2], mods: [] } } : p[0] === 'M' ? { kind: 'M', k: rk, opz: {} } : { kind: 'V', k: rk, opz: { pot: [], alt: false } };
      it.qta = 1; it.fonte = 'rapida'; it.scade = S.t + 10; aggiungiInv(it); S.giorno.reag -= 1; toast('Creato: ' + nomeItem(it)); break;
    }
    case 'chiudiEsito': S.ultimo = null; break;
    case 'finisci': S.eff = S.eff.filter(e => e.id !== id); break;
    case 'lancia': lancia(id); break;
    case 'gas': UI.gas[id] = !UI.gas[id]; break;
    case 'inoc': { const I = UI.inocula[id] = UI.inocula[id] || { n: 1, alleati: 0 }; I[k] = (I[k] || 0) + +v; break; }
    case 'inocula': inocula(id); break;
    case 'applica': applica(id); break;
    case 'scarta': S.inv = S.inv.filter(x => x.id !== id); break;
    case 'decat': {
      const i1 = document.getElementById('dc-1').value, i2 = document.getElementById('dc-2').value;
      const a1 = trova(i1), a2 = trova(i2);
      if (!a1 || !a2 || (i1 === i2 && a1.qta < 2)) { toast('Scegli due oggetti.'); break; }
      usa(a1, 1); if (i1 === i2) usa(a1, 1); else usa(a2, 1);
      S.giorno.reag += 1; S.cnt.decatalizzante = 1; toast('+1 reagente infuso.'); break;
    }
    case 'man': UI.man = v; break;
    default: return;
  }
  save(); render();
});
document.addEventListener('input', ev => {
  const f = ev.target.dataset && ev.target.dataset.f; if (!f) return;
  const val = ev.target.value;
  if (f === 'nome') { S.nome = val; save(); header(); return; }
  if (f === 'cercaDoti' || f === 'cercaMut' || f === 'cercaMan') { UI[f] = val; rifocus(ev.target.id, render); return; }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'pgSel') { G.attivo = el.value; S = G.pg[G.attivo]; UI.prep = UI.rapida = null; save(); render(); return; }
  const f = el.dataset && el.dataset.f; if (!f) return;
  const val = el.value;
  if (f === 'liv') S.liv = +val;
  else if (f === 'int') S.int = Math.max(-5, Math.min(15, parseInt(val, 10) || 0));
  else if (f === 'arch') { S.arch = val; const ad = M.archDati(S); if (ad && ad.campo) S.campo = ad.campo; }
  else if (f === 'nuovoConc' || f === 'vperfetto') S.opz[f] = val;
  else if (f === 'prep.k') { UI.prep.k = UI.prep.tipo === 'B' ? val : val; UI.prep.liv = 0; UI.prep.mods = []; UI.prep.coc = ''; }
  else if (f === 'prep.liv') UI.prep.liv = +val;
  else if (f === 'prep.coc') UI.prep.coc = val;
  else if (f === 'rapida.k') UI.rapida.k = val;
  else if (f === 'bersaglio') UI.bersaglio[el.dataset.id] = val;
  else if (f === 'misc') {
    const a1 = trova(el.dataset.id), a2 = trova(val);
    if (a1 && a2) {
      const v1 = M.veleno(a1.k.split('|')[1]), v2 = M.veleno(a2.k.split('|')[1]);
      const forte = v1.tox >= v2.tox ? a1 : a2;
      usa(a1, 1); usa(a2, 1);
      aggiungiInv({ kind: 'V', k: forte.k, opz: { pot: [], alt: false, misto: [v1.nome, v2.nome] }, qta: 1, fonte: 'base', scade: null });
      toast(`Miscela: 1 dose con tossicità ${segno(Math.max(v1.tox, v2.tox))}.`);
    }
  }
  else if (f === 'nome') return;
  save(); render();
});
render();
</script>
