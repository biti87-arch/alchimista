v":"1.0","liv":4,"testo":"Il fruitore ottiene RD 5/magia. Quando ha prevenuto un totale di 5 danni per livello (massimo 50), il mutageno termina. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"2.0","liv":10,"testo":"Il fruitore acquisisce RD 10/adamantio. Una volta che il mutageno ha impedito un totale di 10 danni per livello, si esaurisce. Questa versione è [giornaliero]. L’effetto dura 10 minuti per livello.","tag":["giornaliero"],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Di Victor Saltzpyre","livelli":[10],"tag":[],"comune":"","versioni":[{"v":"","liv":10,"testo":"Il fruitore ottiene immunità agli effetti di [RISUCCHIO DI ENERGIA] e [RISUCCHIO DI SANGUE] e non può essere trasformato in progenie (solitamente non morta) se viene ucciso mentre si trova sotto gli effetti del mutageno. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Dissolvente","livelli":[10],"tag":[],"comune":"","versioni":[{"v":"","liv":10,"testo":"Il mutageno ha sul fruitore gli effetti dell’incantesimo Dissolvi magie ma questi può scegliere quali effetti dissolvere, escludendone altri a piacere (di cui è a conoscenza). Occorre effettuare per ciascun effetto una normale prova di dissolvere (1d20 + il livello di alchimista).","tag":[],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Elementale","livelli":[16],"tag":[],"comune":"","versioni":[{"v":"","liv":16,"testo":"Il corpo del fruitore si tramuta in un elemento a scelta tra fuoco, freddo, elettricità o acido, deciso alla creazione. Il fruitore ottiene immunità a quel tipo di energia e i suoi attacchi naturali infliggono 1d6 danni aggiuntivi di quel tipo. Inoltre, ogni creatura che lo colpisce con un attacco in mischia senza portata subisce 3d6 danni dello stesso tipo di energia. Il mutageno non ha effetto se il fruitore indossa un’armatura pesante. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Energizzante","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore ottiene bonus alchemico +1 ai Tiri Salvezza. L’effetto dura 30 minuti.","tag":[],"durata":{"q":30,"u":"min","per":0}}],"esclusivo":null},{"nome":"Entropico","livelli":[6],"tag":[],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il fruitore ottiene RD 5/perforante e +4 DMC. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Evanescente","livelli":[4,6],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":4,"testo":"La sagoma del fruitore diventa sfocata garantendogli occultamento (20%). L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"2.0","liv":6,"testo":"La sagoma del fruitore diventa sfocata garantendogli occultamento 45%. L’effetto dura 1 round per livello.","tag":[],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Fasico","livelli":[10],"tag":[],"comune":"","versioni":[{"v":"","liv":10,"testo":"Il corpo del fruitore vibra tra il piano materiale e quello etereo. Una volta per round, come azione immediata, il fruitore può diventare incorporeo per ignorare completamente un singolo attacco o incantesimo che lo prende come bersaglio. Non appena l’attacco o l’incantesimo è stato evitato e il fruitore torna materiale, il mutageno si esaurisce. Mentre è incorporeo il fruitore non può a sua volta attaccare. L’effetto dura fino a 1 round per livello, o finché non viene scaricato come sopra.","tag":[],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Fenice","livelli":[16],"tag":["mensile"],"comune":"","versioni":[{"v":"","liv":16,"testo":"La prima volta che il fruitore morirebbe mentre questo mutageno è attivo, viene invece avvolto in una vampata di fuoco rigenerante: torna immediatamente a metà del proprio totale di Punti Ferita e Punti Fatica e ogni creatura entro 3 m subisce 1d6 danni da fuoco ogni 2 Dadi Vita del fruitore. Dopodiché il mutageno si esaurisce. Una creatura non può beneficiare di un mutageno Fenice più di una volta al mese. L’effetto dura 1 minuto per livello.","tag":["mensile"],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Ferino","livelli":[4,10],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":4,"testo":"Il mutageno conferisce al fruitore bonus di potenziamento +4 ad una caratteristica fisica. La caratteristica va decisa alla creazione. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"2.0","liv":10,"testo":"Come la versione 1.0 ma diventa [concentrato].","tag":["concentrato"],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Fermezza dell’indomito","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il fruitore ignora gli effetti dei danni e delle penalità a un singolo punteggio di caratteristica a scelta dell’alchimista. Un danno pari o superiore al punteggio stesso di caratteristica causa comunque la perdita di sensi, paralisi o morte, come di consueto. Il mutageno protegge indipendentemente dal fatto che il danno o le penalità siano stati acquisiti prima o durante il mutageno. Il mutageno non protegge dal risucchio di caratteristica. L’effetto dura fino a 1 round per livello.","tag":[],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Flessibile","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"La carne del fruitore diviene flessibile e gommosa conferendo bonus di schivare +1 alla CA, bonus di competenza +4 Artista della Fuga, +4 alla BMC per sfuggire alla lotta e bonus di circostanza +4 alla DMC contro le manovre di lottare. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Fortificante","livelli":[4,8],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":4,"testo":"Il fruitore ottiene una probabilità del 25% di ignorare i colpi critici e i danni da precisione. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"2.0","liv":8,"testo":"Come la versione 1.0 ma la probabilità di ignorare diventa del 50%. La probabilità diventa del 75% al 12° livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Fulmicotone","livelli":[8],"tag":["concentrato"],"comune":"","versioni":[{"v":"","liv":8,"testo":"Il fruitore ottiene bonus di potenziamento +9 m alla velocità su terreno, fino a un massimo pari al doppio della velocità base su terreno. Inoltre, quando compie un attacco completo, può effettuare un attacco aggiuntivo usando il bonus di attacco base pieno. Inoltre, ottiene bonus +1 ai tiri per colpire e bonus di schivare +1 alla CA e +1 ai Tiri Salvezza su Riflessi. L’effetto dura 1 round per livello.","tag":["concentrato"],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Galleggiante","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il fruitore deve essere di taglia media o inferiore. Il fruitore galleggia su qualsiasi massa d'acqua, mantenendo costantemente il 50% del proprio corpo fuori dall’acqua e il restante 50% al suo interno. Una creatura sotto gli effetti di questo mutageno che tenti volontariamente di immergersi deve superare ogni round una prova di Nuotare con CD 20 per non riemergere. Se il fruitore trascorre 1 round fuori dall’acqua, il mutageno termina. Se il fruitore è collegato a un oggetto o a una creatura immersi nell’acqua (tramite una fune, ad esempio), se tenterà di issarli fuori dall’acqua otterrà invece l’effetto di immergersi egli stesso, come se fosse dieci volte più leggero della cosa a cui è legato. L’effetto dura fino a 1 round per livello.","tag":[],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Impenetrabile","livelli":[8],"tag":[],"comune":"","versioni":[{"v":"","liv":8,"testo":"Il fruitore ottiene immunità agli effetti nocivi di odori, gas e ai vapori nocivi, effetti di [VELENO] e [MALATTIA] e gli incantesimi Nube maleodorante e Nube mortale. Il mutageno diventa [concentrato]. L’effetto dura 2 ore per livello.","tag":["concentrato"],"durata":{"q":2,"u":"ore","per":1}}],"esclusivo":null},{"nome":"Indagatore","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il fruitore diventa in grado di vedere gli oggetti e le creature invisibili. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Insonne","livelli":[1],"tag":["settimanale"],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore diventa in grado di restare sveglio pur ottenendo i normali benefici di una notte di completo riposo, anche se è comunque suscettibile ad effetti di [SONNO], come gli incantesimi Sonno o Sonno profondo. Qualsiasi attività vigorosa, incluso il combattimento, pone termine all’effetto del mutageno e il fruitore dovrà dormire 8 ore per ottenere i benefici di una completa notte di riposo. L’effetto dura 8 ore.","tag":["settimanale"],"durata":{"q":8,"u":"ore","per":0}}],"esclusivo":null},{"nome":"Isolante","livelli":[6,8],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":6,"testo":"Il fruitore e il suo equipaggiamento ottengono RE 5 contro acido, elettricità, freddo, fuoco e suono. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}},{"v":"2.0","liv":8,"testo":"Come la versione 1.0 ma la RE diventa 10 e il mutageno diventa [concentrato], suddividendo equamente la durata tra i vari fruitori.","tag":["concentrato"],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Juggernaut","livelli":[12],"tag":["giornaliero"],"comune":"","versioni":[{"v":"","liv":12,"testo":"Il fruitore ottiene bonus di potenziamento +4 Forza, +4 Destrezza e +4 Costituzione, +4 alla CA Naturale, bonus di competenza +5 ai Tiri Salvezza su Tempra e competenza in tutte le armi semplici e da guerra. Il bonus di attacco base del fruitore diventa pari al livello di personaggio (e quindi può effettuare attacchi multipli). Di contro, il fruitore perde la capacità di lanciare incantesimi e usare oggetti magici ad attivazione o a completamento di incantesimo. L’effetto dura 1 round per livello.","tag":["giornaliero"],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Lenitivo","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore ottiene bonus alchemico +5 ai Tiri Salvezza contro effetti di [ABBAGLIAMENTO], [CECITÀ], [AFFATICAMENTO], [SORDITÀ], [INFERMITÀ] e [NAUSEA]. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Libera mente","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il fruitore ottiene bonus morale +3 ai Tiri Salvezza contro effetti di [INFLUENZA MENTALE: CHARME, COMPULSIONE, FINZIONE, TRAMA E MORALE]. Se il fruitore è già sotto l’influenza di uno di questi effetti, può tentare immediatamente un nuovo Tiro Salvezza con +3 per porvi termine. L’effetto dura 10 minuti.","tag":[],"durata":{"q":10,"u":"min","per":0}}],"esclusivo":null},{"nome":"Liberatore","livelli":[4],"tag":["concentrato"],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il fruitore viene liberato dagli effetti di un singolo effetto di [PARALISI] o [BARCOLLAMENTO].","tag":["concentrato"],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Metamorfico","livelli":[14],"tag":[],"comune":"","versioni":[{"v":"","liv":14,"testo":"Il fruitore ottiene un bonus di potenziamento +6 a una singola caratteristica fisica a scelta. Una volta per round, come azione veloce, può trasferire questo bonus a un’altra caratteristica fisica (es. da +6 Forza a +6 Destrezza), adattando il proprio corpo alla necessità del momento. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Mente fulminea","livelli":[10],"tag":[],"comune":"","versioni":[{"v":"","liv":10,"testo":"Il fruitore pensa a velocità innaturale: ottiene un’azione veloce aggiuntiva per round, bonus cognitivo +10 all’Iniziativa e può ripetere una prova di abilità fallita una volta per round. L’effetto dura 1 round per livello.","tag":[],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Mimetico","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore è in grado di cambiare la propria colorazione e quella del proprio equipaggiamento per accordarsi all'ambiente circostante. Questo gli concede bonus di circostanza +4 Furtività e gli permette di effettuare tali prove senza copertura od occultamento, ma solo mentre si muove della metà della propria velocità o meno. Se si muove a più della metà della propria velocità durante il suo turno, non ottiene alcun beneficio da questo mutageno fino all'inizio del suo turno successivo. Se il fruitore effettua un attacco, il mutageno ha termine. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Miniaturizzante","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore vede la propria taglia diminuire di una categoria (equipaggiamento compreso), ottenendo -2 Forza, +2 Destrezza (taglia), +1 CA (taglia), +1 tiri per colpire (taglia), +2 Furtività, -2 BMC, -2 DMC. Ogni oggetto rimpicciolito di cui si perde il possesso (comprese le armi da lancio e i proiettili) ritorna istantaneamente alla taglia normale. Non si possono cumulare più effetti che riducono la taglia. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Nutriente","livelli":[6],"tag":["concentrato","settimanale"],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il fruitore non necessita di mangiare e bere. L’effetto dura 3 giorni.","tag":["concentrato","settimanale"],"durata":{"q":3,"u":"giorni","per":0}}],"esclusivo":null},{"nome":"Passo sicuro","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Il fruitore ignora le penalità al movimento dovute ai terreni difficili, eccetto quelli manipolati magicamente. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Predatorio","livelli":[8],"tag":[],"comune":"","versioni":[{"v":"","liv":8,"testo":"Il corpo del fruitore assume tratti bestiali: ottiene un morso (1d6, taglia media) e due attacchi naturali di Artiglio (1d4, taglia media) più il bonus di Forza, bonus di potenziamento +2 Forza e Scurovisione 9 m. Se il fruitore possiede già attacchi naturali dello stesso tipo, usa il valore migliore. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Presciente","livelli":[10],"tag":[],"comune":"","versioni":[{"v":"","liv":10,"testo":"Il fruitore percepisce le intenzioni altrui un istante prima che si concretizzino: ottiene bonus cognitivo +4 alla CA e ai Tiri Salvezza su Riflessi, non può essere colto alla sprovvista né fiancheggiato e conserva il bonus di Destrezza alla CA anche contro attacchi di creature invisibili. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Protettivo","livelli":[1,4],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":1,"testo":"Alla creazione del mutageno si deve scegliere tra bene, male, caos, legge. Il fruitore ottiene benefici contro le creature e gli effetti con l’allineamento scelto, e nello specifico: bonus di deviazione +2 alla CA e bonus di resistenza +2 ai Tiri Salvezza contro gli attacchi compiuti dalle creature. In aggiunta, il fruitore riceve immediatamente un altro Tiro Salvezza (se ne è concesso uno all'inizio) contro qualsiasi incantesimo o effetto in grado di possedere o di esercitare un controllo mentale. Questo Tiro Salvezza viene effettuato con bonus morale +2, usando la stessa CD dell'effetto originale. Se il tiro ha successo, questi effetti vengono soppressi per la durata del mutageno. Mentre si trova sotto l'effetto di questo mutageno, il fruitore ottiene immunità a qualunque nuovo tentativo di comandarlo mentalmente o di possederlo. Questo mutageno non espelle una forza che controlla (come un fantasma o un incantatore che usi Possessione*), ma gli impedisce di controllare il fruitore. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"2.0","liv":4,"testo":"Come la versione 1.0 ma diventa [concentrato] e ha una durata di 10 minuti.","tag":["concentrato"],"durata":{"q":10,"u":"min","per":0}}],"esclusivo":null},{"nome":"Protezione corporea","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il fruitore ottiene bonus +5 ai Tiri Salvezza contro effetti di [CECITÀ], [SORDITÀ], [INFERMITÀ] e [NAUSEA]. Se il fruitore è già sotto l’influenza di uno o più di questi effetti, può ripetere immediatamente il Tiro Salvezza con +5 per porvi termine. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Purezza cristallina","livelli":[16],"tag":[],"comune":"","versioni":[{"v":"","liv":16,"testo":"Il corpo del fruitore si tramuta in cristallo vivente: ottiene immunità ai veleni, alle malattie, agli effetti di influenza mentale (charme, compulsione, finzione, trama e morale) e al risucchio di caratteristica ed energia. Di contro, la superficie cristallina riflette la luce in modo vistoso e il fruitore non può muoversi furtivamente. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Purificante","livelli":[6],"tag":[],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il mutageno cura un singolo effetto di [MALATTIA] o [VELENO] che affligge il fruitore e uccide anche gli elementi parassitari, compresi la fanghiglia verde e altri simili. Il mutageno non cura eventuali danni che la malattia o il veleno abbiano già causato.","tag":[],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Riciclante","livelli":[12],"tag":["concentrato","giornaliero"],"comune":"","versioni":[{"v":"","liv":12,"testo":"Il fruitore si cura tramite l’energia positiva di 3d8 danni +1 per livello.","tag":["concentrato","giornaliero"],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Riflettente","livelli":[10],"tag":[],"comune":"","versioni":[{"v":"","liv":10,"testo":"La pelle del fruitore diventa madreperlacea e speculare. La prima volta ogni round che il fruitore è bersaglio di un incantesimo che richiede un tiro per colpire a distanza (raggio, dardo o attacco di contatto a distanza) e questo lo manca oppure lui ne supera il Tiro Salvezza, l’incantesimo viene riflesso sul lanciatore (che può evitarlo con una prova di livello dell’incantatore contrapposta). L’effetto dura 1 round per livello.","tag":[],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Rigenerante","livelli":[10,14],"tag":["giornaliero"],"comune":"","versioni":[{"v":"1.0","liv":10,"testo":"Il fruitore si cura tramite l’energia positiva di 5d8 +1 danni per livello (massimo +25). Inoltre, se questo mutageno viene inoculato entro 1 round da quando il fruitore ha subito una Ferita grave, guarisce istantaneamente tutte le Ferite gravi e le emorragie che lo affliggono a prescindere dalla loro entità (gravità 1, 2, 3, emorragia lieve o grave), comprese le menomazioni permanenti da esse derivate (amputazioni, arti inutilizzabili, organi compromessi, penalità permanenti). L’effetto è istantaneo. Una creatura può beneficiare di un solo mutageno Rigenerante (di qualsiasi versione) al giorno.","tag":["giornaliero"],"durata":null,"istantaneo":true},{"v":"2.0","liv":14,"testo":"Come la versione 1.0 ma il fruitore si cura di 7d8 +1 danni per livello (massimo +35) e la finestra utile per annullare le Ferite gravi e le relative menomazioni permanenti sale a 3 round dall’evento.","tag":["giornaliero"],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Rinvigorente","livelli":[1,6],"tag":["concentrato"],"comune":"","versioni":[{"v":"1.0","liv":1,"testo":"Questo mutageno può essere inoculato a un massimo di 3 creature. Dopo 3 round dall’inoculazione, il mutageno rimuove 1 danno temporaneo a una singola caratteristica di ciascun fruitore.","tag":["concentrato"],"durata":null,"istantaneo":true},{"v":"2.0","liv":6,"testo":"Come la versione 1.0 ma il mutageno rimuove 2 danni temporanei a una singola caratteristica o 1 danno temporaneo a due diverse caratteristiche di ciascun fruitore.","tag":["concentrato"],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Ristoratore","livelli":[4,8],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":4,"testo":"Il mutageno dissolve qualunque effetto magico riduca uno dei punteggi di caratteristica del fruitore oppure cura 1d4 danni temporanei a uno dei punteggi di caratteristica del fruitore. Inoltre, pone fine alla condizione affaticato o fa passare dalla condizione esausto ad affaticato. Non può ripristinare un risucchio di caratteristica permanente.","tag":[],"durata":null,"istantaneo":true},{"v":"2.0","liv":8,"testo":"Il mutageno dissolve qualunque effetto magico riduca un punteggio di caratteristica del fruitore, cura tutti i danni temporanei alle caratteristiche e restituisce tutti i punti risucchiati permanentemente da un singolo punteggio di caratteristica a scelta. Inoltre, pone fine alla condizione esausto o affaticato e dissolve anche i livelli negativi temporanei. Il mutageno dissolve anche un livello negativo permanente ma massimo 1 a settimana.","tag":[],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Salutare","livelli":[1,8],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":1,"testo":"Il fruitore ottiene un numero di Punti Ferita temporanei pari a 1d10 +1 per livello (massimo +10). Questi punti scompaiono dopo 1 ora per livello.","tag":[],"durata":{"q":1,"u":"ore","per":1}},{"v":"2.0","liv":8,"testo":"Come la versione 1.0 ma i Punti Ferita temporanei sono pari a 2d10 +1 per livello (massimo +20).","tag":[],"durata":{"q":1,"u":"ore","per":1}}],"esclusivo":null},{"nome":"Salvavita","livelli":[8],"tag":[],"comune":"","versioni":[{"v":"","liv":8,"testo":"Il fruitore ottiene bonus morale +4 ai Tiri Salvezza contro tutti gli incantesimi e gli effetti magici di [morte] e può effettuare un Tiro Salvezza anche se non sarebbe normalmente previsto. Il fruitore ottiene immunità al risucchio di energia e all’energia negativa. Questo mutageno non rimuove eventuali livelli negativi che il fruitore abbia già acquisito, ma rimuove le penalità derivate da essi per tutta la durata del suo effetto. Il mutageno non offre protezione contro altri tipi di attacchi, nemmeno se questi dovessero rivelarsi letali. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Scudo energetico","livelli":[4,6],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":4,"testo":"Il fruitore ottiene assieme al suo equipaggiamento una protezione limitata da un tipo di energia a scelta tra acido, elettricità, freddo, fuoco o suono. Il tipo di energia va deciso alla creazione. Il fruitore ottiene RE 10 contro il tipo di energia scelto. Questa RE diventa 20 all’8° livello e 30 al 12° livello. Questo mutageno assorbe solo i danni e il soggetto potrebbe comunque subire sfortunati effetti collaterali nocivi. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}},{"v":"2.0","liv":6,"testo":"Come la versione 1.0 ma diventa [concentrato], suddividendo equamente la durata tra i vari fruitori.","tag":["concentrato"],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Sinesteta","livelli":[6],"tag":[],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il fruitore è in grado di “vedere” attraverso la pelle. Ottiene una visione a 360° e non può essere fiancheggiato, impreparato, etc. L’effetto dura 1 ora per livello.","tag":[],"durata":{"q":1,"u":"ore","per":1}}],"esclusivo":null},{"nome":"Spettrale","livelli":[14],"tag":[],"comune":"","versioni":[{"v":"","liv":14,"testo":"Il corpo del fruitore assume i tratti dell’incorporeo: può muoversi attraverso oggetti e creature solide e i danni degli attacchi non magici sono dimezzati, ma può a sua volta attaccare solo con armi magiche o con i propri attacchi naturali e non può manipolare oggetti fisici. L’effetto dura 1 round per livello.","tag":[],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Spezza-fattura","livelli":[6],"tag":[],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il mutageno rimuove un singolo effetto di [MALEDIZIONE] presente sul fruitore ma non lo aiuta a liberarsi degli oggetti maledetti.","tag":[],"durata":null,"istantaneo":true}],"esclusivo":null},{"nome":"Svincolante","livelli":[8],"tag":["concentrato"],"comune":"","versioni":[{"v":"","liv":8,"testo":"Il fruitore può muoversi e attaccare normalmente per tutta la durata, anche se si trova sotto l’effetto di un incantesimo che normalmente gli renderebbe il movimento impossibile, come Lentezza, Nebbia solida, Paralisi o Ragnatela*. Il fruitore resiste automaticamente a qualsiasi manovra di Lottare e supera tutte le manovre di Lottare o di Artista della fuga per non essere più in lotta o immobilizzato. Il fruitore può anche muoversi e attaccare normalmente sott’acqua. L’effetto dura 10 minuti per livello.","tag":["concentrato"],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Telepatico","livelli":[10],"tag":["concentrato"],"comune":"","versioni":[{"v":"","liv":10,"testo":"Quando si utilizza questo mutageno si sceglie un fruitore principale al quale viene iniettata la prima dose. Questo mutageno è in grado di creare un legame telepatico fra i vari fruitori, ognuno dei quali deve avere un punteggio di Intelligenza pari a 3 o superiore. Le creature possono comunicare mentalmente tra loro attraverso questo legame come se stessero parlando normalmente. I fruitori beneficiano del legame solo quando si trovano entro 50 m dal fruitore principale. L’effetto dura 10 minuti per livello.","tag":["concentrato"],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":null},{"nome":"Tentacolare","livelli":[4],"tag":[],"comune":"","versioni":[{"v":"","liv":4,"testo":"Il mutageno fa crescere 1d4+1 tentacoli sul corpo del fruitore, i quali si agitano cercando di intercettare gli attacchi nemici. Quando il fruitore viene attaccato tramite un tiro per colpire, c’è una probabilità che un tentacolo prevenga tale colpo. Se l’attacco colpisce, si tira un dado con facce pari ai tentacoli rimasti + 1: con 1 è colpito il fruitore, altrimenti un tentacolo. Se viene colpito un tentacolo, questo si distrugge. Gli incantesimi ad area e gli effetti che non richiedono tiro per colpire colpiscono normalmente il fruitore e non distruggono nessun tentacolo. Gli incantesimi che richiedono un attacco a contatto vengono scaricati senza alcun danno se vengono intercettati da un tentacolo. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Valoroso","livelli":[4,10],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":4,"testo":"Questo mutageno infonde una grande fiducia in sé stessi e sprona alla battaglia. Il fruitore ottiene bonus morale +2 ai tiri per colpire, +2 Tiri Salvezza e +2 alle prove di abilità e di caratteristica. L’effetto dura 10 minuti per livello.","tag":[],"durata":{"q":10,"u":"min","per":1}},{"v":"2.0","liv":10,"testo":"Come la versione 1.0 ma i bonus diventano +4, si diventa immuni agli effetti di [PAURA] e si ottiene 1 Punto Ferita temporaneo per livello. L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":null},{"nome":"Veritiero","livelli":[6],"tag":[],"comune":"","versioni":[{"v":"","liv":6,"testo":"Il fruitore deve superare un Tiro Salvezza su Volontà con CD 10 + bonus di Intelligenza + metà livello di alchimista o non potrà mentire. Il mutageno non ha effetto se il fruitore sta combattendo o compie azioni intense. L’effetto dura 1 round per livello.","tag":[],"durata":{"q":1,"u":"round","per":1}}],"esclusivo":null},{"nome":"Vigile","livelli":[6],"tag":["concentrato"],"comune":"","versioni":[{"v":"","liv":6,"testo":"Mentre il fruitore è addormentato, mantiene alcuni dei suoi normali poteri percettivi. Finché è sintonizzato su suoni inoffensivi come il crepitio del fuoco, il frinire dei grilli, o il fruscio di una brezza leggera, il fruitore non subisce la normale penalità di +10 alla CD delle prove di Percezione per essere addormentato. Se il fruitore percepisce una minaccia o un rumore sospetto mentre dorme, può svegliarsi immediatamente ed alzarsi dalla sua posizione di riposo come azione gratuita. L’effetto dura 8 ore.","tag":["concentrato"],"durata":{"q":8,"u":"ore","per":0}}],"esclusivo":null},{"nome":"Del dottor Je-Kill","livelli":[4,6,8,10],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":4,"testo":"L’alchimista metabolico muta come per l’incantesimo Forma umanoide (ma con un aspetto distorto e mostruoso). L’effetto dura 1 minuto per livello.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"2.0","liv":6,"testo":"Come la versione 1.0 ma l’alchimista metabolico muta come per l’incantesimo Forma mostruosa I.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"3.0","liv":8,"testo":"Come la versione 1.0 ma l’alchimista metabolico muta come per l’incantesimo Forma mostruosa II.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"4.0","liv":10,"testo":"Come la versione 1.0 ma l’alchimista metabolico muta come per l’incantesimo Forma mostruosa III.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":"Alchimista metabolico"},{"nome":"Camaleontico","livelli":[1,8],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":1,"testo":"Il sabotatore ottiene +4 Furtività e può effettuare tali prove senza copertura od occultamento, ma solo mentre si muove a non più della metà della propria velocità base. Se si muove a più di metà velocità base durante il proprio turno, il sabotatore non ottiene alcun bonus a Furtività da questo mutageno fino all'inizio del proprio turno successivo. L’effetto dura 10 minuti per livello o se il sabotatore effettua un attacco.","tag":[],"durata":{"q":10,"u":"min","per":1}},{"v":"2.0","liv":8,"testo":"Come la versione 1.0 ma il bonus a Furtività diventa +8 e viene mantenuto fintanto che il sabotatore non si muove a più della propria velocità base.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":"Sabotatore"},{"nome":"Della montagna","livelli":[6,8,10,12],"tag":[],"comune":"Lo sherpa assume una forma elementale di Fulmine, Ghiaccio o Terra del Libro delle Forme Elementali, di cui si applicano le regole generali e la scheda. Per le capacità della forma, lo sherpa usa il proprio livello di alchimista come livello e come Dadi Vita. Mentre è in forma elementale non può creare né usare oggetti alchemici. L’effetto dura 1 minuto per livello.","versioni":[{"v":"1.0","liv":6,"testo":"Forma di taglia Piccola.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"2.0","liv":8,"testo":"Forma di taglia Media.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"3.0","liv":10,"testo":"Forma di taglia Grande.","tag":[],"durata":{"q":1,"u":"min","per":1}},{"v":"4.0","liv":12,"testo":"Forma di taglia Enorme.","tag":[],"durata":{"q":1,"u":"min","per":1}}],"esclusivo":"Sherpa"},{"nome":"Acquatico","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"","liv":1,"testo":"Quando non indossa un’armatura pesante, l’alchimista nautico può prendere 10 nelle prove di Nuotare e può trattenere fiato il doppio del tempo. L’effetto dura 10 minuti per livello. Speciale: Nelle campagne acquatiche, l’alchimista nautico ottiene invece una velocità di Nuotare pari a metà velocità su terreno e può trattenere fiato il doppio del tempo.","tag":[],"durata":{"q":10,"u":"min","per":1}}],"esclusivo":"Alchimista nautico"},{"nome":"Aerostatico","livelli":[1,6],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":1,"testo":"L’aerochimista ottiene bonus alchemico +5 Acrobazia (saltare) ed è sempre considerato in corsa quando effettua tali prove (la CD dei salti in lungo è pari a 5 per ogni 1,5 m mentre la CD dei salti in alto è pari a 4 per ogni 30 cm). L’effetto dura 1 minuto.","tag":[],"durata":{"q":1,"u":"min","per":0}},{"v":"2.0","liv":6,"testo":"Come la versione 1.0 ma il bonus alchemico alle prove di Acrobazia (saltare) diventa +10 e l’aerochimista ottiene i benefici del talento Mobilità (non deve soddisfarne i requisiti) contro gli attacchi di opportunità subiti durante il movimento effettuato durante l’attacco aereo.","tag":[],"durata":{"q":1,"u":"min","per":0}}],"esclusivo":"Aerochimista"},{"nome":"Batteriologico","livelli":[1],"tag":[],"comune":"","versioni":[{"v":"1.0","liv":1,"testo":"Questo mutageno rende infetti sangue, sudore, lacrime e gli altri fluidi corporei per 1 minuto. I nemici che nel proprio turno colpiscono in mischia il batteriologo con almeno un attacco naturale o senza portata, alla fine di quel turno devono superare un Tiro Salvezza su Tempra con CD 10 + metà livello di batteriologo + bonus di Intelligenza o diventano infermi per un numero di round pari al bonus di Intelligenza del batteriologo (successivi fallimenti resettano la durata di tale condizione). Questo è un effetto di [VELENO]. Come azione di movimento, un batteriologo sotto gli effetti di un mutageno Batteriologico può leccare un'arma da mischia per infettarla per la restante durata del mutageno o finché non colpisce un nemico. Una vittima colpita da un'arma infetta deve superare il Tiro Salvezza o diventare inferma, come descritto sopra. Un batteriologo supera automaticamente qualsiasi Tiro Salvezza derivante da questo mutageno.","tag":[],"durata":{"q":1,"u":"min","per":0}}],"esclusivo":"Batteriologo"}],"veleni":[{"nome":"Icore di scolopendra violacea","liv":1,"flavor":"Questo disgustoso parassita ha un icore altamente ustionante e debilitante.","tox":1,"ts":"Tempra","effetto":"La vittima subisce 1d4+1 danni. Inoltre, per 1 minuto subisce -1 ai tiri per colpire e -1 alle prove di abilità e di caratteristica.","pot":1},{"nome":"Olio di rosa palustre","liv":1,"flavor":"Distillato dalla macerazione di una rosa tipica degli acquitrini, questo veleno influisce sulle capacità cognitive.","tox":1,"ts":"Volontà","effetto":"La vittima è confusa per 1 round.","pot":1},{"nome":"Ortica del sonno","liv":1,"flavor":"Il veleno ricavato dalla bollitura di questa rara pianta ha un forte effetto intorpidente.","tox":1,"ts":"Volontà","effetto":"La vittima subisce per 1 minuto -2 ai Tiri Salvezza su Riflessi e riduce di 4 il proprio valore di Iniziativa per il combattimento in corso.","pot":1},{"nome":"Veleno di scorpione spettro","liv":1,"flavor":"Il trasparente e inquietante scorpione spettro utilizza il proprio veleno non tanto per attaccare ma per mettere in fuga i malintenzionati.","tox":1,"ts":"Volontà","effetto":"La vittima è spaventata per 1d4 round. Se supera il Tiro Salvezza, la vittima è scossa per 1 round. Le creature con 9 o più Dadi Vita sono immuni.","pot":1},{"nome":"Veleno di vipera reale","liv":1,"flavor":"Questo veleno attacca il sistema motorio in modo rapido e violento, rendendo difficile il poter reagire in modo efficace.","tox":1,"ts":"Tempra","effetto":"La vittima è inferma per 1 minuto.","pot":1},{"nome":"Zanna di topo tigre","liv":1,"flavor":"Questo roditore ha un morso velenoso che impedisce ai predatori di inseguirlo con efficacia.","tox":1,"ts":"Tempra","effetto":"La vittima è azzoppata per 1 minuto.","pot":1},{"nome":"Cuore di Finkert","liv":2,"flavor":"Questo fungo a forma di cuore può essere macerato per una settimana, al fine di ottenere una pasta mentalmente debilitante.","tox":1,"ts":"Volontà","effetto":"Nei suoi prossimi 2 turni, la vittima ha una probabilità del 50% di agire normalmente, altrimenti non compie alcuna azione.","pot":1},{"nome":"Roccia del morto","liv":2,"flavor":"Questo veleno viene ricavato da una pietra solforosa, la cui polvere ha a","effetto":"All’inizio di ogni suo turno per 5 round la vittima subisce 2d6 danni e, finché il veleno è attivo, non può recuperare Punti Ferita né Punti Fatica con alcun mezzo, magico o naturale. Superare il Tiro Salvezza riduce i danni a 1d6 per turno e la durata a 3 round.","pot":5},{"nome":"Acido di ninfea blu","liv":12,"flavor":"I pistilli di questa rara pianta acquatica possono essere usati per creare un forte agente ustionante.","tox":6,"ts":"Tempra","effetto":"La vittima subisce 5d8+12 danni. Se supera il Tiro Salvezza, la vittima subisce la metà dei danni.","pot":6},{"nome":"Essenza di wraith","liv":12,"flavor":"L’essenza gelida di uno spettro risucchia la vitalità e fiacca lo spirito.","tox":6,"ts":"Volontà","effetto":"La vittima subisce 1d4 danni a Costituzione e, per 1 ora, non recupera Punti Fatica tramite il Rifiatare. Superare il Tiro Salvezza dimezza il danno a Costituzione e annulla il blocco al recupero.","pot":6},{"nome":"Fermacuore","liv":12,"flavor":"A causa del potente effetto adrenalinico di questo veleno, la vittima vede il proprio battito cardiaco accelerare in modo sconvolgente.","tox":6,"ts":"Volontà","effetto":"La vittima deve superare un secondo Tiro Salvezza su Tempra per calmarsi oppure morire per arresto cardiaco. Se questo secondo tiro riesce, il soggetto subisce comunque 3d6 danni.","pot":6},{"nome":"Cicuta rossa","liv":13,"flavor":"Questa all’apparenza anonima pianta rossiccia nasconde un forte succo nauseante. Coloro che la conoscono si guardano bene dal toccarla.","tox":6,"ts":"Tempra","effetto":"La vittima è nauseata per 1d4 round.","pot":6},{"nome":"Fiele di chimera","liv":13,"flavor":"La bile ustionante di una chimera acceca e stordisce.","tox":6,"ts":"Tempra","effetto":"La vittima subisce 3d8 danni ed è abbagliata e offuscata 40% per 1 minuto. Superare il Tiro Salvezza dimezza i danni e riduce la durata a 1 round.","pot":6},{"nome":"Veleno di naga","liv":13,"flavor":"Il veleno di una naga scardina il sistema nervoso, rendend
