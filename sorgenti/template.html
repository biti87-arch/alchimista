<title>Laboratorio Alchemico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: colonna unica da banco di laboratorio, schede a etichetta; il colore distingue bombe, mutageni e veleni. */
:root{
  --bg:#EDF0EB; --surface:#F9FAF7; --surface2:#E0E5DD; --line:#C6CDC3;
  --ink:#19201B; --muted:#5A645C; --accent:#1F5E57; --accent-ink:#FFFFFF; --brass:#80601F;
  --bomb:#A2461B; --mut:#1F6E62; --vel:#6A3E8C;
  --cond:#B3121B; --good:#2E6B4A; --warn:#9A5B12; --adv:#1E7A1E; --mark:#E2E9DC;
  --f-display:"Spectral SC", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513; --surface:#191F1C; --surface2:#242C28; --line:#35403A;
    --ink:#E5EAE5; --muted:#99A49C; --accent:#6CC2B3; --accent-ink:#0B1916; --brass:#D2AE66;
    --bomb:#E8915F; --mut:#6CC2B3; --vel:#C59EE6;
    --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A; --adv:#5FBF5F; --mark:#21302A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#191F1C; --surface2:#242C28; --line:#35403A;
  --ink:#E5EAE5; --muted:#99A49C; --accent:#6CC2B3; --accent-ink:#0B1916; --brass:#D2AE66;
  --bomb:#E8915F; --mut:#6CC2B3; --vel:#C59EE6;
  --cond:#FF6B6B; --good:#7CC79B; --warn:#E3A55A; --adv:#5FBF5F; --mark:#21302A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:0 16px 80px}
.wrap{max-width:760px;margin:0 auto;min-width:0}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:700;font-size:1.4rem;margin:0;letter-spacing:.02em;text-wrap:balance}
.pg{display:flex;gap:6px;align-items:center;min-width:0}
.pg select{max-width:46vw;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);font:600 .85rem var(--f-body)}
.hsub{color:var(--muted);font-size:.8rem;margin-top:4px;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px;margin-top:10px}
nav.tabs button{flex:1;padding:9px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:600 .82rem var(--f-body);cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.panel{display:grid;gap:16px;padding-top:16px}
h2{font-family:var(--f-display);font-weight:500;font-size:1.12rem;margin:0 0 8px;letter-spacing:.03em;color:var(--brass);text-wrap:balance}
h3{font-size:.95rem;margin:0}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.hrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hrow h2{margin:0}
.stack{display:grid;gap:10px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.field{display:grid;gap:3px;min-width:0}
.field input,.field select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 .95rem var(--f-mono)}
.field select{font-family:var(--f-body);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;font:600 .85rem var(--f-body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.danger{color:var(--cond);border-color:var(--cond)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:7px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;font:600 .82rem var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{opacity:.45}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:500 .8rem var(--f-body);cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.lock{border-style:dashed;cursor:default}
.chip.lock[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:var(--surface)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.chip.num{font-family:var(--f-mono);min-width:38px;text-align:center}
.tag{font:500 .68rem var(--f-mono);padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.tag.B{background:var(--bomb);color:var(--surface)}
.tag.M{background:var(--mut);color:var(--surface)}
.tag.V{background:var(--vel);color:var(--surface)}
.tag.G{background:var(--brass);color:var(--surface)}
.tag.no{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.tag.ok{background:transparent;border:1px solid var(--good);color:var(--good)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
.kv b{display:block;font:500 1.1rem var(--f-mono);font-variant-numeric:tabular-nums}
.kv small{display:block;color:var(--muted);font-size:.72rem}
.txt{font-size:.9rem;min-width:0}
.txt p{margin:4px 0}
.note{font-size:.82rem;color:var(--muted)}
.banner{background:var(--mark);border-radius:8px;padding:8px 12px;font-size:.85rem}
.banner.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.banner ul{margin:4px 0 0;padding-left:18px}
.cond{color:var(--cond);font-weight:600}
.adv{background:var(--adv);color:#fff;padding:0 3px;border-radius:3px}
.dis{background:var(--cond);color:#fff;padding:0 3px;border-radius:3px}
.etq{font:600 .78rem var(--f-mono);color:var(--brass)}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 10px;min-width:0}
details+details{margin-top:6px}
details summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"▸";color:var(--muted);font-weight:400}
details[open] summary::after{content:"▾"}
details .txt{margin-top:6px}
.it{display:grid;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.it .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.it .nm{font-weight:600}
.it .qta{font:600 1.05rem var(--f-mono);font-variant-numeric:tabular-nums}
.ln{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-block:3px;font-size:.88rem}
.ln span:last-child{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.ctr{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.ctr b{font:600 1.02rem var(--f-mono);min-width:58px;text-align:center;font-variant-numeric:tabular-nums}
.ctr .pips{display:flex;gap:6px;align-items:center}
.big{font:600 2rem var(--f-mono);font-variant-numeric:tabular-nums;line-height:1}
.esito{border:1px solid var(--accent);border-radius:8px;padding:10px 12px;background:var(--mark)}
.esito .tot{font:600 1.6rem var(--f-mono)}
.dadi{font:500 .8rem var(--f-mono);color:var(--muted)}
.opt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.opt.bad{border-color:var(--warn)}
.list{display:grid;gap:6px}
.overlay{position:fixed;inset:0;background:rgba(8,12,10,.55);z-index:20;display:flex;justify-content:center;align-items:flex-end}
.overlay .card{width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.search{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
table.t{width:100%;border-collapse:collapse;font-size:.82rem}
table.t th,table.t td{padding:4px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
table.t td.n{font-family:var(--f-mono);white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr.oltre td{color:var(--muted);opacity:.6}
.scroll{overflow-x:auto}
.tempo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:30;max-width:90vw}
@media (prefers-reduced-motion:no-preference){.esito{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>
<div class="wrap">
<header class="top">
  <div class="brand">
    <h1>Laboratorio Alchemico</h1>
    <div class="pg">
      <select id="pgSel" aria-label="Personaggio"></select>
      <button class="btn sm" data-a="pgNuovo" type="button">Nuovo</button>
    </div>
  </div>
  <div class="hsub" id="hsub"></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="scheda" type="button">Scheda</button>
    <button role="tab" data-tab="alba" type="button">Alba</button>
    <button role="tab" data-tab="borsa" type="button">Borsa</button>
    <button role="tab" data-tab="manuale" type="button">Manuale</button>
  </nav>
</header>
<main id="main"></main>
<div id="ov"></div>
<div id="toast" class="toast" hidden></div>
</div>
<script>__MOTORE__</script>
<script>
'use strict';
const D = __DATI__;
M.init(D);
const KEY = 'alchimista.v1';
const COND = ['affaticat[oaie]','esaust[oaie]','abbagliat[oaie]','accecat[oaie]','assordat[oaie]','barcollant[ei]','confus[oaie]','frastornat[oaie]',
  'immobilizzat[oaie]','inferm[oaie]','intralciat[oaie]','nauseat[oaie]','paralizzat[oaie]','scoss[oaie]','spaventat[oaie]','pietrificat[oaie]',
  'pron[oaie]','stordit[oaie]','offuscat[oaie]','azzoppat[oaie]','indifes[oaie]','colt[oi] alla sprovvista','impreparat[oaie]','priv[oaie] di sensi',
  'in lotta','sanguinant[ei]','incorpore[oaie]','in preda al panico','accovacciat[oaie]','affascinat[oaie]','inabil[ei]'];
const RCOND = new RegExp('\\b(' + COND.join('|') + ')\\b', 'gi');
const KIND = { B: 'bomba', M: 'mutageno', V: 'veleno', C: 'cocktail' };

/* ---------- stato ---------- */
function nuovoPg(nome) {
  return { id: 'p' + Date.now().toString(36) + Math.floor(Math.random() * 1e4), nome: nome || 'Nuovo alchimista', liv: 1, int: 3, campo: 'bombarolo', arch: '',
    doti: [], formule: [], opz: {}, giorno: null, inv: [], eff: [], t: 0, cnt: {}, ultimo: null };
}
function esempio() {
  const s = nuovoPg('Esempio: bombarolo di 5°');
  Object.assign(s, { liv: 5, int: 4, campo: 'bombarolo', doti: ['Bombe fumogene', 'Bombe subacquee'],
    formule: ['B|Acida|1', 'B|Acida|3', 'B|Acida|5', 'B|Incendiaria|1', 'B|Incendiaria|3', 'B|Incendiaria|5', 'B|Sonica|1', 'B|Sonica|3', 'B|Folgorante|1',
      'M|Curativo|1.0', 'M|Curativo|2.0', 'M|Antitossina|1.0', 'M|Della speditezza|', 'V|Veleno di vipera reale', 'V|Zanna di topo tigre'],
    opz: { diluite: ['Incendiaria'] } });
  return s;
}
let G;
try { const r = localStorage.getItem(KEY); if (r) G = JSON.parse(r); } catch (e) { G = null; }
if (!G || !G.pg || !G.pg[G.attivo]) { const s = esempio(); G = { attivo: s.id, pg: { [s.id]: s }, tab: 'scheda' }; }
let S = G.pg[G.attivo];
const UI = { filtroDoti: 'tutte', cercaDoti: '', soloDisp: true, cercaMut: '', man: 'tutto', cercaMan: '', prep: null, rapida: null, conferma: null, inocula: {}, bersaglio: {}, gas: {} };
function save() { G.pg[G.attivo] = S; try { localStorage.setItem(KEY, JSON.stringify(G)); } catch (e) {} }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }

/* ---------- testo ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmt(s) {
  return esc(s).replace(RCOND, m => '<span class="cond">' + m + '</span>')
    .replace(/\b(vantaggio)\b/gi, '<span class="adv">$1</span>').replace(/\b(svantaggio)\b/gi, '<span class="dis">$1</span>');
}
function paras(lista) {
  return (lista || []).map(x => {
    if (typeof x === 'string') {
      const m = x.match(/^([A-ZÀ-Ü][\wà-ü’' ()]{1,40}):\s(.*)$/s);
      return m && m[1].length < 40 ? `<p><b>${esc(m[1])}:</b> ${fmt(m[2])}</p>` : `<p>${fmt(x)}</p>`;
    }
    return `<div class="scroll"><table class="t">${x.tab.map((r, i) => '<tr>' + r.map(c => i ? `<td>${fmt(c)}</td>` : `<th>${esc(c)}</th>`).join('') + '</tr>').join('')}</table></div>`;
  }).join('');
}
const segno = n => (n >= 0 ? '+' : '') + n;
const ord = n => n + '°';

/* ---------- intestazione ---------- */
function header() {
  const sel = document.getElementById('pgSel');
  sel.innerHTML = Object.values(G.pg).map(p => `<option value="${p.id}"${p.id === S.id ? ' selected' : ''}>${esc(p.nome)}</option>`).join('');
  const c = M.campo(S);
  const rg = S.giorno ? `Reagenti ${S.giorno.reag}` : 'Nessuna alba';
  document.getElementById('hsub').textContent = `${S.arch || (c ? c[0].toUpperCase() + c.slice(1) : 'Alchimista')} · ${ord(S.liv)} livello · Int ${segno(S.int)} · ${rg} · ${tempoTxt(S.t)}`;
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === G.tab)));
}
function tempoTxt(t) { return 'tempo ' + (t > 0 ? M.fmtDurata(t, 'ore') : '0 round'); }

/* ================= SCHEDA ================= */
function vScheda() {
  const c = M.campo(S), ad = M.archDati(S), a = M.arch(S);
  const forz = !!(ad && ad.campo);
  const W = M.validaFormulario(S);
  const dW = verificaDoti();
  let h = `<div class="card stack"><h2>Personaggio</h2>
  <div class="grid">
    <label class="field"><span class="label">Nome</span><input id="f-nome" data-f="nome" value="${esc(S.nome)}"></label>
    <label class="field"><span class="label">Livello</span><select id="f-liv" data-f="liv">${Array.from({ length: 20 }, (_, i) => `<option${i + 1 === S.liv ? ' selected' : ''}>${i + 1}</option>`).join('')}</select></label>
    <label class="field"><span class="label">Bonus di Int</span><input id="f-int" data-f="int" type="number" inputmode="numeric" min="-5" max="15" value="${S.int}"></label>
  </div>
  <div class="field"><span class="label">Archetipo</span><select id="f-arch" data-f="arch"><option value="">Nessuno</option>${D.archetipi.map(x => `<option${x.nome === S.arch ? ' selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></div>
  <div class="field"><span class="label">Campo di ricerca${forz ? ' (imposto dall’archetipo)' : ''}</span>
    <div class="seg">${M.CAMPI.map(x => `<button type="button" data-a="campo" data-v="${x}" aria-pressed="${x === c}"${forz ? ' disabled' : ''}>${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}</div></div>
  ${a.sceltaEsclusione ? `<div class="field"><span class="label">Mescicure: tipo di oggetto escluso dal formulario</span><div class="seg">
     ${[['B', 'Bombe'], ['V', 'Veleni']].map(([k, n]) => `<button type="button" data-a="opz" data-k="escludi" data-v="${k}" aria-pressed="${(S.opz.escludi || '') === k}">${n}</button>`).join('')}</div></div>` : ''}
  </div>`;
  h += riepilogo();
  h += cardDoti(dW);
  h += cardFormulario(W);
  h += cardOpzioni();
  h += cardPrivilegi();
  return h;
}
function riepilogo() {
  const inib = M.inibitoriMax(S);
  const cdCap = 10 + Math.floor(S.liv / 2) + S.int;
  const ta = (M.haDote(S, 'Tossicità aumentata') ? 1 : 0) + (M.haDote(S, 'Tossicità aumentata superiore') ? 1 : 0);
  const furt = M.attaccoFurtivo(S);
  const tiles = [
    [M.reagentiGiorno(S), 'reagenti al giorno' + (S.liv >= 20 ? ' (+2d4+2)' : '')],
    [inib === Infinity ? '∞' : inib, 'agenti inibitori'],
    ['10+tox' + segno(S.int + ta), 'CD dei veleni'],
    [cdCap, 'CD capacità (10 + ½ liv + Int)'],
    [M.livMutageni(S), 'livello per i mutageni'],
    [M.maxFruitori(S), 'fruitori dei concentrati'],
  ];
  if (M.haDote(S, 'Bombe potenti')) tiles.push([segno(M.mezzoInt(S.int)), 'Bombe potenti' + (S.arch === 'Piromane' ? ' (incendiarie)' : '')]);
  if (furt) tiles.push([furt + 'd6', 'attacco furtivo']);
  if (S.liv >= 15) tiles.push([cdCap, 'CD Sangue nauseabondo']);
  if (S.liv >= 9) tiles.push([2 * S.liv, 'PF di Bio-reazione']);
  return `<div class="card"><h2>Riepilogo</h2><div class="kv">${tiles.map(([b, s]) => `<div><b>${esc(b)}</b><small>${esc(s)}</small></div>`).join('')}</div></div>`;
}
function verificaDoti() {
  const W = [];
  const slot = M.slotDoti(S);
  if (S.doti.length > slot.length) W.push(`Doti scelte: ${S.doti.length}, posti disponibili: ${slot.length}.`);
  for (const n of [...new Set(S.doti)]) {
    const d = M.dote(n); if (!d) { W.push(`${n}: dote sconosciuta.`); continue; }
    const r = M.requisiti(S, d);
    if (!r.ok) W.push(`${n}: requisiti non soddisfatti (${r.no.join('; ')}).`);
  }
  return W;
}
function catTag(c) { return { bombe: '<span class="tag B">bombe</span>', mutageni: '<span class="tag M">mutageni</span>', veleni: '<span class="tag V">veleni</span>', generiche: '<span class="tag G">generica</span>', ladro: '<span class="tag">ladro</span>' }[c] || ''; }
function cardDoti(W) {
  const slot = M.slotDoti(S);
  const auto = M.dotiAuto(S);
  const ad = M.archDati(S);
  let h = `<div class="card stack"><div class="hrow"><h2>Doti</h2><span class="etq">${S.doti.length} / ${slot.length} posti</span></div>`;
  if (slot.length) h += `<div class="note">Posti dote ai livelli ${slot.map(ord).join(', ')}${ad && ad.doti_sostituite.length ? ` (l’archetipo sostituisce ${ad.doti_sostituite.map(ord).join(', ')})` : ''}.</div>`;
  if (auto.length) h += `<div class="list">${auto.map(d => `<div class="opt"><div><b>${esc(d.nome)}</b> ${catTag((M.dote(d.nome) || {}).cat)}<div class="note">${esc(d.fonte)}</div></div><span class="tag ok">ottenuta</span></div>`).join('')}</div>`;
  if (S.doti.length) h += `<div class="list">${S.doti.map((n, i) => {
    const d = M.dote(n); const r = d ? M.requisiti(S, d) : { ok: true, ver: [] };

function alba() {

  const it = trova(id); if (!it) return;
  const v = M.veleno(it.k.split('|')[1]);
  S.eff.push({ id: 'e' + Date.now().toString(36), nome: 'Arma avvelenata: ' + nomeItem(it), fine: S.t + M.permanenzaVeleno(S) * 600, unit: 'ore', nota: `CD ${M.cdVeleno(S, v, it.opz.alt)} ${M.tsVeleno(v, it.opz.alt)}, fino al primo colpo` });
  S.ultimo = `<div class="label">${esc(nomeItem(it))} applicato</div><div class="txt">Resta sull’arma ${M.permanenzaVeleno(S)} ore o fino al primo colpo a segno. CD ${M.cdVeleno(S, v, it.opz.alt)} (${esc(M.tsVeleno(v, it.opz.alt))}).</div>`;
  usa(it, 1); save();
}

/* ================= MANUALE ================= */
function vManuale() {
  const f = UI.man, q = UI.cercaMan.toLowerCase();
  const voci = [];
  const add = (cat, nome, html, testo) => voci.push({ cat, nome, html, testo: (nome + ' ' + testo).toLowerCase() });
  for (const p of D.privilegi) add('privilegi', p.nome, paras(p.testo), p.testo.join(' '));
  for (const [k, sez] of Object.entries(D.regole)) for (const r of (Array.isArray(sez) ? sez : [])) if (r.nome) add('regole', `${r.nome} (${k})`, paras(r.testo), r.testo.join(' '));
  for (const b of D.bombe) add('bombe', 'Bomba ' + b.nome.toLowerCase() + (b.esclusiva ? ' (' + b.esclusiva + ')' : ''), `<p class="note">${esc(b.ingr)}</p>${paras(b.testo)}`, b.testo.join(' '));
  for (const m of D.mutageni) add('mutageni', m.nome + (m.esclusivo ? ' (' + m.esclusivo + ')' : ''), `<p class="note">Livello ${m.livelli.join(', ')}${m.tag.length ? ' · ' + esc(m.tag.join(', ')) : ''}</p>${m.comune ? `<p>${fmt(m.comune)}</p>` : ''}${m.versioni.map(v => `<p>${v.v ? `<b>${v.v}:</b> ` : ''}${fmt(v.testo)}</p>`).join('')}`, m.versioni.map(v => v.testo).join(' '));
  for (const v of D.veleni) add('veleni', v.nome, `<p class="note">Liv. ${v.liv} · potenza ${v.pot} · tossicità ${segno(v.tox)} · ${esc(v.ts)}</p><p><i>${fmt(v.flavor)}</i></p><p>${fmt(v.effetto)}</p>`, v.effetto);
  for (const d of D.doti) add('doti', d.nome + (d.esclusiva ? ' (' + d.esclusiva + ')' : ''), `<p>${catTag(d.cat)} ${d.mod != null ? `<span class="tag">modifica +${d.mod}</span>` : ''}${d.pot != null ? `<span class="tag">potenziamento +${d.pot}</span>` : ''}</p>${d.req ? `<p><b>Requisiti:</b> ${fmt(d.req.testo)}</p>` : ''}${paras(d.testo)}${d.speciale.map(s => `<p><b>Speciale:</b> ${fmt(s)}</p>`).join('')}`, d.testo.filter(x => typeof x === 'string').join(' '));
  for (const a of D.archetipi) add('archetipi', a.nome, `<p class="note">${fmt(a.flavor)}</p>${a.voci.map(v => `<h3>${esc(v.nome)}</h3>${paras(v.testo)}${v.dicitura ? `<p class="note"><i>${esc(v.dicitura)}</i></p>` : ''}`).join('')}`, a.voci.map(v => v.testo.filter(x => typeof x === 'string').join(' ')).join(' '));
  let lista = voci.filter(v => (f === 'tutto' || v.cat === f) && (!q || v.testo.includes(q)));
  const tot = lista.length;
  if (!q && f === 'tutto') lista = lista.slice(0, 40);
  const cats = [['tutto', 'Tutto'], ['privilegi', 'Privilegi'], ['regole', 'Regole'], ['bombe', 'Bombe'], ['mutageni', 'Mutageni'], ['veleni', 'Veleni'], ['doti', 'Doti'], ['archetipi', 'Archetipi']];
  return `<div class="card stack"><h2>Manuale dell’alchimista</h2><p class="note">Testi da ${esc(D.fonte)}.</p>
    <input class="search" id="q-man" data-f="cercaMan" placeholder="Cerca nel manuale" value="${esc(UI.cercaMan)}">
    <div class="chips">${cats.map(([k, n]) => `<button class="chip" type="button" data-a="man" data-v="${k}" aria-pressed="${f === k}">${n}</button>`).join('')}</div>
    <div class="note">${tot} voci${lista.length < tot ? ', le prime ' + lista.length + ': scegli una categoria o cerca' : ''}</div>
    <div>${lista.map(v => `<details><summary><span>${esc(v.nome)}</span></summary><div class="txt">${v.html}</div></details>`).join('')}</div></div>`;
}

/* ================= render ed eventi ================= */
let inRender = false, pendente = false;
function render() {
  if (inRender) { pendente = true; return; }
  inRender = true;
  try { renderOra(); } finally { inRender = false; }
  if (pendente) { pendente = false; render(); }
}
function renderOra() {
  header();
  const m = document.getElementById('main');
  const views = { scheda: vScheda, alba: vAlba, borsa: vBorsa, manuale: vManuale };
  m.innerHTML = `<section class="panel">${(views[G.tab] || vScheda)()}</section>`;
  document.getElementById('ov').innerHTML = UI.ov === 'doti' ? `<div class="overlay" data-a="chiudiFuori">${overlayDoti()}</div>` : '';
}
function rifocus(id, fn) { fn(); const el = document.getElementById(id); if (el) { el.focus(); const v = el.value; try { el.setSelectionRange(v.length, v.length); } catch (e) {} } }
document.addEventListener('click', ev => {
  const tab = ev.target.closest('[data-tab]');
  if (tab) { G.tab = tab.dataset.tab; save(); render(); window.scrollTo(0, 0); return; }
  const b = ev.target.closest('[data-a]');
  if (!b || !b.dataset.a) return;
  const a = b.dataset.a, v = b.dataset.v, k = b.dataset.k, id = b.dataset.id;
  if (a === 'chiudiFuori' && ev.target !== b) return;
  switch (a) {
    case 'pgNuovo': { const s = nuovoPg(); G.pg[s.id] = s; G.attivo = s.id; S = s; G.tab = 'scheda'; UI.prep = UI.rapida = null; break; }
    case 'campo': S.campo = v; break;
    case 'opz': S.opz[k] = v; break;
    case 'apriDoti': UI.ov = 'doti'; break;
    case 'chiudi': case 'chiudiFuori': UI.ov = null; break;
    case 'filtroDoti': UI.filtroDoti = v; break;
    case 'soloDisp': UI.soloDisp = !UI.soloDisp; break;
    case 'aggDote': S.doti.push(v); toast('Aggiunta: ' + v); break;
    case 'togliDote': S.doti.splice(+b.dataset.i, 1); break;
    case 'formula': { const i = S.formule.indexOf(k); if (i >= 0) S.formule.splice(i, 1); else S.formule.push(k); break; }
    case 'diluita': { const l = S.opz.diluite = S.opz.diluite || []; const i = l.indexOf(v); if (i >= 0) l.splice(i, 1); else { l.push(v); while (l.length > M.diluiteMax(S)) l.shift(); } break; }
    case 'economico': { const l = S.opz.economici = S.opz.economici || []; const i = l.indexOf(k); if (i >= 0) l.splice(i, 1); else { l.push(k); while (l.length > 2) l.shift(); } break; }
    case 'espanso': { const l = S.opz.espanso = S.opz.espanso || []; l[+b.dataset.i] = +v; break; }
    case 'alba': UI.conferma = 'alba'; break;
    case 'annulla': UI.conferma = null; break;
    case 'albaOk': UI.conferma = null; alba(); break;
    case 'chiudiBase': S.giorno.base = false; break;
    case 'prepTipo': UI.prep.tipo = v; UI.prep.k = ''; UI.prep.mods = []; UI.prep.pot = []; UI.prep.coc = ''; UI.prep.alt = false; break;
    case 'prepMod': { const l = UI.prep.mods; const i = l.indexOf(v); if (i >= 0) l.splice(i, 1); else l.push(v); break; }
    case 'prepPot': { const l = UI.prep.pot; const i = l.indexOf(v); if (i >= 0) l.splice(i, 1); else l.push(v); break; }
    case 'prepAlt': UI.prep.alt = !UI.prep.alt; break;
    case 'prepN': UI.prep.n += +v; break;
    case 'prepara': prepara(); break;
    case 'avanza': avanza(+v); break;
    case 'reag': if (S.giorno) S.giorno.reag = Math.max(0, S.giorno.reag + +v); break;
    case 'cnt': S.cnt[k] = Math.max(0, (S.cnt[k] || 0) + +v); break;
    case 'rapida': {
      if (!S.giorno || S.giorno.reag < 1) { toast('Nessun reagente nella borsa.'); break; }
      const rk = UI.rapida.k; const p = rk.split('|');
      const it = p[0] === 'B' ? { kind: 'B', k: rk, opz: { liv: +p[2], mods: [] } } : p[0] === 'M' ? { kind: 'M', k: rk, opz: {} } : { kind: 'V', k: rk, opz: { pot: [], alt: false } };
      it.qta = 1; it.fonte = 'rapida'; it.scade = S.t + 10; aggiungiInv(it); S.giorno.reag -= 1; toast('Creato: ' + nomeItem(it)); break;
    }
    case 'chiudiEsito': S.ultimo = null; break;
    case 'finisci': S.eff = S.eff.filter(e => e.id !== id); break;
    case 'lancia': lancia(id); break;
    case 'gas': UI.gas[id] = !UI.gas[id]; break;
    case 'inoc': { const I = UI.inocula[id] = UI.inocula[id] || { n: 1, alleati: 0 }; I[k] = (I[k] || 0) + +v; break; }
    case 'inocula': inocula(id); break;
    case 'applica': applica(id); break;
    case 'scarta': S.inv = S.inv.filter(x => x.id !== id); break;
    case 'decat': {
      const i1 = document.getElementById('dc-1').value, i2 = document.getElementById('dc-2').value;
      const a1 = trova(i1), a2 = trova(i2);
      if (!a1 || !a2 || (i1 === i2 && a1.qta < 2)) { toast('Scegli due oggetti.'); break; }
      usa(a1, 1); if (i1 === i2) usa(a1, 1); else usa(a2, 1);
      S.giorno.reag += 1; S.cnt.decatalizzante = 1; toast('+1 reagente infuso.'); break;
    }
    case 'man': UI.man = v; break;
    default: return;
  }
  save(); render();
});
document.addEventListener('input', ev => {
  const f = ev.target.dataset && ev.target.dataset.f; if (!f) return;
  const val = ev.target.value;
  if (f === 'nome') { S.nome = val; save(); header(); return; }
  if (f === 'cercaDoti' || f === 'cercaMut' || f === 'cercaMan') { UI[f] = val; rifocus(ev.target.id, render); return; }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.id === 'pgSel') { G.attivo = el.value; S = G.pg[G.attivo]; UI.prep = UI.rapida = null; save(); render(); return; }
  const f = el.dataset && el.dataset.f; if (!f) return;
  const val = el.value;
  if (f === 'liv') S.liv = +val;
  else if (f === 'int') S.int = Math.max(-5, Math.min(15, parseInt(val, 10) || 0));
  else if (f === 'arch') { S.arch = val; const ad = M.archDati(S); if (ad && ad.campo) S.campo = ad.campo; }
  else if (f === 'nuovoConc' || f === 'vperfetto') S.opz[f] = val;
  else if (f === 'prep.k') { UI.prep.k = UI.prep.tipo === 'B' ? val : val; UI.prep.liv = 0; UI.prep.mods = []; UI.prep.coc = ''; }
  else if (f === 'prep.liv') UI.prep.liv = +val;
  else if (f === 'prep.coc') UI.prep.coc = val;
  else if (f === 'rapida.k') UI.rapida.k = val;
  else if (f === 'bersaglio') UI.bersaglio[el.dataset.id] = val;
  else if (f === 'misc') {
    const a1 = trova(el.dataset.id), a2 = trova(val);
    if (a1 && a2) {
      const v1 = M.veleno(a1.k.split('|')[1]), v2 = M.veleno(a2.k.split('|')[1]);
      const forte = v1.tox >= v2.tox ? a1 : a2;
      usa(a1, 1); usa(a2, 1);
      aggiungiInv({ kind: 'V', k: forte.k, opz: { pot: [], alt: false, misto: [v1.nome, v2.nome] }, qta: 1, fonte: 'base', scade: null });
      toast(`Miscela: 1 dose con tossicità ${segno(Math.max(v1.tox, v2.tox))}.`);
    }
  }
  else if (f === 'nome') return;
  save(); render();
});
render();
</script>
